<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Régie Quiz — Joueur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0D0F22; --bg-2:#12152C; --surface:#1A1E3C; --surface-2:#232848; --surface-3:#2C3255;
  --line:#2F3560; --line-soft:#242949;
  --text:#F2EFE6; --text-2:#C2C6E2; --text-3:#9AA0C6;
  --gold:#F5B841; --gold-ink:#241A03; --gold-dim:rgba(245,184,65,.16);
  --rose:#FF5470; --rose-dim:rgba(255,84,112,.16);
  --mint:#35D6A0; --mint-ink:#03231A; --mint-dim:rgba(53,214,160,.16);
  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:26px;
  --f-display:"Antonio","Arial Narrow",sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--f-body); font-size:17px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; line-height:1.15; text-wrap:balance}
button,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:6px}

.app{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
/* La barre et le chrono restent collés en haut : on doit voir le temps
   qui reste même en ayant fait défiler la page. */
.top{position:sticky; top:0; z-index:10; flex:none}
.bar{
  display:flex; align-items:center; gap:10px; padding:9px 14px;
  background:var(--bg-2); border-bottom:1px solid var(--line-soft);
}
.mark{
  width:13px; height:13px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 32% 30%, #FFF0C6 0 18%, var(--gold) 42%, #B67C10 100%);
  box-shadow:0 0 10px rgba(245,184,65,.5);
}
.brand{font-family:var(--f-display); font-size:1.1rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase}
.brand em{font-style:normal; color:var(--gold)}
.bar .who{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--text-3)}
.bar .who b{color:var(--text); font-weight:600}
.pastille{
  font-family:var(--f-mono); font-size:.72rem; padding:2px 8px; border-radius:999px;
  background:var(--surface-2); color:var(--text-3); border:1px solid var(--line-soft);
}

.timer{height:5px; background:var(--surface-2); flex:none; overflow:hidden}
.timer i{display:block; height:100%; width:100%; background:var(--gold); transition:width .25s linear}
.timer.warn i{background:var(--rose)}

.zone{flex:1; min-height:0; display:flex; align-items:stretch}
main{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center;
     padding:20px 16px 32px; gap:18px; width:100%; max-width:720px; margin:0 auto}

.eyebrow{
  font-family:var(--f-display); font-size:.82rem; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--text-3); text-align:center;
}
.qtext{font-size:clamp(1.25rem,4.5vw,1.8rem); font-weight:600; text-align:center}
.chrono{
  margin-left:auto; font-family:var(--f-mono); font-size:1.45rem; font-weight:500;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; line-height:1;
  padding:2px 4px; color:var(--text);
}
/* Les cinq dernières secondes doivent se voir du coin de l'oeil, sans que le
   joueur ait à quitter le média des yeux. */
.chrono.warn{
  color:var(--rose); animation:bat .9s ease-in-out infinite;
  transform:scale(1.18); transform-origin:center;
}
.chrono.fini{color:var(--rose)}
/* Chrono gelé par l'animateur : on le montre, pour que personne ne croie
   que la page a planté. */
.chrono.gele{color:var(--gold); animation:none}
.timer.gele i{background:var(--gold); opacity:.55}
@keyframes bat{0%,100%{opacity:1}50%{opacity:.4}}

.card{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-l); padding:18px}
.field{display:flex; flex-direction:column; gap:7px; width:100%}
label{font-family:var(--f-display); font-size:.8rem; font-weight:600; letter-spacing:.12em;
      text-transform:uppercase; color:var(--text-3)}
input[type=text]{
  width:100%; padding:13px 14px; border-radius:var(--r-m); border:1px solid var(--line);
  background:var(--surface-2); color:var(--text); font-size:1.05rem;
}
input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,184,65,.3)}
input::placeholder{color:var(--text-3)}
#code{text-transform:uppercase; letter-spacing:.35em; font-family:var(--f-mono); text-align:center; font-size:1.4rem}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 20px; border-radius:var(--r-m); cursor:pointer; border:1px solid var(--line);
  background:var(--surface-2); font-weight:600; font-size:1rem; transition:transform .1s, filter .15s;
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-gold{background:var(--gold); color:var(--gold-ink); border-color:transparent}
.btn-rose{background:var(--rose); color:#FFF6F8; border-color:transparent}
.btn-lg{width:100%; padding:16px; font-size:1.08rem}

.choices{display:grid; gap:10px; width:100%}
.choice{
  display:flex; align-items:center; gap:14px; padding:15px 16px; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  cursor:pointer; font-size:1.05rem; transition:border-color .15s, background .15s;
}
.choice .lt{
  width:36px; height:36px; flex:none; display:grid; place-items:center; border-radius:10px;
  background:var(--surface-3); font-family:var(--f-display); font-weight:700; font-size:1.15rem;
}
.choice.on{border-color:var(--gold); background:var(--gold-dim)}
.choice.on .lt{background:var(--gold); color:var(--gold-ink)}
.choice.good{border-color:var(--mint); background:var(--mint-dim)}
.choice.good .lt{background:var(--mint); color:var(--mint-ink)}
.choice:disabled{cursor:default}

.media{width:100%; display:flex; flex-direction:column; align-items:center; gap:10px}
.media img{max-width:100%; max-height:46vh; border-radius:var(--r-l); display:block}
.media video,.media iframe{width:100%; border-radius:var(--r-l); background:#000;
  aspect-ratio:16/9; border:0; display:block}
.media audio{width:100%}

/* Sur un téléphone, une image de question se lit mal dans un coin d'écran.
   Le bouton reste discret : il ne doit pas manger le média. */
.plein{
  align-self:flex-end; display:inline-flex; align-items:center; gap:6px;
  padding:5px 11px; border-radius:999px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line-soft);
  color:var(--text-2); font-size:.82rem;
}
.plein:hover{border-color:var(--gold); color:var(--gold)}
/* En plein écran, l'élément est seul : on le centre sur fond noir. */
.media img:fullscreen, .media video:fullscreen{
  max-height:100%; max-width:100%; width:auto; height:auto;
  background:#000; border-radius:0; object-fit:contain;
}
/* Repli quand le navigateur refuse le plein écran, ou ne le propose pas du
   tout pour une image — c'est le cas sur iPhone. On agrandit sur place. */
/* Selecteur a deux classes : il doit l'emporter sur « .media img », qui plafonne
   la hauteur a 46vh — sans ca l'image « agrandie » reste petite. Et le calage sur
   les quatre bords vaut mieux que 100vh, que la barre du navigateur mobile fausse. */
.media .agrandi, .agrandi{
  position:fixed; inset:0; z-index:90; width:100%; height:100%;
  max-width:none; max-height:none; margin:0; border-radius:0;
  background:#000; object-fit:contain;
}
.fermer-agrandi{
  position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:91;
  padding:9px 15px; border-radius:999px; cursor:pointer;
  background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.35); color:#fff;
  font-size:.95rem;
}
/* Lien YouTube sur une question audio : le lecteur reste, mais couvert. */
.audio-yt{position:relative; width:100%; height:130px; border-radius:var(--r-l);
  overflow:hidden; background:var(--surface)}
.audio-yt iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.audio-yt .masque{position:absolute; inset:0; display:grid; place-items:center;
  background:var(--surface); color:var(--gold); font-size:2.4rem}
.media img,.media video,.media iframe{transition:filter .45s ease}
.media .done{
  width:100%; padding:34px 16px; text-align:center; color:var(--text-3);
  border:1px dashed var(--line); border-radius:var(--r-l); background:var(--surface);
}
.note{font-size:.85rem; color:var(--text-3); text-align:center}

.etat{
  width:100%; padding:12px 16px; border-radius:var(--r-m); text-align:center; font-weight:600;
  background:var(--surface-2); border:1px solid var(--line-soft);
}
.etat.ok{background:var(--mint-dim); color:var(--mint); border-color:transparent}
.etat.att{background:var(--gold-dim); color:var(--gold); border-color:transparent}
.etat.no{background:var(--rose-dim); color:var(--rose); border-color:transparent}

.reveal{
  width:100%; border-radius:var(--r-xl); padding:20px; background:var(--gold-dim);
  border:1px solid var(--gold);
}
.reveal .lbl{font-family:var(--f-display); font-size:.78rem; letter-spacing:.16em;
             text-transform:uppercase; color:var(--gold); display:block; margin-bottom:5px}
.reveal .ans{font-size:1.4rem; font-weight:700; line-height:1.25}
.reveal .why{margin-top:9px; color:var(--text-2); font-size:.95rem}

.rang{width:100%; display:flex; flex-direction:column; gap:5px}
.rang .l{
  display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:var(--r-m);
  background:var(--surface); border:1px solid var(--line-soft);
}
.rang .l.moi{border-color:var(--gold); background:var(--gold-dim)}
.rang .n{font-family:var(--f-mono); color:var(--text-3); width:22px}
.rang .nm{flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rang .pt{font-family:var(--f-display); font-size:1.25rem; font-weight:700}

/* Un visage vaut mieux qu'une ligne de plus : on reconnaît son voisin de
   canapé au classement sans lire son pseudo. */
.av{
  display:inline-flex; flex:none; border-radius:50%; overflow:hidden;
  line-height:0; background:var(--surface-2);
}
.av img,.av svg{width:100%; height:100%; display:block; object-fit:cover}
.etat .av{vertical-align:middle; margin-right:8px}
.avbtn{
  padding:0; flex:none; line-height:0; cursor:pointer; border-radius:50%;
  background:none; border:1px solid var(--line);
}
.avbtn:active{transform:scale(.94)}

.avgrille{
  position:relative; display:grid; gap:8px; width:100%; padding:6px;
  grid-template-columns:repeat(auto-fill,minmax(58px,1fr));
  max-height:34vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--r-m);
}
/* Cible large : on choisit sa figure au pouce, souvent d'une seule main. */
.avcase{
  display:grid; place-items:center; padding:4px; line-height:0; cursor:pointer;
  border-radius:50%; border:2px solid transparent; background:none;
}
.avcase.on{border-color:var(--gold); background:var(--gold-dim)}
.avsection{
  grid-column:1/-1; padding:8px 4px 2px; font-family:var(--f-display); font-size:.72rem;
  font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3);
}

.avpanneau{
  position:fixed; inset:0; z-index:40; padding:16px; background:rgba(6,8,20,.72);
  display:flex; align-items:center; justify-content:center;
}
.avboite{
  width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px;
  padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-xl);
}
.avboite .avgrille{max-height:52vh}
.avboite .tete{display:flex; align-items:center; gap:10px}
.avboite .tete .t{
  flex:1; font-family:var(--f-display); font-size:1rem; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
}
.avboite .tete .btn{padding:8px 14px; font-size:.9rem}
/* Sur un téléphone le panneau vient du bas : le pouce y arrive sans lâcher
   l'appareil. */
@media (max-width: 640px){
  .avpanneau{align-items:flex-end; padding:0}
  .avboite{max-width:none; padding:14px 14px 22px; border-radius:var(--r-xl) var(--r-xl) 0 0}
}

/* Une fois la réponse donnée, la moitié du plaisir est de voir ce que les
   autres avaient écrit. Rien n'apparaît avant la révélation. */
.toutes{width:100%; display:flex; flex-direction:column; gap:5px; margin-top:4px}
.toutes .t{
  display:flex; align-items:baseline; gap:10px; padding:8px 13px;
  border-radius:var(--r-m); background:var(--surface); border:1px solid var(--line-soft);
}
.toutes .t.moi{border-color:var(--gold); background:var(--gold-dim)}
.toutes .qui{
  font-family:var(--f-display); font-size:.72rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--text-3); flex:none; max-width:9em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.toutes .quoi{flex:1; min-width:0; overflow-wrap:anywhere}
.toutes .vide{color:var(--text-3); font-style:italic}

.centre{margin:auto; width:100%; max-width:400px; display:flex; flex-direction:column; gap:16px}
.gros{font-family:var(--f-display); font-size:2rem; font-weight:700; letter-spacing:.03em;
      text-transform:uppercase; text-align:center}
.err{color:var(--rose); font-size:.9rem; text-align:center; min-height:1.2em}
.pulse{animation:p 1.6s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.45}}

/* Chaque joueur écoute dans ses conditions à lui : casque, enceinte de
   téléphone, voisins qui dorment. Le réglage lui appartient. */
.volume{display:flex; align-items:center; gap:10px; width:100%}
.volume label{margin:0; flex:none}
.volume input[type=range]{flex:1; min-width:0; accent-color:var(--gold); background:transparent}
.volume .val{font-family:var(--f-mono); font-size:.8rem; color:var(--text-3);
  width:3.4em; text-align:right; flex:none}

/* Énoncé gardé pour l'oral : sans un mot ici, le joueur croirait à une panne. */
.oral{
  width:100%; padding:18px 16px; text-align:center; color:var(--text-2);
  background:var(--surface); border:1px dashed var(--line); border-radius:var(--r-l);
}
.oral b{
  display:block; margin-bottom:5px; color:var(--gold); font-family:var(--f-display);
  font-size:1.05rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
}

.chat-panel{
  flex:none; width:320px; display:flex; flex-direction:column; gap:10px;
  padding:14px; background:var(--bg-2); border-left:1px solid var(--line-soft);
}
.chat-titre{font-family:var(--f-display); font-size:.8rem; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--text-3)}
.chat-liste{flex:1; min-height:90px; overflow-y:auto; display:flex; flex-direction:column; gap:7px}
.chat-msg{
  padding:7px 10px; border-radius:var(--r-m); font-size:.92rem;
  background:var(--surface); border:1px solid var(--line-soft);
}
.chat-msg.anim{background:var(--gold-dim); border-color:var(--gold)}
.chat-nom{display:block; font-size:.72rem; font-weight:700; letter-spacing:.04em; color:var(--text-3)}
.chat-msg.anim .chat-nom{color:var(--gold)}
.chat-texte{display:block; color:var(--text-2); overflow-wrap:anywhere}
.chat-vide{color:var(--text-3); font-size:.88rem; text-align:center; padding:16px 6px}
.chat-saisie{display:flex; gap:8px}
.chat-saisie input[type=text]{flex:1; min-width:0; padding:10px 12px; font-size:.95rem}
.chat-saisie .btn{flex:none; padding:10px 14px; font-size:.9rem}

/* Sur un téléphone, le chat passe dessous : comprimer la question et le
   buzzer pour loger une colonne rendrait la partie injouable. */
@media (max-width: 900px){
  .zone{flex-direction:column}
  .chat-panel{width:auto; border-left:0; border-top:1px solid var(--line-soft)}
  .chat-liste{max-height:38vh}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <header class="bar">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand">Régie<em>Quiz</em></span>
      <span class="chrono" id="chrono" hidden role="timer" aria-live="off"></span>
      <span class="who" id="who"></span>
    </header>
    <div class="timer" id="timer" hidden><i id="timerFill"></i></div>
  </div>
  <div class="zone">
    <main id="main"></main>
    <aside class="chat-panel" id="chat" hidden>
      <div class="chat-titre">Chat</div>
      <div class="chat-liste" id="chatListe"></div>
      <div class="chat-saisie">
        <input type="text" id="chatTexte" maxlength="300" autocomplete="off" placeholder="Écris au groupe">
        <button class="btn" id="chatGo">Envoyer</button>
      </div>
    </aside>
  </div>
</div>

<div class="avpanneau" id="avPanneau" hidden>
  <div class="avboite" role="dialog" aria-modal="true" aria-labelledby="avTitre">
    <div class="tete">
      <span class="t" id="avTitre">Ta figure</span>
      <button class="btn" id="avFermer" type="button">Fermer</button>
    </div>
    <div class="avgrille" id="avChoix" aria-label="Choix de la figure"></div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAIN = $("#main");
const CLE = "regie-quiz:joueur";
/* Cle distincte de celle de la console : les deux pages viennent du meme
   domaine et partagent le stockage du navigateur. Avec une cle commune, un
   joueur qui baisse le son le baissait aussi chez l'animateur. */
const CLE_VOL = "regie-quiz:volume-joueur";

let ME = { code:"", playerId:"", name:"", avatar:"" };
let ETAT = null, V = -1, DERIVE = 0, TIC = null, VU = "";
let VOLUME = 1, CMD_SEQ = 0, BUZZ_VU = null, CHAT_VU = "", BANDEAU_VU = "";
let AV_ENVOI = null;
const VERSION = "03/09/2026 à 00:07";

try{ ME = Object.assign(ME, JSON.parse(localStorage.getItem(CLE) || "{}")); }catch(e){}
const garder = ()=>{ try{ localStorage.setItem(CLE, JSON.stringify(ME)); }catch(e){} };

try{ const v = parseFloat(localStorage.getItem(CLE_VOL)); if(v >= 0 && v <= 1) VOLUME = v; }catch(e){}

const params = new URLSearchParams(location.search);
if(params.get("c")) ME.code = params.get("c").toUpperCase();

/* ------------------------------------------------ avatars */
/* Avatars dessinés par le code : rien à télécharger, et ils existent déjà quand
   la partie commence. Un même numéro donne toujours la même figure. */
const AV_N = 36;
const AV_FOND = ["#e2503f","#ef8b34","#f5c542","#8cbf3f","#33b083","#2fb3c9",
                 "#4a79e0","#7d5fe0","#c04fc4","#e35287","#9b6b4f","#6b7f95"];
const AV_PEAU = ["#f6d3b4","#e9b489","#cd8f61","#a46a3f","#79482a","#f1c0a0"];
function avatarSVG(id){
  const n = Math.abs(parseInt(String(id).replace(/^g:/, ""), 10) || 0) % AV_N;
  const fond = AV_FOND[n % AV_FOND.length];
  const peau = AV_PEAU[(n * 5 + 1) % AV_PEAU.length];
  const cheveux = ["#2b2118","#6b3f22","#c8a33c","#8d8d8d","#3f2d5c","#1b1b1b"][(n * 7 + 2) % 6];
  const yeux = n % 6, bouche = ((n / 6) | 0) % 6, tete = ((n / 3) | 0) % 6;
  const chevelure = [
    '<path d="M18 30q14-13 28 0q-6-6-14-6t-14 6z" fill="' + cheveux + '"/>',
    '<path d="M15 32q0-18 17-18t17 18q-4-9-17-9t-17 9z" fill="' + cheveux + '"/>',
    '<path d="M16 30l3-9 4 6 3-10 4 8 3-9 4 9 4-6 3 11z" fill="' + cheveux + '"/>',
    '<path d="M14 33q0-19 18-19t18 19q-3-6-18-6t-18 6z" fill="' + cheveux + '"/>',
    '<g fill="' + cheveux + '"><circle cx="20" cy="26" r="7"/><circle cx="32" cy="21" r="8"/>' +
      '<circle cx="44" cy="26" r="7"/></g>',
    '<path d="M14 30q0-18 18-18t18 18z" fill="' + cheveux + '"/>' +
      '<rect x="12" y="26" width="40" height="6" rx="3" fill="#fff" opacity=".85"/>',
  ][tete];
  const regard = [
    '<circle cx="25" cy="38" r="3"/><circle cx="39" cy="38" r="3"/>',
    '<circle cx="25" cy="38" r="4.5" fill="#fff"/><circle cx="39" cy="38" r="4.5" fill="#fff"/>' +
      '<circle cx="25" cy="38" r="2.2"/><circle cx="39" cy="38" r="2.2"/>',
    '<path d="M21 38h8M35 38h8" stroke-width="2.6" stroke-linecap="round" fill="none"/>',
    '<circle cx="25" cy="38" r="3"/><path d="M35 38h8" stroke-width="2.6" stroke-linecap="round" fill="none"/>',
    '<g fill="none" stroke-width="2" stroke-linecap="round"><circle cx="25" cy="38" r="5.5"/>' +
      '<circle cx="39" cy="38" r="5.5"/><path d="M30.5 38h3"/></g>' +
      '<circle cx="25" cy="38" r="2"/><circle cx="39" cy="38" r="2"/>',
    '<path d="M21 35q4-4 8 0M35 35q4-4 8 0" stroke-width="2.4" stroke-linecap="round" fill="none"/>' +
      '<circle cx="25" cy="39" r="2.6"/><circle cx="39" cy="39" r="2.6"/>',
  ][yeux];
  const sourire = [
    '<path d="M24 48q8 7 16 0" stroke-width="2.8" stroke-linecap="round" fill="none"/>',
    '<path d="M22 46q10 12 20 0z" fill="#8e2b2b"/><path d="M25 46h14" stroke="#fff" stroke-width="2.4"/>',
    '<ellipse cx="32" cy="49" rx="4.5" ry="5.5" fill="#8e2b2b"/>',
    '<path d="M25 49h14" stroke-width="2.8" stroke-linecap="round" fill="none"/>',
    '<path d="M22 46q10 11 20 0z" fill="#8e2b2b"/><path d="M28 52q4 6 8 0z" fill="#e8748a"/>',
    '<path d="M24 44q8 7 16 0" stroke-width="2.8" stroke-linecap="round" fill="none"/>' +
      '<path d="M22 42q5-4 10 0q5-4 10 0" stroke-width="3" stroke-linecap="round" fill="none"/>',
  ][bouche];
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect width="64" height="64" fill="' + fond + '"/>' +
    '<circle cx="32" cy="70" r="20" fill="' + peau + '"/>' +
    '<ellipse cx="32" cy="40" rx="18" ry="19" fill="' + peau + '"/>' + chevelure +
    '<g stroke="#2b2118" fill="#2b2118">' + regard + sourire + '</g></svg>';
}

/* Un identifiant qui commence par "c:" désigne une image envoyée par
   l'animateur ; tout le reste se dessine sur place. */
function avatarHTML(id, taille){
  const v = String(id == null ? "" : id);
  /* Une taille absente donnerait « width:undefinedpx » : declaration invalide,
     pastille de zero pixel, avatar invisible et rien pour le signaler. */
  const t = Math.round(Number(taille) || 32);
  const dim = ' style="width:'+t+'px;height:'+t+'px"';
  if(v.slice(0,2) === "c:"){
    const u = "/api/avatarimg?room=" + encodeURIComponent(ME.code) +
              "&id=" + encodeURIComponent(v.slice(2));
    /* L'animateur peut retirer une image de son pack pendant la partie : plutôt
       qu'une icône cassée, on laisse le rond nu. */
    return '<span class="av"'+dim+'><img alt="" onerror="this.remove()" src="'+esc(u)+'"></span>';
  }
  return '<span class="av"'+dim+'>'+avatarSVG(v)+'</span>';
}

/* Le serveur dit qui porte quoi. Ce repli ne sert qu'aux quelques instants où
   la liste n'est pas encore arrivée : mieux vaut douze figures au hasard que
   douze fois la même. */
function avatarDefaut(nom){
  const s = String(nom == null ? "" : nom);
  let n = 7;
  for(let i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) % 100000;
  return "g:" + (n % AV_N);
}
/* Le classement porte des noms d'équipes, pas seulement des pseudos : « Table 3 »
   n'a pas de figure, et lui en inventer une afficherait un visage qui n'est
   celui de personne. On ne rend donc que ce que le serveur connaît vraiment. */
function avatarDe(nom){
  const a = (ETAT && ETAT.avatars) ? ETAT.avatars[nom] : null;
  return (typeof a === "string" && a) ? a : null;
}

/* Les 36 figures d'abord, le pack de l'animateur ensuite : à l'entrée le pack
   est inconnu, on ne le propose donc qu'une fois dans la partie. */
function grilleAvatars(courant, avecPack){
  let h = "";
  for(let i = 0; i < AV_N; i++){
    const id = "g:" + i;
    h += '<button type="button" class="avcase'+(id === courant ? " on" : "")+'" '+
         'data-av="'+id+'" aria-label="Figure '+(i+1)+'">'+avatarHTML(id, 46)+'</button>';
  }
  const pack = (avecPack && ETAT && ETAT.pack) || [];
  if(pack.length){
    h += '<div class="avsection">Images de l’animateur</div>'+
      pack.map(p=>{
        const id = "c:" + p.id, nom = p.name || "Image";
        return '<button type="button" class="avcase'+(id === courant ? " on" : "")+'" '+
          'data-av="'+esc(id)+'" title="'+esc(nom)+'" aria-label="'+esc(nom)+'">'+
          avatarHTML(id, 46)+'</button>';
      }).join("");
  }
  return h;
}

function brancherGrille(racine, choisi){
  racine.querySelectorAll(".avcase[data-av]").forEach(b => b.onclick = ()=>{
    racine.querySelectorAll(".avcase.on").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    choisi(b.dataset.av);
  });
  const sel = racine.querySelector(".avcase.on");
  if(sel) racine.scrollTop = Math.max(0, sel.offsetTop - 8);
}

/* ------------------------------------------------ écran d'entrée */
function vueEntree(erreur){
  couperMedia();
  fermerAvatars();
  $("#chat").hidden = true;
  CHAT_VU = "";
  /* Une figure est proposée d'office : personne n'entre sans visage, et les
     identifiants du pack d'un salon précédent n'ont plus cours ici. */
  if(!/^g:\d+$/.test(ME.avatar || "")) ME.avatar = "g:" + Math.floor(Math.random()*AV_N);
  MAIN.innerHTML =
    '<div class="centre">'+
      '<div class="gros">Rejoindre la partie</div>'+
      '<div class="field"><label for="code">Code de la partie</label>'+
        '<input type="text" id="code" maxlength="7" autocomplete="off" autocapitalize="characters" '+
        'spellcheck="false" value="'+esc(ME.code)+'" placeholder="ABCDE"></div>'+
      '<div class="field"><label for="nom">Ton pseudo</label>'+
        '<input type="text" id="nom" maxlength="24" autocomplete="nickname" '+
        'value="'+esc(ME.name)+'" placeholder="Comme tu veux"></div>'+
      '<div class="field"><label>Ta figure</label>'+
        '<div class="avgrille" id="avEntree" role="group" aria-label="Choix de la figure">'+
          grilleAvatars(ME.avatar, false)+'</div>'+
        '<p class="note">Les images de l’animateur se choisissent une fois entré.</p></div>'+
      '<button class="btn btn-gold btn-lg" id="go">Entrer</button>'+
      '<p class="err" id="err">'+esc(erreur||"")+'</p>'+
      '<p class="note">Aucune inscription. Ton pseudo suffit, et il reste sur cet appareil.<br>'+
        '<span style="opacity:.55">Version du '+esc(VERSION)+'</span></p>'+
    '</div>';
  brancherGrille($("#avEntree"), id => { ME.avatar = id; });
  const go = ()=> rejoindre($("#code").value, $("#nom").value);
  $("#go").onclick = go;
  $("#nom").onkeydown = e => { if(e.key==="Enter") go(); };
  $("#code").onkeydown = e => { if(e.key==="Enter") $("#nom").focus(); };
  ($("#code").value ? $("#nom") : $("#code")).focus();
}

async function rejoindre(code, nom){
  code = (code||"").trim().toUpperCase();
  nom = (nom||"").trim();
  if(!code) return vueEntree("Il faut le code de la partie.");
  if(!nom) return vueEntree("Choisis un pseudo.");
  $("#go").disabled = true;
  const av = /^g:\d+$/.test(ME.avatar || "") ? ME.avatar : "";
  try{
    const r = await fetch("/api/join?room="+encodeURIComponent(code), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name:nom, playerId:ME.playerId, avatar:av || undefined})
    });
    const d = await r.json();
    if(!r.ok || !d.ok) return vueEntree(d.error || "Impossible de rejoindre.");
    ME = {code:d.code, playerId:d.playerId, name:d.name, avatar:d.avatar || av};
    garder();
    V = -1;
    boucle();
  }catch(e){ vueEntree("Le serveur ne répond pas. Réessaie."); }
}

/* ------------------------------------------------ boucle d'écoute */
async function boucle(){
  while(ME.playerId){
    try{
      const r = await fetch("/api/play?room="+encodeURIComponent(ME.code)+
                            "&p="+encodeURIComponent(ME.playerId)+"&v="+V, {cache:"no-store"});
      if(r.status === 404){ ME.playerId=""; garder(); return vueEntree("La partie n'existe plus."); }
      const d = await r.json();
      V = d.v;
      if(!d.me){ ME.playerId=""; garder(); return vueEntree("Tu as été retiré de la partie."); }
      DERIVE = d.now*1000 - Date.now();
      ETAT = d;
      /* C'est le serveur qui fait foi : il a pu nous attribuer une figure, ou
         retirer du pack celle qu'on portait. Tant que notre propre changement
         n'a pas fait l'aller-retour, on ne se laisse pas remettre l'ancienne. */
      if(typeof d.monAvatar === "string" && d.monAvatar){
        if(AV_ENVOI){ if(d.monAvatar === AV_ENVOI) AV_ENVOI = null; }
        else if(d.monAvatar !== ME.avatar){ ME.avatar = d.monAvatar; garder(); }
      }
      dessiner();
    }catch(e){
      majBandeau(true);
      await new Promise(r=>setTimeout(r, 2000));
    }
  }
}

/* Le bandeau se repeint à chaque tour de boucle : sans ce garde-fou, le
   bouton de la figure serait remplacé sous le doigt du joueur. */
function majBandeau(coupe){
  const h = ME.name
    ? (ME.playerId ? '<button class="avbtn" id="avBtn" type="button" '+
        'title="Changer de figure" aria-label="Changer de figure">'+
        avatarHTML(ME.avatar, 30)+'</button>' : '')+
      '<span class="pastille">'+esc(ME.code)+'</span><b>'+esc(ME.name)+'</b>'+
      (coupe ? '<span class="pastille pulse">reconnexion…</span>' : '')
    : "";
  if(h === BANDEAU_VU) return;
  BANDEAU_VU = h;
  $("#who").innerHTML = h;
  const b = $("#avBtn");
  if(b) b.onclick = ouvrirAvatars;
}

/* ------------------------------------------------ media : arret franc */
let SIG_MEDIA = null, CHRONO_ARME = null;

/* Ce qui identifie le media affiche. Tant que ca ne bouge pas, le lecteur
   en place est le bon et on le laisse tranquille. */
function signatureMedia(){
  const d = ETAT;
  if(!d || (!d.media && !d.mediaUrl)) return null;
  return JSON.stringify([d.media && d.media.id, d.mediaUrl || "",
                         d.mediaStart || 0,
                         d.media ? d.media.kind : (d.mediaUrlKind || "")]);
}

/* Retirer un <audio> du DOM ne l'arrete pas : il continue de jouer dans le
   vide. Il faut le mettre en pause et lui enlever sa source a la main. */
function couperMedia(){
  const hote = $("#media");
  SIG_MEDIA = null;
  CMD_SEQ = 0;          /* nouveau média : les commandes de l'ancien ne valent plus */
  if(!hote) return;
  hote.querySelectorAll("video,audio").forEach(el=>{
    try{ el.pause(); el.removeAttribute("src"); el.load(); }catch(e){}
  });
  hote.querySelectorAll("iframe").forEach(f=>{
    try{ f.src = "about:blank"; }catch(e){}
  });
}

/* ------------------------------------------------ rendu */
function dessiner(){
  majBandeau(false);
  const d = ETAT;
  const q = d.question;
  const cle = JSON.stringify([q && q.id, d.open, d.mine, d.reveal, d.canBuzz,
                              d.buzzWinner, d.media && d.media.id, d.mediaStart>0,
                              d.mediaUrl, d.scores, !!d.questionHidden,
                              (d.toutes||[]).length]);
  if(cle !== VU){ VU = cle; construire(); }
  majChrono();
  majAvatars();
  majPanneauAvatars();
  appliqueFlou();
  suivreMedia();
  suivreBuzz();
  majChat();
}

function construire(){
  const d = ETAT, q = d.question;
  /* Le media survit au re-rendu tant qu'il s'agit du meme extrait : sinon
     la musique repartirait du debut des qu'un joueur envoie sa reponse. */
  const sig = signatureMedia();
  const ancien = $("#media");
  const garde = (ancien && sig && sig === SIG_MEDIA) ? ancien : null;
  if(!garde) couperMedia();
  if(!q){
    MAIN.innerHTML =
      '<div class="centre"><div class="gros">Tu es dans la partie</div>'+
      '<p class="etat att pulse">En attente de la '+
        (d.scores && d.scores.length ? 'prochaine' : 'première')+' question…</p>'+
      (d.players.length ? '<p class="note">'+d.players.length+' joueur'+
        (d.players.length>1?'s':'')+' : '+esc(d.players.join(", "))+'</p>' : '')+
      classement(true)+'</div>';
    return;
  }

  let h = '<div class="eyebrow">'+esc(q.round||"")+(q.round?' · ':'')+
          'Question '+q.index+'/'+q.total+
          (q.points!=null ? ' · '+q.points+' pt'+(Math.abs(q.points)>1?'s':'') : '')+'</div>';

  if(d.media || d.mediaUrl) h += '<div class="media" id="media"></div>';
  /* L'énoncé n'est pas seulement caché : le serveur ne l'envoie pas. Inutile
     de laisser un blanc, on dit pourquoi. */
  if(d.questionHidden){
    /* Sur un QCM, les propositions ne sont pas envoyees non plus : proposer un
       champ libre n'aurait aucun sens, on fait patienter. */
    const attend = q.type === "qcm";
    h += "<div class=\"oral\"><b>Question posée à l’oral</b>" +
         (attend ? "Écoute l’animateur : les propositions arrivent."
                 : "Écoute l’animateur, puis réponds ici.") + "</div>";
  } else if(q.text){
    h += '<h2 class="qtext">'+esc(q.text)+'</h2>';
  }

  if(d.reveal){
    h += '<div class="reveal"><span class="lbl">Réponse</span>'+
         '<div class="ans">'+esc(d.reveal.answer || "—")+'</div>'+
         (d.reveal.note ? '<div class="why">'+esc(d.reveal.note)+'</div>' : '')+'</div>';
    h += toutesLesReponses();
    h += '<p class="note">L\'animateur attribue les points.</p>';
  } else if(q.buzzMode && !d.mine){
    if(d.buzzWinner && d.buzzWinner !== d.me){
      h += '<p class="etat no">'+avatarHTML(avatarDe(d.buzzWinner), 28)+
           '<b>'+esc(d.buzzWinner)+'</b> a buzzé et prend la main.</p>';
    } else if(d.canBuzz){
      h += '<button class="btn btn-rose btn-lg" id="buzz" style="font-size:1.4rem;padding:26px">🔔 BUZZ</button>';
    } else if(d.buzzWinner === d.me){
      h += zoneReponse();
    } else {
      h += '<p class="etat">Tu as déjà eu ta chance sur cette question.</p>';
    }
  } else if(d.questionHidden && q.type === "qcm"){
    h += '<p class="etat att pulse">Les propositions arrivent…</p>';
  } else if(!d.open){
    h += '<p class="etat no">Les réponses sont closes.</p>';
    if(d.mine) h += '<p class="etat">Ta réponse : <b>'+esc(d.mine)+'</b></p>';
  } else {
    h += zoneReponse();
  }

  h += classement(false);
  /* Depuis que les figures entrent dans la clé de rendu, un voisin qui change
     la sienne redessine l'écran : une réponse en cours de frappe ne doit pas
     partir avec. */
  const vieux = $("#rep");
  const brouillon = (vieux && q && vieux.dataset.q === String(q.id))
    ? {t:vieux.value, f:document.activeElement === vieux, p:vieux.selectionStart} : null;
  MAIN.innerHTML = h;
  if(garde){
    const neuf = $("#media");
    if(neuf) neuf.replaceWith(garde);   /* on remet le lecteur qui jouait */
  }
  if(brouillon){
    const champ = $("#rep");
    if(champ){
      champ.value = brouillon.t;
      if(brouillon.f){
        champ.focus();
        try{ champ.setSelectionRange(brouillon.p, brouillon.p); }catch(e){}
      }
    }
  }

  if($("#buzz")) $("#buzz").onclick = buzzer;
  brancherReponse();
  if(d.media || d.mediaUrl){
    if(!garde){ SIG_MEDIA = sig; monterMedia(); }
    appliqueFlou();
  }
}

function zoneReponse(){
  const d = ETAT, q = d.question;
  if(q.type === "qcm" && q.choices.length){
    const choisies = (d.mine||"").split(",").map(s=>s.trim()).filter(Boolean);
    return '<div class="choices">'+ q.choices.map(c=>
      '<button class="choice'+(choisies.indexOf(c.letter)>=0?" on":"")+'" data-l="'+c.letter+'">'+
      '<span class="lt">'+c.letter+'</span><span>'+esc(c.text)+'</span></button>').join("")+'</div>'+
      (q.multi ? '<p class="note">Plusieurs réponses possibles — reclique pour retirer.</p>' : '')+
      (d.mine ? '<p class="etat ok">Réponse enregistrée : '+esc(d.mine)+'</p>' : '');
  }
  return '<div class="field"><label for="rep">Ta réponse</label>'+
         '<input type="text" id="rep" maxlength="300" autocomplete="off" '+
         'data-q="'+esc(String(q.id))+'" '+
         'value="'+esc(d.mine||"")+'" placeholder="Écris ici"></div>'+
         '<button class="btn btn-gold btn-lg" id="env">'+(d.mine?"Corriger":"Envoyer")+'</button>'+
         (d.mine ? '<p class="etat ok">Réponse enregistrée : '+esc(d.mine)+'</p>' : '');
}

function brancherReponse(){
  const d = ETAT, q = d.question;
  document.querySelectorAll(".choice[data-l]").forEach(b=> b.onclick = ()=>{
    let cur = (d.mine||"").split(",").map(s=>s.trim()).filter(Boolean);
    const l = b.dataset.l;
    if(q.multi){
      const i = cur.indexOf(l);
      if(i>=0) cur.splice(i,1); else cur.push(l);
      cur.sort();
    } else cur = [l];
    envoyer(cur.join(", "));
  });
  const env = $("#env");
  if(env){
    env.onclick = ()=> envoyer($("#rep").value);
    $("#rep").onkeydown = e => { if(e.key==="Enter") envoyer($("#rep").value); };
  }
}

async function envoyer(valeur){
  valeur = (valeur||"").trim();
  if(!valeur) return;
  ETAT.mine = valeur; VU = ""; construire();      // retour immédiat
  try{
    const r = await fetch("/api/answer?room="+encodeURIComponent(ME.code), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({playerId:ME.playerId, value:valeur})
    });
    if(!r.ok){
      const d = await r.json().catch(()=>({}));
      ETAT.mine = null; VU = "";
      construire();
      const z = document.createElement("p");
      z.className = "etat no"; z.textContent = d.error || "Réponse refusée.";
      MAIN.appendChild(z);
    }
  }catch(e){}
}

async function buzzer(){
  const b = $("#buzz"); if(b) b.disabled = true;
  try{
    await fetch("/api/playerbuzz?room="+encodeURIComponent(ME.code), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({playerId:ME.playerId})
    });
  }catch(e){}
}

/* Le serveur ne les envoie qu'après la révélation : avant, voir la réponse
   du voisin viderait la question de son intérêt. */
function toutesLesReponses(){
  const d = ETAT, liste = d.toutes || [];
  if(!liste.length){
    return d.mine ? '<p class="etat">Ta réponse : <b>'+esc(d.mine)+'</b></p>' : "";
  }
  return '<div class="toutes">'+ liste.map(r=>
    '<div class="t'+(r.name === d.me ? " moi" : "")+'">'+
      '<span class="qui">'+esc(r.name)+'</span>'+
      '<span class="quoi'+(r.value ? "" : " vide")+'">'+
        esc(r.value || "rien écrit")+'</span>'+
    '</div>').join("")+'</div>';
}

/* Un joueur qui change de figure ne doit pas reconstruire l'écran de tous les
   autres : ça couperait l'extrait en cours et effacerait une réponse en train
   d'être tapée. On remplace donc les visages là où ils sont. */
function majAvatars(){
  const d = ETAT;
  if(!d) return;
  document.querySelectorAll("[data-av-nom]").forEach(el=>{
    const voulu = avatarDe(el.dataset.avNom);
    if(!voulu){ if(el.dataset.avId){ el.dataset.avId = ""; el.innerHTML = ""; } return; }
    if(el.dataset.avId === voulu) return;
    el.dataset.avId = voulu;
    el.innerHTML = avatarHTML(voulu, Number(el.dataset.avT) || 30);
  });
}

function classement(seul){
  const d = ETAT;
  if(!d.scores || !d.scores.length) return "";
  const tri = d.scores.slice().sort((a,b)=> b.score-a.score);
  return '<div class="rang">'+ tri.slice(0,12).map((s,i)=>
    '<div class="l'+(s.name===d.me?" moi":"")+'"><span class="n">'+(i+1)+'</span>'+
    '<span data-av-nom="'+esc(s.name)+'" data-av-t="30" data-av-id="'+esc(avatarDe(s.name)||"")+'">'+
      (avatarDe(s.name) ? avatarHTML(avatarDe(s.name), 30) : "")+'</span>'+
    '<span class="nm">'+esc(s.name)+'</span><span class="pt">'+s.score+'</span></div>').join("")+'</div>';
}

/* ------------------------------------------------ chrono */
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

function majChrono(){
  const bar = $("#timer"), fill = $("#timerFill"), num = $("#chrono"), d = ETAT;
  const gele = !!d && d.gel !== null && d.gel !== undefined;
  if(!d || !d.open || (!d.deadline && !gele)){
    bar.hidden = true;
    num.hidden = true;
    clearInterval(TIC);
    return;
  }
  bar.hidden = false;
  num.hidden = false;
  clearInterval(TIC);
  const total = Math.max(1, d.duree || (d.deadline - d.startedAt));
  const peindre = reste => {
    fill.style.width = Math.max(0, Math.min(100, reste/total*100))+"%";
    num.textContent = mmss(reste);
    bar.classList.toggle("warn", reste <= 5 && !gele);
    bar.classList.toggle("gele", gele);
    num.classList.toggle("warn", reste <= 5 && reste > 0 && !gele);
    num.classList.toggle("fini", reste <= 0 && !gele);
    num.classList.toggle("gele", gele);
  };
  /* Temps gelé : plus de décompte, on affiche la valeur figée telle quelle. */
  if(gele){ peindre(d.gel); return; }
  const qid = d.question && d.question.id;
  const battre = ()=>{
    const reste = Math.max(0, d.deadline*1000 - (Date.now()+DERIVE)) / 1000;
    peindre(reste);
    /* On n'arme la sonnerie que si on a vu le temps tourner : un joueur qui
       arrive après la fin ne doit pas se prendre les trois notes. */
    if(reste > 1) CHRONO_ARME = qid;
    if(reste <= 0){
      if(CHRONO_ARME === qid && qid){ CHRONO_ARME = null; sonFin(); }
      clearInterval(TIC);
    }
  };
  battre();
  TIC = setInterval(battre, 200);
}

/* ------------------------------------------------ médias synchronisés */
/* Identifiant d'une vidéo YouTube, quelle que soit la forme du lien. */
function ytId(u){
  const r = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/.exec(u||"");
  return r ? r[1] : null;
}

/* Le flou change souvent : on le pose sur les éléments déjà en place plutôt
   que de reconstruire le média, ce qui relancerait la lecture depuis le début. */
function appliqueFlou(){
  const v = (ETAT && ETAT.blur) || 0;
  const filtre = v ? "blur("+v+"px)" : "";
  ["#media img", "#media video", "#media iframe"].forEach(sel=>{
    const el = document.querySelector(sel);
    if(el && el.style.filter !== filtre) el.style.filter = filtre;
  });
}

/* Où en est le média, du point de vue de l'animateur. La dernière commande
   qu'il a passée fait foi : celui qui arrive après un rembobinage doit se
   poser au même endroit que les autres, pas au début. */
function positionDepart(){
  const d = ETAT, c = d.mediaCmd, t = (Date.now()+DERIVE)/1000;
  if(c && c.seq){
    CMD_SEQ = c.seq;
    return {pos: Math.max(0, c.pos + (c.playing ? t - c.at : 0)), joue: !!c.playing};
  }
  return {pos: Math.max(0, t - d.mediaStart), joue: true};
}

/* L'animateur a rembobiné, avancé, mis en pause ou relancé. On recale le
   lecteur en place sans le remonter, sinon le son repartirait de zéro. */
function suivreMedia(){
  const c = ETAT && ETAT.mediaCmd;
  if(!c || !c.seq || c.seq === CMD_SEQ) return;
  const hote = $("#media");
  const el = hote && hote.querySelector("video,audio");
  if(!el) return;                      /* image ou YouTube : rien à recaler */
  CMD_SEQ = c.seq;
  const vise = Math.max(0, c.pos + (c.playing ? (Date.now()+DERIVE)/1000 - c.at : 0));
  try{
    /* Sauter pour un écart qu'on n'entend pas ne ferait que hacher la lecture. */
    if(Math.abs(el.currentTime - vise) > 0.7 && vise < (el.duration || 1e9)) el.currentTime = vise;
    if(c.playing) lancer(el, hote); else el.pause();
  }catch(e){}
}

function appliqueVolume(){
  document.querySelectorAll("#media video, #media audio").forEach(el=>{
    try{ el.volume = VOLUME; }catch(e){}
  });
}

/* Le curseur vit dans #media : il suit le lecteur quand celui-ci survit à un
   re-rendu, et s'en va avec lui. */
function ajouteVolume(hote){
  const b = document.createElement("div");
  b.className = "volume";
  b.innerHTML = '<label for="vol">Volume</label>'+
    '<input type="range" id="vol" min="0" max="1" step="0.02" value="'+VOLUME+'">'+
    '<span class="val" id="volVal">'+Math.round(VOLUME*100)+' %</span>';
  hote.appendChild(b);
  const c = b.querySelector("#vol"), t = b.querySelector("#volVal");
  c.oninput = ()=>{
    const v = parseFloat(c.value);
    VOLUME = (v >= 0 && v <= 1) ? v : 1;
    t.textContent = Math.round(VOLUME*100)+' %';
    try{ localStorage.setItem(CLE_VOL, String(VOLUME)); }catch(e){}
    appliqueVolume();
  };
}

/* Plein écran, avec les deux replis qui comptent : le préfixe WebKit pour les
   anciens navigateurs, et la méthode propre à la vidéo sur iPhone, où l'API
   générale n'existe pas. */
function sortAgrandi(el){
  el.classList.remove("agrandi");
  const b = $(".fermer-agrandi");
  if(b) b.remove();
  document.removeEventListener("keydown", el._echap || (()=>{}));
}

/* Repli maison : l'élément couvre l'écran, avec de quoi en sortir. */
function agrandirSurPlace(el){
  if(el.classList.contains("agrandi")) return sortAgrandi(el);
  el.classList.add("agrandi");
  const b = document.createElement("button");
  b.type = "button";
  b.className = "fermer-agrandi";
  b.textContent = "Fermer";
  b.onclick = ()=> sortAgrandi(el);
  document.body.appendChild(b);
  el._echap = e => { if(e.key === "Escape") sortAgrandi(el); };
  document.addEventListener("keydown", el._echap);
}

/* On demande le vrai plein écran, et on se rabat sur l'agrandissement dès qu'il
   n'est pas possible : sur iPhone une image n'y a pas droit du tout, et certains
   navigateurs refusent la demande sans rien dire. */
function pleinEcran(el){
  if(el.classList.contains("agrandi")) return sortAgrandi(el);
  if(document.fullscreenElement || document.webkitFullscreenElement){
    try{ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }catch(e){}
    return;
  }
  if(el.webkitEnterFullscreen && el.tagName === "VIDEO"){
    try{ el.webkitEnterFullscreen(); return; }catch(e){}
  }
  const f = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!f) return agrandirSurPlace(el);
  try{
    const r = f.call(el);
    if(r && r.catch) r.catch(()=> agrandirSurPlace(el));
  }catch(e){ agrandirSurPlace(el); }
}

function boutonPleinEcran(hote, el){
  if(!hote || !el) return;
  const b = document.createElement("button");
  b.type = "button";
  b.className = "plein";
  b.innerHTML = '<span aria-hidden="true">\u2922</span> Plein écran';
  b.onclick = ()=> pleinEcran(el);
  hote.appendChild(b);
}

function monterMedia(){
  const hote = $("#media"), d = ETAT, m = d.media;
  if(!hote || (!m && !d.mediaUrl)) return;
  const genre = m ? m.kind : (d.mediaUrlKind || "");
  /* Tant que l'animateur n'a pas lancé, personne ne démarre : c'est ce qui
     garantit que tout le monde voit et entend la même chose au même moment. */
  if(!d.mediaStart){
    hote.innerHTML = "<div class=\"done pulse\">L’animateur va lancer " +
      (genre === "video" ? "la vidéo" : genre === "audio" ? "l’extrait" : "le média") +
      "…</div>";
    return;
  }
  const dep = positionDepart(), decalage = dep.pos;

  /* Lien externe : l'animateur a collé une adresse plutôt qu'importé un
     fichier. On démarre là où il en est, mais le navigateur du joueur peut
     exiger un geste avant de lancer le son. */
  if(!m && d.mediaUrl){
    const yt = ytId(d.mediaUrl);
    if(yt && genre === "audio"){
      /* C'est un blind test : on garde le lecteur, indispensable au son,
         mais on le recouvre pour ne pas montrer le clip. */
      hote.innerHTML = '<div class="audio-yt">'+
        '<iframe allow="autoplay; encrypted-media" '+
        'src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(yt)+
        '?autoplay=1&start='+Math.floor(decalage)+'&controls=1&rel=0&modestbranding=1"></iframe>'+
        '<div class="masque"><span>♪</span></div></div>'+
        '<div class="note">Si le son ne démarre pas, touche le cadre une fois. '+
        'Le volume se règle dans le lecteur.</div>';
      return;
    }
    if(yt){
      hote.innerHTML = '<iframe allow="autoplay; encrypted-media; fullscreen" allowfullscreen '+
        'src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(yt)+
        '?autoplay=1&start='+Math.floor(decalage)+'&controls=0&rel=0&modestbranding=1&disablekb=1"></iframe>'+
        '<div class="note">Si rien ne démarre, touche la vidéo une fois. '+
        'Le volume se règle dans le lecteur.</div>';
      return;
    }
    if(genre === "image"){
      hote.innerHTML = '<img alt="Image de la question" src="'+esc(d.mediaUrl)+'">';
      boutonPleinEcran(hote, hote.querySelector("img"));
      return;
    }
    const balise = genre === "video" ? "video" : "audio";
    hote.innerHTML = '<'+balise+' id="ext" playsinline preload="auto" src="'+esc(d.mediaUrl)+'"></'+balise+'>'+
      '<div class="note" id="extNote">Lecture en cours…</div>';
    const el = $("#ext");
    ajouteVolume(hote);
    appliqueVolume();
    el.onloadedmetadata = ()=>{
      if(decalage > 0 && decalage < (el.duration||1e9)) el.currentTime = decalage;
      if(dep.joue) lancer(el, hote);
    };
    if(balise === "video") boutonPleinEcran(hote, el);
    el.onerror = ()=>{ const n = $("#extNote"); if(n) n.textContent = "Média indisponible depuis ce lien."; };
    return;
  }

  const src = "/api/media?room="+encodeURIComponent(ME.code)+"&id="+encodeURIComponent(m.id);

  if(m.kind === "image"){
    hote.innerHTML = '<img alt="Image de la question" src="'+src+'">';
    boutonPleinEcran(hote, hote.querySelector("img"));
    return;
  }
  if(m.kind === "video"){
    /* Pas de commandes : la vidéo démarre là où en est l'animateur, et
       personne ne peut la rembobiner. Elle disparaît à la fin. */
    hote.innerHTML = '<video id="vid" playsinline preload="auto" src="'+src+'"></video>';
    const v = $("#vid");
    ajouteVolume(hote);
    appliqueVolume();
    v.onloadedmetadata = ()=>{
      if(decalage > 0 && decalage < (v.duration||1e9)) v.currentTime = decalage;
      if(dep.joue) lancer(v, hote);
    };
    boutonPleinEcran(hote, v);
    v.onended = ()=>{ hote.innerHTML = '<div class="done">Extrait terminé</div>'; };
    return;
  }
  hote.innerHTML = '<audio id="aud" preload="auto" src="'+src+'"></audio>'+
                   '<div class="note" id="audNote">Lecture en cours…</div>';
  const a = $("#aud");
  ajouteVolume(hote);
  appliqueVolume();
  a.onloadedmetadata = ()=>{
    if(decalage > 0 && decalage < (a.duration||1e9)) a.currentTime = decalage;
    if(dep.joue) lancer(a, hote);
  };
  a.onended = ()=>{ const n=$("#audNote"); if(n) n.textContent = "Extrait terminé"; };
}

function lancer(el, hote){
  const p = el.play();
  if(p && p.catch) p.catch(()=>{
    if(hote.querySelector(".btn")) return;
    const b = document.createElement("button");
    b.className = "btn btn-gold btn-lg";
    b.textContent = "▶  Lancer";
    b.onclick = ()=>{ b.remove(); el.play().catch(()=>{}); };
    hote.appendChild(b);
  });
}

/* ------------------------------------------------ son du buzz */
let SON = null;

/* Beaucoup de navigateurs n'ouvrent le son qu'après un geste du joueur : on
   profite du premier clic ou de la première touche pour réveiller le contexte. */
function reveilleSon(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    if(!SON) SON = new C();
    if(SON.state === "suspended") SON.resume().catch(()=>{});
    return SON;
  }catch(e){ return null; }
}
document.addEventListener("pointerdown", reveilleSon);
document.addEventListener("keydown", reveilleSon);

/* Deux notes fabriquées à la volée : aucun fichier à charger, donc le signal
   part tout de suite, même sur une connexion poussive. */
/* Trois notes descendantes quand le temps tombe : l'animateur a la même
   sonnerie sur sa console, mais les joueurs qui ne sont pas en vocal avec lui
   ne l'entendraient jamais. */
function sonFin(){
  const ctx = reveilleSon();
  if(!ctx) return;
  try{
    const t0 = ctx.currentTime, fort = Math.max(0.0001, 0.2 * VOLUME);
    [[880, 0], [660, 0.16], [440, 0.32]].forEach(n=>{
      const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + n[1];
      o.type = "triangle";
      o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(fort, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.18);
    });
  }catch(e){}
}

function sonBuzz(){
  const ctx = reveilleSon();
  if(!ctx) return;
  try{
    const t0 = ctx.currentTime, fort = Math.max(0.0001, 0.22 * VOLUME);
    [[740, 0], [1180, 0.13]].forEach(n=>{
      const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + n[1];
      o.type = "triangle";
      o.frequency.value = n[0];
      /* Rampes exponentielles : une attaque franche claquerait dans le casque. */
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(fort, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.15);
    });
  }catch(e){}
}

function suivreBuzz(){
  const n = (ETAT && ETAT.buzzSeq) || 0;
  /* Au premier passage on note la valeur sans sonner : celui qui arrive en
     cours de partie n'a pas à entendre un buzz déjà passé. */
  if(BUZZ_VU !== null && n > BUZZ_VU) sonBuzz();
  BUZZ_VU = n;
}

/* ------------------------------------------------ changer de figure */
function ouvrirAvatars(){
  if(!ME.playerId) return;
  const g = $("#avChoix");
  g.innerHTML = grilleAvatars(ME.avatar, true);
  PACK_VU = (ETAT && ETAT.pack ? ETAT.pack : []).map(a => a.id).join(",");
  $("#avPanneau").hidden = false;
  brancherGrille(g, choisirAvatar);
  $("#avFermer").focus();
}

/* Le panneau est bati a l'ouverture. Si l'animateur ajoute une image pendant
   qu'il est ouvert — le cas quand un joueur vient d'en reclamer une — il faut
   le redessiner, sans perdre le choix en cours. */
let PACK_VU = "";
function majPanneauAvatars(){
  const p = $("#avPanneau");
  if(!p || p.hidden){ PACK_VU = ""; return; }
  const sig = (ETAT && ETAT.pack ? ETAT.pack : []).map(a => a.id).join(",");
  if(sig === PACK_VU) return;
  PACK_VU = sig;
  const g = $("#avChoix");
  if(!g) return;
  g.innerHTML = grilleAvatars(ME.avatar, true);
  brancherGrille(g, choisirAvatar);
}

function fermerAvatars(){
  const p = $("#avPanneau");
  if(p) p.hidden = true;
}

async function choisirAvatar(id){
  if(!ME.playerId || id === ME.avatar) return fermerAvatars();
  const avant = ME.avatar;
  ME.avatar = id;
  AV_ENVOI = id;
  garder();
  fermerAvatars();
  /* Retour immédiat : le tour de boucle qui confirme peut mettre du temps. */
  BANDEAU_VU = ""; majBandeau(false);
  if(ETAT){
    if(ETAT.avatars && ETAT.me) ETAT.avatars[ETAT.me] = id;
    VU = ""; construire();
  }
  try{
    const r = await fetch("/api/setavatar?room="+encodeURIComponent(ME.code), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({playerId:ME.playerId, avatar:id})
    });
    if(!r.ok) throw 0;
  }catch(e){
    ME.avatar = avant;
    AV_ENVOI = null;
    garder();
    BANDEAU_VU = ""; majBandeau(false);
    if(ETAT){
      if(ETAT.avatars && ETAT.me) ETAT.avatars[ETAT.me] = avant;
      VU = ""; construire();
    }
  }
}

$("#avFermer").onclick = fermerAvatars;
/* Le fond, la touche Échap : deux façons de renoncer sans rien changer. */
$("#avPanneau").onclick = e => { if(e.target === $("#avPanneau")) fermerAvatars(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") fermerAvatars(); });

/* ------------------------------------------------ chat */
function majChat(){
  const liste = $("#chatListe"), msgs = (ETAT && ETAT.chat) || [];
  $("#chat").hidden = false;
  const sig = msgs.length + "|" + (msgs.length ? msgs[msgs.length-1].id : "");
  if(sig === CHAT_VU) return;     /* rien de neuf : on ne touche à rien */
  CHAT_VU = sig;
  /* Si le joueur est remonté lire un message plus haut, on ne le redescend
     pas de force. Le champ, lui, n'est jamais reconstruit : pas de focus volé. */
  const enBas = liste.scrollHeight - liste.scrollTop - liste.clientHeight < 40;
  liste.innerHTML = msgs.length
    ? msgs.map(m =>
        '<div class="chat-msg'+(m.role === "anim" ? " anim" : "")+'">'+
        '<span class="chat-nom">'+esc(m.name || (m.role === "anim" ? "Animateur" : "?"))+'</span>'+
        '<span class="chat-texte">'+esc(m.text)+'</span></div>').join("")
    : '<div class="chat-vide">Personne n’a encore écrit.</div>';
  if(enBas) liste.scrollTop = liste.scrollHeight;
}

async function chatEnvoie(){
  const champ = $("#chatTexte"), texte = (champ.value || "").trim();
  if(!texte || !ME.playerId) return;
  champ.value = "";
  try{
    const r = await fetch("/api/chat?room="+encodeURIComponent(ME.code), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({playerId:ME.playerId, text:texte})
    });
    if(!r.ok) throw 0;
  }catch(e){
    /* Message perdu : on le rend au joueur plutôt que de l'effacer. */
    if(!champ.value) champ.value = texte;
  }
}
$("#chatGo").onclick = chatEnvoie;
$("#chatTexte").onkeydown = e => { if(e.key === "Enter") chatEnvoie(); };

/* ------------------------------------------------ démarrage */
if(ME.playerId && ME.code){
  majBandeau(false);
  MAIN.innerHTML = '<div class="centre"><p class="etat att pulse">Connexion…</p></div>';
  boucle();
} else {
  vueEntree("");
}
</script>
