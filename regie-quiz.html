      '<span><strong>'+esc(gagnant.name)+'</strong> a buzzé et prend la main</span>';
  }
}

/* Le fil de discussion. Il est redessiné à chaque rafraîchissement, donc il ne
   touche à rien tant qu'aucun message n'est arrivé, et il ne recolle en bas que
   si l'animateur y était déjà : sinon relire un message ancien serait
   impossible, le fil sautant sous les yeux à chaque tour de boucle. */
let chatVu = 0;
function renderChat(){
  const liste = $("#chatListe");
  if(!liste) return;
  const fil = (typeof PARTIE !== "undefined" && PARTIE.chat) ? PARTIE.chat : [];
  const sig = fil.length + ":" + (fil.length ? fil[fil.length-1].id : 0);
  majPastilleChat(fil);
  if(liste.dataset.sig === sig) return;
  const enBas = liste.scrollHeight - liste.scrollTop - liste.clientHeight < 32;
  liste.innerHTML = fil.length
    ? fil.map(m =>
        '<div class="chat-msg'+(m.role==="anim" ? " anim" : "")+'">'+
          '<span class="chat-nom">'+esc(m.name || "?")+'</span>'+
          '<span class="chat-texte">'+esc(m.text || "")+'</span>'+
        '</div>').join("")
    : '<p class="hint">Personne n\'a encore écrit.</p>';
  liste.dataset.sig = sig;
  if(enBas) liste.scrollTop = liste.scrollHeight;
}
/* L'animateur regarde la scène, pas le fil. Sans repère, un message posté
   pendant une question lui échappe complètement. */
function majPastilleChat(fil){
  const titre = $("#chatTitre");
  if(!titre) return;
  const dernier = fil.length ? fil[fil.length-1].id : 0;
  const neufs = fil.filter(m => m.id > chatVu && m.role !== "anim").length;
  titre.dataset.neufs = neufs || "";
  titre.classList.toggle("a-lire", neufs > 0);
  if(document.activeElement === $("#chatMot")) chatVu = dernier;
}

function brancheChat(){
  const champ = $("#chatMot"), envoi = $("#chatGo");
  if(!champ || !envoi) return;
  const liste = $("#chatListe");
  const lu = ()=>{
    const fil = (typeof PARTIE !== "undefined" && PARTIE.chat) ? PARTIE.chat : [];
    chatVu = fil.length ? fil[fil.length-1].id : 0;
    majPastilleChat(fil);
  };
  champ.onfocus = lu;
  if(liste) liste.onclick = lu;
  const envoie = ()=>{
    const texte = champ.value.trim();
    if(!texte) return;
    champ.value = "";
    if(typeof partieChatEnvoie === "function") partieChatEnvoie(texte);
  };
  envoi.onclick = envoie;
  champ.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); envoie(); } };
}

/* Un rechargement accidentel en pleine soirée ne doit pas coûter la partie :
   on retient discrètement où on en était. Le salon et les points, eux, sont
   déjà conservés ailleurs. */
const REPRISE_CLE = "regie-quiz:reprise";
function noteReprise(){
  if(!S.quiz || !S.play) return;
  try{
    localStorage.setItem(REPRISE_CLE, JSON.stringify({
      quizId: S.quiz.id, i: S.play.i, titre: S.quiz.title, ts: Date.now() }));
  }catch(e){}
}
function oublieReprise(){
  try{ localStorage.removeItem(REPRISE_CLE); }catch(e){}
}
/* Proposée seulement si la partie est encore fraîche : au-delà, c'est du
   souvenir, pas une reprise. */
function litReprise(){
  try{
    const r = JSON.parse(localStorage.getItem(REPRISE_CLE) || "null");
    if(!r || !r.quizId) return null;
    if(Date.now() - (r.ts||0) > 6*3600*1000) return null;
    if(!S.list.some(q => q.id === r.quizId)) return null;
    return r;
  }catch(e){ return null; }
}
async function reprendrePartie(){
  const r = litReprise();
  if(!r) return;
  await openQuiz(r.quizId);
  setView("play");
  gotoQ(r.i || 0);
  toast("Partie reprise à la question "+((r.i||0)+1)+".","good");
}

/* Ce qui identifie l'extrait affiché sur la scène. Tant que ça ne bouge pas, le
   lecteur en place est le bon et il continue de jouer. */
let MEDIA_GARDE = null, SCENE_SIG = "";
function signatureScene(){
  const it = (typeof curItem === "function") ? curItem() : null;
  if(!it || !S.play) return "";
  const m = it.q.media || {};
  return JSON.stringify([it.q.id, S.play.phase, !!S.play.shown,
                         m.kind || "", m.assetId || m.url || "",
                         m.start || 0, m.stop || 0]);
}

/* Coupe proprement le média en cours avant de reconstruire la scène. */
function stopMedia(){
  /* On débranche avant de couper : la pause déclenche un évènement, et il
     partirait vers les joueurs avec la position de l'extrait précédent.
     On coupe TOUT ce qui joue sur la scène — question et révélation — car un
     élément retiré du DOM continue de jouer dans Chrome et Edge. */
  document.querySelectorAll("#stage audio, #stage video").forEach(el=>{
    el.onloadedmetadata = el.ontimeupdate = el.onplay = el.onpause = null;
    el.onended = el.onseeked = el.onvolumechange = null;
    try{ el.pause(); }catch(e){}
  });
  stopVisualizer();
}

async function renderStage(){
  const stage = $("#stage");
  if(!stage) return;
  stopMedia();
  const quiz = S.quiz, p = S.play, it = curItem(), q = it.q;
  const revealed = p.phase === "revealed";

  let h = "";
  const hideIt = q.media.kind!=="none" && q.media.hidden && !p.shown;
  if(q.media.kind !== "none"){
    h += hideIt
      ? '<div class="media-stage"><div class="media-hidden"><button class="btn btn-gold btn-lg" id="showMedia">Lancer le média</button></div></div>'
      : '<div class="media-stage" id="mstage"></div>';
  }
  h += '<h2 class="qtext'+(q.media.kind!=="none"?" small":"")+'">'+esc(q.text||"…")+'</h2>';
  /* L'animateur lit toujours son énoncé : ce repère lui rappelle seulement que
     les joueurs, eux, ont l'écran vide. */
  if(p.questionCachee) h += '<p class="hint">Énoncé masqué chez les joueurs</p>';

  if(q.type === "qcm"){
    /* La lettre vient du rang d'origine : le serveur numerote avant de retirer
       les propositions vides, l'animateur doit annoncer les memes lettres. */
    h += '<div class="choices-stage">'+ q.choices.map((c,i)=>({c:c,i:i}))
      .filter(x=>x.c.text.trim()).map(x=>
        '<div class="choice-stage'+(revealed ? (x.c.correct?" good":" bad") : "")+'">'+
          '<span class="lt">'+LETTERS[x.i]+'</span><span>'+esc(x.c.text)+'</span></div>')
      .join("")+'</div>';
  }
  if(revealed){
    const ans = q.type==="qcm"
      ? q.choices.map((c,i)=>({c:c,i:i})).filter(x=>x.c.correct).map(x=>LETTERS[x.i]+". "+x.c.text).join("   ·   ")
      : q.answer;
    h += '<div class="reveal">'+
      '<span class="lbl">Réponse</span>'+
      '<div class="ans">'+esc(ans || "— à toi de trancher —")+'</div>'+
      (q.note ? '<div class="note">'+esc(q.note)+'</div>' : "")+
      '</div>';
    if(q.reveal.kind !== "none") h += '<div class="media-stage" id="rstage"></div>';
  }
  stage.innerHTML = h;

  const garde = MEDIA_GARDE;
  MEDIA_GARDE = null;
  if(garde && $("#mstage")) $("#mstage").replaceWith(garde);

  if($("#showMedia")) $("#showMedia").onclick = ()=>{
    S.play.shown = true;
    if(typeof partieLanceMedia === "function") partieLanceMedia();
    chronoAuLancement();
    renderStage();
  };
  if($("#mstage") && !hideIt && !garde) await mountMedia($("#mstage"), q.media, true);
  if($("#rstage")) await mountMedia($("#rstage"), q.reveal, false);
}

/* Montage d'un média sur la scène */
/* Le curseur de flou, commun aux images et aux vidéos. Ce que l'animateur
   règle ici part vers les joueurs, pour que tout le monde voie le même flou. */
function curseurFlou(m){
  if(!(m.blur||0)) return "";
  return '<div style="width:min(460px,90%);display:flex;align-items:center;gap:10px">'+
    '<span class="eyebrow" style="font-size:.72rem">Flou</span>'+
    '<input type="range" id="blurSlider" min="0" max="'+(m.blur||20)+'" step="1" value="'+S.play.blur+'">'+
    '<button class="btn btn-sm btn-outline" id="blurClear">Net</button></div>';
}
function brancheFlou(el){
  const s = $("#blurSlider");
  if(!s || !el) return;
  const applique = v => {
    S.play.blur = Number(v)||0;
    el.style.filter = "blur("+S.play.blur+"px)";
    if(typeof partieFlou === "function") partieFlou(S.play.blur);
  };
  s.oninput = e => applique(e.target.value);
  const net = $("#blurClear");
  if(net) net.onclick = ()=>{ s.value = 0; applique(0); };
}

/* Rembobiner, mettre en pause, relancer : ce que l'animateur fait de sa lecture
   doit arriver chez les joueurs, sinon ils écoutent un autre passage que la
   salle. Une iframe YouTube ne se pilote pas sans son API : elle reste libre. */
function suitLecture(el){
  if(typeof partieMediaCmd === "function") partieMediaCmd(el.currentTime, !el.paused);
}

async function mountMedia(host, m, isMain){
  /* Le média de la question et celui de la révélation portent les mêmes
     identifiants. On cherche donc TOUJOURS dans le conteneur : sinon la
     révélation pilote le lecteur de la question, et l'extrait précédent
     continue de jouer par-dessus la question suivante. */
  const $m = sel => host.querySelector(sel);
  const src = m.assetId ? await assetURL(m.assetId) : m.url;
  if(!src){
    host.innerHTML = '<div class="media-hidden">Média introuvable — il a peut-être été perdu au rechargement.</div>';
    return;
  }
  const yt = ytId(src);

  if(m.kind === "image"){
    host.innerHTML = '<img id="stageImg" alt="Image de la question" src="'+esc(src)+'" style="filter:blur('+(isMain?S.play.blur:0)+'px)">'+
      (isMain ? curseurFlou(m) : "");
    if(isMain){ brancheFlou($m("#stageImg")); chronoAuLancement(); }
    return;
  }
  if(m.kind === "video"){
    if(yt){
      host.innerHTML = '<iframe id="stageVid" allow="autoplay; fullscreen" allowfullscreen '+
        'style="filter:blur('+(isMain?S.play.blur:0)+'px)" '+
        'src="https://www.youtube-nocookie.com/embed/'+esc(yt)+'?rel=0&modestbranding=1'+(m.start?"&start="+Math.round(m.start):"")+'"></iframe>'+
        (isMain ? curseurFlou(m) : "")+
        '<p class="hint">Lecture YouTube — tes joueurs la reçoivent aussi, mais devront peut-être toucher la vidéo pour la lancer. Pour une diffusion vraiment synchronisée, importe plutôt le fichier.</p>';
      if(isMain) brancheFlou($m("#stageVid"));
    } else {
      host.innerHTML = '<video id="stageVid" controls playsinline src="'+esc(src)+'" '+
        'style="filter:blur('+(isMain?S.play.blur:0)+'px)"></video>'+
        (isMain ? curseurFlou(m) : "");
      const v = $m("#stageVid");
      if(isMain) brancheFlou(v);
      v.volume = VOLUME;
      v.onvolumechange = ()=> setVolume(v.volume);
      v.onloadedmetadata = ()=>{
        if(m.start) v.currentTime = m.start;
        if(isMain) autoPlay(v, host);
      };
      v.ontimeupdate = ()=>{
        if(m.stop && v.currentTime >= m.stop){ v.pause(); finishVideo(host, v, m, isMain); }
      };
      v.onended = ()=> finishVideo(host, v, m, isMain);
      if(isMain) v.onseeked = v.onpause = ()=> suitLecture(v);
      if(isMain) v.onplay = ()=>{ suitLecture(v); chronoAuLancement(); };
    }
    return;
  }
  if(m.kind === "audio" && yt){
    /* Lien YouTube sur une question audio : on garde le lecteur, indispensable
       à la lecture, mais on le recouvre — c'est un blind test, pas un clip. */
    host.innerHTML = '<div class="audio-yt">'+
      '<iframe id="stageVid" allow="autoplay" '+
      'src="https://www.youtube-nocookie.com/embed/'+esc(yt)+'?rel=0&modestbranding=1&controls=1'+
      (m.start?"&start="+Math.round(m.start):"")+'"></iframe>'+
      '<div class="masque"><span>\u266A</span></div></div>'+
      '<p class="hint">Extrait YouTube — l\'image est masquée, seul le son compte. '+
      'Lance la lecture d\'un clic à travers le masque si besoin.</p>';
    return;
  }

  /* audio — lecteur de blind test */
  host.innerHTML =
    '<div class="player">'+
      '<button class="player-btn" id="pPlay" aria-label="Lire ou mettre en pause">▶</button>'+
      '<div class="player-body">'+
        '<canvas class="viz" id="viz"></canvas>'+
        '<div class="player-line">'+
          '<span class="player-time" id="pCur">0:00</span>'+
          '<div class="seek" id="pSeek" role="slider" aria-label="Position"><i id="pFill" style="width:0%"></i></div>'+
          '<span class="player-time" id="pDur">0:00</span>'+
          '<div class="player-vol"><span aria-hidden="true">🔊</span>'+
          '<input type="range" id="pVol" min="0" max="1" step="0.02" value="'+VOLUME+'" aria-label="Volume"></div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<audio id="aud" preload="auto" src="'+esc(src)+'"></audio>'+
    (m.name ? '<p class="hint" style="opacity:.35">'+esc(m.name)+'</p>' : "");

  /* Les noeuds sont capturés une fois : l'audio détaché peut encore émettre
     des évènements après un changement de question, et une requête différée
     renverrait null. */
  const a = $m("#aud"), btn = $m("#pPlay"), fill = $m("#pFill"), seek = $m("#pSeek");
  const cur = $m("#pCur"), dur = $m("#pDur");
  a.volume = VOLUME;
  a.onloadedmetadata = ()=>{
    if(dur) dur.textContent = fmtClock(m.stop ? Math.min(m.stop,a.duration) : a.duration);
    if(m.start) a.currentTime = m.start;
  };
  a.ontimeupdate = ()=>{
    const from = m.start||0, to = m.stop || a.duration || 0;
    const span = Math.max(.001, to-from);
    if(fill) fill.style.width = clamp((a.currentTime-from)/span*100, 0, 100)+"%";
    if(cur) cur.textContent = fmtClock(Math.max(0, a.currentTime-from));
    if(m.stop && a.currentTime >= m.stop){ a.pause(); }
  };
  a.onplay  = ()=>{ btn.textContent = "❚❚";
    if(isMain){ startVisualizer(a); suitLecture(a); chronoAuLancement(); } };
  a.onpause = ()=>{ btn.textContent = "▶"; if(isMain) suitLecture(a); };
  a.onended = ()=>{ btn.textContent = "▶"; };
  if(isMain) a.onseeked = ()=> suitLecture(a);
  btn.onclick = ()=> a.paused ? a.play().catch(()=>toast("Lecture bloquée par le navigateur.","bad")) : a.pause();
  seek.onclick = e => {
    const r = seek.getBoundingClientRect();
    const from = m.start||0, to = m.stop || a.duration || 0;
    a.currentTime = from + (to-from) * clamp((e.clientX-r.left)/r.width, 0, 1);
  };
  $m("#pVol").oninput = e => { setVolume(e.target.value); a.volume = VOLUME; };
  /* Les joueurs démarrent dès que la question s'affiche : si l'animateur
     devait cliquer, il entendrait l'extrait après eux, et son clic les
     ferait tous repartir du début. */
  if(isMain) autoPlay(a, host);
}
/* Lancement automatique. Le navigateur peut refuser une lecture sonore sans
   geste de l'utilisateur : dans ce cas on affiche un gros bouton plutot que de
   laisser une video muette et immobile. */
function autoPlay(el, host){
  const p = el.play();
  if(p && p.catch) p.catch(()=>{
    if(host.querySelector(".vid-start")) return;
    const b = document.createElement("button");
    b.className = "btn btn-gold btn-lg vid-start";
    b.textContent = "Lancer la vidéo";
    b.onclick = ()=>{ b.remove(); el.play().catch(()=>{}); };
    host.appendChild(b);
  });
}

/* Fin de l'extrait : la vidéo disparaît, pour que personne ne la rembobine.
   L'animateur garde un bouton discret s'il veut la remontrer. */
function finishVideo(host, v, m, isMain){
  if(!isMain || host.querySelector(".media-done")) return;
  v.style.display = "none";
  const d = document.createElement("div");
  d.className = "media-done";
  d.innerHTML = '<span>Extrait terminé</span>'+
    '<button class="btn btn-sm btn-outline" data-replay>Rejouer</button>';
  host.appendChild(d);
  d.querySelector("[data-replay]").onclick = ()=>{
    d.remove();
    v.style.display = "";
    v.currentTime = m.start || 0;
    v.play().catch(()=>{});
  };
}

function ytId(u){
  const m = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/.exec(u||"");
  return m ? m[1] : null;
}

/* Visualiseur audio — les barres montent avec la musique */
function startVisualizer(audioEl){
  stopVisualizer();
  const cv = $("#viz");
  if(!cv) return;
  try{
    if(!AUDIO_CTX) AUDIO_CTX = new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO_CTX.state === "suspended") AUDIO_CTX.resume();
    if(!audioEl._srcNode) audioEl._srcNode = AUDIO_CTX.createMediaElementSource(audioEl);
    VIZ_ANALYSER = AUDIO_CTX.createAnalyser();
    VIZ_ANALYSER.fftSize = 128;
    audioEl._srcNode.disconnect();
    audioEl._srcNode.connect(VIZ_ANALYSER);
    VIZ_ANALYSER.connect(AUDIO_CTX.destination);
  }catch(e){ VIZ_ANALYSER = null; }

  const ctx = cv.getContext("2d");
  const gold = getComputedStyle(document.documentElement).getPropertyValue("--gold").trim() || "#F5B841";
  const data = VIZ_ANALYSER ? new Uint8Array(VIZ_ANALYSER.frequencyBinCount) : null;
  let t = 0;

  (function draw(){
    VIZ_RAF = requestAnimationFrame(draw);
    const dpr = window.devicePixelRatio||1, w = cv.clientWidth, hh = cv.clientHeight;
    if(cv.width !== w*dpr){ cv.width = w*dpr; cv.height = hh*dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,hh);
    const n = 40, gap = 3, bw = Math.max(2,(w-(n-1)*gap)/n);
    if(data) VIZ_ANALYSER.getByteFrequencyData(data);
    t += .06;
    for(let i=0;i<n;i++){
      const v = data ? data[Math.floor(i/n*data.length*.7)]/255
                     : (Math.sin(t+i*.4)*.5+.5)*(audioEl.paused?.05:.55);
      const bh = Math.max(2, v*hh*.95);
      ctx.fillStyle = gold;
      ctx.globalAlpha = .28 + v*.72;
      ctx.fillRect(i*(bw+gap), hh-bh, bw, bh);
    }
    ctx.globalAlpha = 1;
  })();
}
function stopVisualizer(){ if(VIZ_RAF){ cancelAnimationFrame(VIZ_RAF); VIZ_RAF = null; } }

/* Rail des équipes — c'est ici que l'animateur tranche */
function renderRail2(){
  const rail = $("#rail2");
  if(!rail) return;
  const quiz = S.quiz, p = S.play, it = curItem();
  if(!quiz.teams.length){
    rail.innerHTML = '<div class="hint" style="padding:8px 4px">Aucune équipe. '+
      '<button class="btn btn-sm btn-gold" id="qAddTeam">Créer les équipes</button></div>';
    $("#qAddTeam").onclick = ()=> setView("teams");
    return;
  }
  const pts = qPoints(it.q, it.round, quiz);
  const half = Math.round(pts/2*2)/2;

  const enLigne = typeof partieActive === "function" && partieActive();

  rail.innerHTML = quiz.teams.map(t=>{
    const aw = awardOf(quiz, t.id, it.q.id);
    const k = aw ? aw.verdict : null;
    const bz = p.buzzes.indexOf(t.id);
    /* Une équipe n'est expulsable que si un joueur connecté se cache derrière :
       les équipes saisies à la main n'ont personne à retirer. */
    const j = enLigne ? PARTIE.joueurs.find(x=>x.teamId === t.id) : null;
    return '<div class="tcard'+(bz>=0?" buzzed":"")+'" style="--tc:'+esc(t.color)+'" data-t="'+t.id+'">'+
      (bz>=0 ? '<span class="buzz-badge">'+(bz+1)+'</span>' : "")+
      '<div class="thd">'+
      /* Une équipe saisie à la main n'a de visage à montrer que si quelqu'un
         s'est connecté derrière. */
      (j && j.avatar ? '<span class="tcard-av">'+avatarHTML(j.avatar, 30)+'</span>' : "")+
      '<span class="tname">'+esc(t.name)+'</span>'+
      '<span class="tscore num" data-sc="'+t.id+'">'+teamScore(quiz,t.id)+'</span></div>'+
      (typeof reponseHTML==="function" ? reponseHTML(t.id) : "")+
      (typeof speedBonusFor==="function" && speedBonusFor(quiz, t.id, it.q.id)
        ? '<div class="tbonus">\u26A1 +'+fmtDec(speedBonusFor(quiz,t.id,it.q.id).delta)+' rapidité</div>' : "")+
      '<div class="award">'+
        '<button data-k="zero" data-t="'+t.id+'" aria-pressed="'+(k==="zero")+'" title="Faux">✕</button>'+
        '<button data-k="half" data-t="'+t.id+'" aria-pressed="'+(k==="half")+'" title="Moitié des points : '+half+'">½</button>'+
        '<button data-k="full" data-t="'+t.id+'" aria-pressed="'+(k==="full")+'" title="Bonne réponse : +'+pts+'">✓</button>'+
      '</div>'+
      '<div class="adjust">'+
        '<button data-d="-1" data-t="'+t.id+'" title="Malus">−1</button>'+
        '<button data-d="1" data-t="'+t.id+'" title="Bonus">+1</button>'+
        '<button data-more="'+t.id+'" title="Autre montant">…</button>'+
        (j ? '<button data-kick="'+esc(j.userId)+'" data-nom="'+esc(j.name)+'" '+
             'title="Retirer '+esc(j.name)+' de la partie">⏏</button>' : "")+
      '</div>'+
    '</div>';
  }).join("");

  $$(".award button", rail).forEach(b=> b.onclick = ()=>{
    const tid = b.dataset.t, kind = b.dataset.k, aw = awardOf(quiz, tid, it.q.id);
    const label = "Q"+(p.i+1)+" — "+({zero:"faux",half:"moitié",full:"juste"}[kind]);
    if(aw && aw.verdict === kind){ setAward(tid, it.q.id, null); }
    else {
      const d = kind==="zero" ? 0 : kind==="half" ? half : pts;
      const rep = (typeof reponseDe === "function") ? reponseDe(tid) : null;
      setAward(tid, it.q.id, d, label, kind, rep ? rep.order : 0);
      flashScore(tid);
    }
    if(typeof applySpeedBonus === "function") applySpeedBonus(it.q.id);
    renderRail2();
  });
  $$("[data-d]", rail).forEach(b=> b.onclick = ()=>{
    adjust(b.dataset.t, Number(b.dataset.d), "Q"+(p.i+1)+" — "+(Number(b.dataset.d)>0?"bonus":"malus"));
    flashScore(b.dataset.t); renderRail2();
  });
  $$("[data-more]", rail).forEach(b=> b.onclick = ()=> customAdjustDialog(b.dataset.more, ()=>renderRail2()));
  $$("[data-kick]", rail).forEach(b=> b.onclick = async ()=>{
    const nom = b.dataset.nom;
    if(!await confirmBox("Retirer ce joueur ?",
        "<strong>"+esc(nom)+"</strong> sera déconnecté et devra rentrer le code du salon "+
        "pour revenir. Son équipe et ses points restent au tableau.", "Retirer", true)) return;
    if(typeof partieKick === "function") await partieKick(b.dataset.kick);

}
function flashScore(tid){
  const n = $('[data-sc="'+tid+'"]');
  if(!n) return;
  n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash");
}

/* Navigation */
function gotoQ(i){
  const list = flat(S.quiz);
  i = clamp(i, 0, list.length-1);
  stopTimer(true); stopMedia();
  /* Aller sur une question, meme celle deja affichee, doit repartir de zero :
     on invalide la scene pour que le lecteur soit remonte et non conserve. */
  SCENE_SIG = "";
  const p = S.play;
  p.i = i; p.phase = "question"; p.buzzes = []; p.blur = null; p.shown = false; p.peek = false; p.endAt = 0;
  p.chronoLance = false;
  /* Réglé avant l'affichage : la question part aux joueurs à la fin de
     viewPlay(), et elle doit partir déjà masquée si la fiche le demande. */
  p.questionCachee = !!list[i].q.hideText;
  viewPlay();
  /* Une question qui repose sur un média ne doit pas voir son chrono tourner
     pendant le chargement, ni pendant que l'animateur la présente. Il partira
     quand l'extrait démarre vraiment, ou quand l'énoncé retenu est affiché.
     Une question libre ou un QCM, eux, sont lisibles tout de suite. */
  const q0 = curItem().q;
  const attend = (q0.media && q0.media.kind !== "none") || !!q0.hideText;
  if(!attend && S.quiz.settings.autoStart && qTimer(q0, S.quiz) > 0) startTimer();
}

/* Le chrono part au moment où les joueurs reçoivent vraiment de quoi répondre,
   et une seule fois par question : rejouer l'extrait ne le relance pas. */
function chronoAuLancement(){
  const p = S.play;
  if(!p || p.chronoLance || p.running || p.endAt) return;
  if(!S.quiz || !S.quiz.settings.autoStart) return;
  const it = curItem();
  if(!it || qTimer(it.q, S.quiz) <= 0) return;
  p.chronoLance = true;
  startTimer();
}
/* Casse et espaces en trop ne devraient pas coûter un point : « lima », « Lima »
   et «  Lima  » sont la même réponse. Le reste — orthographe approximative,
   synonymes, formulations — n'est pas de mon ressort. */
function normaliseReponse(t){
  return String(t == null ? "" : t).trim().replace(/\s+/g, " ").toLowerCase();
}

/* À la révélation, les réponses rigoureusement identiques à celle attendue sont
   validées d'office : c'est la partie fastidieuse et sans enjeu de la
   correction. Aucune réponse n'est jamais refusée automatiquement, et un
   verdict déjà posé à la main n'est jamais écrasé. */
function valideLesExactes(it){
  if(typeof partieActive !== "function" || !partieActive()) return 0;
  const q = it.q;
  if(q.type !== "free") return 0;
  const attendue = normaliseReponse(q.answer);
  if(!attendue) return 0;
  const pts = qPoints(q, it.round, S.quiz);
  let n = 0;
  S.quiz.teams.forEach(t=>{
    if(awardOf(S.quiz, t.id, q.id)) return;
    const rep = (typeof reponseDe === "function") ? reponseDe(t.id) : null;
    if(!rep || normaliseReponse(rep.value) !== attendue) return;
    setAward(t.id, q.id, pts, "Q"+(S.play.i+1)+" — juste (auto)", "full", rep.order || 0);
    n++;
  });
  if(n){
    if(typeof applySpeedBonus === "function") applySpeedBonus(q.id);
    toast(n+" réponse"+(n>1?"s":"")+" exacte"+(n>1?"s":"")+" validée"+(n>1?"s":"")+
          " automatiquement. Les autres attendent ton verdict.","good",5000);
  }
  return n;
}

function reveal(){
  S.play.phase = "revealed";
  stopTimer(true);
  valideLesExactes(curItem());
  viewPlay();
}
function togglePeek(){
  const old = $("#peekBox");
  if(old){ old.remove(); return; }
  const it = curItem(), q = it.q;
  const ans = q.type==="qcm"
    ? q.choices.map((c,i)=>({c,i})).filter(x=>x.c.correct).map(x=>LETTERS[x.i]+". "+x.c.text).join(" · ")
    : q.answer;
  const d = document.createElement("div");
  d.className = "peek"; d.id = "peekBox";
  d.innerHTML = '<span class="lbl">Pour toi seul</span>'+esc(ans || "Aucune réponse saisie");
  document.body.appendChild(d);
  setTimeout(()=>{ const n = $("#peekBox"); if(n) n.remove(); }, 6000);
}
/* Arrêt volontaire, en cours de route : on vide l'écran des joueurs et on
   revient au classement. Les points sont conservés, et la prochaine fois
   l'animation repartira de la première question. */
async function arreterPartie(){
  const enCours = typeof partieActive === "function" && partieActive();
  if(!await confirmBox("Arrêter la partie ?",
      enCours
        ? "Les joueurs retourneront en salle d'attente. Les points sont conservés, "+
          "et tu repartiras de la première question la prochaine fois."
        : "Tu reviendras au classement, et repartiras de la première question la prochaine fois.",
      "Arrêter", true)) return;
  stopTimer(true);
  stopMedia();
  if(typeof partieArret === "function") await partieArret();
  if(typeof PARTIE !== "undefined"){ PARTIE.derniereQ = null; PARTIE.derniereReveal = null; }
  S.play = null;
  oublieReprise();
  setView("scores");
  toast("Partie arrêtée.","good");
}

async function finishQuiz(){
  stopTimer(true);
  setView("scores");
  toast("Quiz terminé — voici le classement.","good",4000);
}

/* ============================================================
   12. CHRONO
   ============================================================ */
function syncTimer(){
  const it = curItem(); if(!it) return;
  const total = qTimer(it.q, S.quiz);
  const c = $("#chrono"), bar = $("#tbar"), fill = $("#tfill");
  if(!c) return;
  if(total <= 0){ c.textContent = "—"; c.className = "chrono idle"; if(fill) fill.style.width = "100%"; return; }
  const left = S.play.left;
  c.textContent = fmtClock(left);
  c.className = "chrono" + (left<=0 ? " done" : left<=5 && S.play.running ? " warn" : S.play.running ? "" : " idle");
  if(fill) fill.style.width = clamp(left/total*100, 0, 100)+"%";
  if(bar) bar.classList.toggle("warn", left<=5);
  MARQ.classList.toggle("live", !!S.play.running);
}
function startTimer(){
  const it = curItem(); if(!it) return;
  const total = qTimer(it.q, S.quiz);
  if(total <= 0) return;
  if(S.play.left <= 0) S.play.left = total;
  S.play.running = true;
  S.play.endAt = Date.now() + S.play.left*1000;
  clearInterval(TICK);
  TICK = setInterval(()=>{
    S.play.left = Math.max(0, (S.play.endAt - Date.now())/1000);
    syncTimer();
    if(S.play.left <= 0){
      clearInterval(TICK); TICK = null;
      S.play.running = false; S.play.left = 0;
      if(S.quiz.settings.beep) beep();
      if(typeof partieFerme === "function") partieFerme(true);
      const b = $("#tStart"); if(b){ b.textContent = "Chrono"; b.className = "btn btn-outline"; }
      syncTimer();
    }
  }, 100);
  const b = $("#tStart"); if(b){ b.innerHTML = 'Pause<span class="kbd">espace</span>'; b.className = "btn btn-rose"; }
  syncTimer();
  if(typeof partieChrono === "function") partieChrono();
}
function stopTimer(silent){
  clearInterval(TICK); TICK = null;
  if(S.play){ S.play.running = false; S.play.endAt = 0; }
  MARQ.classList.remove("live");
  if(!silent){
    const b = $("#tStart"); if(b){ b.innerHTML = 'Chrono<span class="kbd">espace</span>'; b.className = "btn btn-outline"; }
    syncTimer();
    if(typeof partieChrono === "function") partieChrono();
  }
}
const toggleTimer = ()=> S.play.running ? stopTimer(false) : startTimer();
function addTime(s){
  const it = curItem(); if(!it || qTimer(it.q,S.quiz)<=0) return;
  S.play.left += s;
  if(S.play.running) S.play.endAt += s*1000;
  syncTimer();
  if(typeof partieChrono === "function") partieChrono();
}
function resetTimer(){
  const it = curItem(); if(!it) return;
  stopTimer(false);
  S.play.left = qTimer(it.q, S.quiz);
  syncTimer();
  if(typeof partieChrono === "function") partieChrono();
}
function beep(){
  try{
    if(!AUDIO_CTX) AUDIO_CTX = new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO_CTX.state === "suspended") AUDIO_CTX.resume();
    [0,.18,.36].forEach((d,i)=>{
      const o = AUDIO_CTX.createOscillator(), g = AUDIO_CTX.createGain();
      o.type = "triangle";
      o.frequency.value = i===2 ? 440 : 660;
      g.gain.setValueAtTime(0, AUDIO_CTX.currentTime+d);
      g.gain.linearRampToValueAtTime(.22, AUDIO_CTX.currentTime+d+.01);
      g.gain.exponentialRampToValueAtTime(.001, AUDIO_CTX.currentTime+d+(i===2?.5:.14));
      o.connect(g); g.connect(AUDIO_CTX.destination);
      o.start(AUDIO_CTX.currentTime+d); o.stop(AUDIO_CTX.currentTime+d+(i===2?.55:.16));
    });
  }catch(e){}
}

/* ============================================================
   13. RACCOURCIS CLAVIER
   ============================================================ */
document.addEventListener("keydown", e => {
  if($("#modalLayer").hidden === false) return;
  const t = e.target;
  if(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.isContentEditable)) return;
  if(S.view !== "play" || !S.play) return;
  const list = flat(S.quiz);
  const k = e.key;

  if(k === " "){ e.preventDefault(); toggleTimer(); return; }
  if(k === "r" || k === "R"){ e.preventDefault(); S.play.phase==="question" ? reveal() : (S.play.phase="question", viewPlay()); return; }
  if(k === "ArrowRight" || k === "n"){ e.preventDefault(); S.play.i===list.length-1 ? finishQuiz() : gotoQ(S.play.i+1); return; }
  if(k === "ArrowLeft" || k === "p"){ e.preventDefault(); gotoQ(S.play.i-1); return; }
  if(k === "m"){ const a = $("#aud"); if(a){ e.preventDefault(); a.paused ? a.play().catch(()=>{}) : a.pause(); } return; }
  if(k === "f"){ e.preventDefault(); toggleFullscreen(); return; }
  if(/^[1-9]$/.test(k) && S.quiz.settings.buzzer){
    const t2 = S.quiz.teams[Number(k)-1];
    if(t2 && S.play.buzzes.indexOf(t2.id) < 0){ S.play.buzzes.push(t2.id); renderRail2(); }
    return;
  }
  if(k === "Backspace" && S.play.buzzes.length){ e.preventDefault(); S.play.buzzes = []; renderRail2(); }
});
function toggleFullscreen(){
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){ toast("Le plein écran est bloqué ici.","bad"); }
}

      (typeof partieActive==="function" && partieActive()
        ? sw("sDMedia","Envoyer les médias aux joueurs", s.mediasJoueurs !== false,

        : "")+

/* ============================================================
   15. EXPORT / IMPORT
   ============================================================ */
/* Enregistrement d'un fichier.
   En local (fichier ouvert directement), un lien de téléchargement suffit.
   Dans le visualiseur en ligne, la page n'a pas le droit de déclencher un
   téléchargement : il faut passer par la capacité « downloads », qui demande
   son accord au lecteur. Les deux chemins cohabitent. */
const INSIDE_VIEWER = typeof window.claude !== "undefined" && !!window.claude.use;
let DL;
async function getDownloads(){
  if(!INSIDE_VIEWER) return null;
  if(DL === undefined){ try{ DL = await window.claude.use("downloads"); }catch(e){ DL = null; } }
  return DL;
}
async function saveFile(name, text){
  const dl = await getDownloads();
  if(dl){
    try{ await dl.save({ filename:name, data:text }); toast("Fichier enregistré.","good"); }
    catch(e){
      toast(({
        declined:     "Enregistrement annulé.",
        too_large:    "Fichier trop lourd (16 Mo maximum) — exporte sans les médias.",
        rate_limited: "Une demande est déjà ouverte — réessaie dans un instant.",
        bad_request:  "Nom de fichier refusé."
      }[e && e.code]) || "Enregistrement impossible ici — utilise plutôt Copier.", "bad", 5000);
    }
    return;
  }
  try{
    const url = URL.createObjectURL(new Blob([text], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast("Téléchargement lancé.","good");
  }catch(e){ toast("Téléchargement bloqué ici — utilise plutôt Copier.","bad",5000); }
}
const quizFileName = ()=>
  ((S.quiz.title||"quiz").replace(/[^\w\-À-ÿ ]+/g,"").trim().replace(/\s+/g,"-").toLowerCase() || "quiz")+".json";

const blobToDataURL = b => new Promise(res=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = ()=>res(null); r.readAsDataURL(b); });
function dataURLtoBlob(d){
  const [head, b64] = String(d).split(",");
  const mime = (/data:([^;]+)/.exec(head)||[])[1] || "application/octet-stream";
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function copyText(txt, okMsg){
  const done = ()=> toast(okMsg||"Copié.","good");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else fallback();
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Copie impossible — sélectionne le texte à la main.","bad"); }
    ta.remove();
  }
}
function mediaIds(quiz){
  const ids = new Set();
  quiz.rounds.forEach(r=>r.questions.forEach(q=>{
    if(q.media && q.media.assetId) ids.add(q.media.assetId);
    if(q.reveal && q.reveal.assetId) ids.add(q.reveal.assetId);
  }));
  return [...ids];
}
async function buildExport(withMedia){
  const quiz = JSON.parse(JSON.stringify(S.quiz));
  const assets = {};
  if(withMedia){
    for(const id of mediaIds(quiz)){
      const a = await getAsset(id);
      if(a && a.blob){
        const d = await blobToDataURL(a.blob);
        if(d) assets[id] = { name:a.name, type:a.type, size:a.size, data:d };
      }
    }
  } else {
    quiz.rounds.forEach(r=>r.questions.forEach(q=>{
      ["media","reveal"].forEach(k=>{
        if(q[k] && q[k].assetId){ q[k] = Object.assign(newMedia(), {kind:"none"}); }
      });
    }));
  }

const AVATARS_MAX  = 60;    /* même plafond que le serveur */
const AVATAR_COTE  = 256;
const AVATAR_SEUIL = 52;    /* distance RVB en deçà de laquelle deux pixels
                               passent pour la même couleur */

const avatarImgURL = id =>
  "/api/avatarimg?room=" + encodeURIComponent(PARTIE.code) + "&id=" + encodeURIComponent(id);

/* Le pack vit sur le serveur, qui le sert aux joueurs : on le redemande à
   chaque fois plutôt que d'entretenir une copie qui vieillit. */
async function avatarPackLit(){
  try{
    const r = await fetch(avecSalon("/api/state"), {cache:"no-store", headers:enTetes()});
    if(r.status === 401){ demandeCle(); return null; }
    if(!r.ok) return null;
    const d = await r.json();
    const p = d.pack || d.avatarPack || (Array.isArray(PARTIE.pack) ? PARTIE.pack : null);
    return Array.isArray(p) ? p : [];

}

function avatarCharge(fichier){
  return new Promise((ok, non)=>{
    const url = URL.createObjectURL(fichier);
    const img = new Image();
    img.onload  = ()=>{ URL.revokeObjectURL(url); ok(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); non(new Error("format illisible")); };
    img.src = url;
  });
}

/* Rend transparent le fond uni. On part des quatre bords et on avance de
   proche en proche : ce qui touche le bord sans changer de couleur est du
   fond, le reste est le sujet. File d'attente et non récursion — 65 536
   pixels feraient déborder la pile d'appels.
   Renvoie false quand le fond n'était pas uni : l'image reste intacte. */
function avatarDetoure(ctx, cote, ref){
  const im = ctx.getImageData(0, 0, cote, cote);
  const px = im.data, total = cote * cote;

  const bord = [];
  for(let x = 0; x < cote; x++){ bord.push(x); bord.push((cote-1)*cote + x); }
  for(let y = 1; y < cote-1; y++){ bord.push(y*cote); bord.push(y*cote + cote-1); }

  const fr = ref.r, fg = ref.g, fb = ref.b;
  const seuil2 = AVATAR_SEUIL * AVATAR_SEUIL;
  const proche = i2 => {
    const o = i2*4, dr = px[o]-fr, dg = px[o+1]-fg, db = px[o+2]-fb;
    return dr*dr + dg*dg + db*db <= seuil2;
  };

  const fond = new Uint8Array(total);
  const attente = new Int32Array(total);
  let lu = 0, ecrit = 0;
  const pousse = i2 => {
    if(fond[i2] || !proche(i2)) return;
    fond[i2] = 1; attente[ecrit++] = i2;
  };
  bord.forEach(pousse);
  while(lu < ecrit){
    const i2 = attente[lu++], x = i2 % cote, y = (i2 / cote) | 0;
    if(x > 0)      pousse(i2-1);
    if(x < cote-1) pousse(i2+1);
    if(y > 0)      pousse(i2-cote);
    if(y < cote-1) pousse(i2+cote);
  }
  if(ecrit > total * 0.97) return "vide";
  if(ecrit < total * 0.02) return "rien";

  for(let i2 = 0; i2 < total; i2++) if(fond[i2]) px[i2*4+3] = 0;

  /* Un pixel effacé qui touche encore le sujet reprend une opacité partielle et
     la couleur de ses voisins restés opaques. Sans ce liseré, la découpe fait
     un escalier très visible à la taille d'un avatar, et le fond effacé laisse
     un halo de sa propre couleur. */
  for(let i2 = 0; i2 < total; i2++){
    if(!fond[i2]) continue;
    const x = i2 % cote, y = (i2 / cote) | 0;
    let n = 0, r = 0, g = 0, b = 0;
    const voisin = j2 => {
      if(fond[j2]) return;
      const o = j2*4; n++; r += px[o]; g += px[o+1]; b += px[o+2];
    };
    if(x > 0)      voisin(i2-1);
    if(x < cote-1) voisin(i2+1);
    if(y > 0)      voisin(i2-cote);
    if(y < cote-1) voisin(i2+cote);
    if(!n) continue;
    const o = i2*4;
    px[o] = r/n; px[o+1] = g/n; px[o+2] = b/n; px[o+3] = Math.min(210, 55*n);
  }
  ctx.putImageData(im, 0, 0);
  return "fait";
}


/* Un avatar s'affiche dans un rond de quelques dizaines de pixels : inutile
   de faire voyager un cliché de douze mégapixels. */
/* Une image déjà détourée arrive avec des pixels transparents. La retoucher
   n'aurait aucun sens : le fond « uni » serait alors le noir de la transparence,
   et on découperait tout ce que le sujet a de sombre. */
function avatarDejaDetouree(img, l, h){
  try{
    const t = Math.min(96, Math.max(l, h));
    const c = document.createElement("canvas");
    c.width = c.height = t;
    const x = c.getContext("2d", {willReadFrequently:true});
    x.drawImage(img, 0, 0, t, t);
    const px = x.getImageData(0, 0, t, t).data;
    let clairs = 0;
    for(let i = 3; i < px.length; i += 4) if(px[i] < 250) clairs++;
    return clairs > (t*t) * 0.02;
  }catch(e){ return false; }
}

/* Diagnostic du fond, sur l'image d'origine — et surtout pas sur le cadre
   qu'on fabrique ensuite : sa marge peinte serait uniforme par construction, et
   le contrôle ne vérifierait plus rien. On rend la couleur du pourtour et la
   proportion du pourtour qui s'y conforme. */
function fondDe(img){
  const t = 72;
  const c = document.createElement("canvas");
  c.width = c.height = t;
  const x = c.getContext("2d", {willReadFrequently:true});
  x.drawImage(img, 0, 0, t, t);
  const px = x.getImageData(0, 0, t, t).data;
  const bord = [];
  for(let i = 0; i < t; i++){ bord.push(i); bord.push((t-1)*t + i); }
  for(let y = 1; y < t-1; y++){ bord.push(y*t); bord.push(y*t + t-1); }
  const rs = [], gs = [], bs = [];
  bord.forEach(i => { rs.push(px[i*4]); gs.push(px[i*4+1]); bs.push(px[i*4+2]); });
  const med = a => { a.slice().sort((p2,q2)=>p2-q2); a.sort((p2,q2)=>p2-q2); return a[a.length >> 1]; };
  const r = med(rs), g = med(gs), b = med(bs);
  const seuil2 = AVATAR_SEUIL * AVATAR_SEUIL;
  let daccord = 0;
  bord.forEach(i => {
    const o = i*4, dr = px[o]-r, dg = px[o+1]-g, db = px[o+2]-b;
    if(dr*dr + dg*dg + db*db <= seuil2) daccord++;
  });
  return { r:r, g:g, b:b, accord: daccord / bord.length };
}

async function avatarPrepare(fichier, detourer){
  const img = await avatarCharge(fichier);
  const cote = AVATAR_COTE;
  const l = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if(!l || !h) throw new Error("dimensions inconnues");
  const c = document.createElement("canvas");
  c.width = c.height = cote;
  const ctx = c.getContext("2d", {willReadFrequently:true});

  const deja = detourer && avatarDejaDetouree(img, l, h);
  /* Un pourtour qui n'est pas très majoritairement d'une seule couleur — photo,
     dégradé, ou sujet qui déborde du cadre — ne se découpe pas proprement.
     Mieux vaut l'image entière qu'un sujet amputé. */
  const ref = detourer && !deja ? fondDe(img) : null;
  const uni = !!ref && ref.accord >= 0.85;
  const decoupe = detourer && !deja && uni;
  /* Pour détourer, l'image entre en entier dans le cadre, avec une marge : le
     remplissage part des bords, il lui faut du fond à ronger. Sans découpe, on
     remplit le cadre : un avatar rond ne doit pas flotter dans du vide. */
  const k = decoupe ? Math.min((cote-8)/l, (cote-8)/h) : Math.max(cote/l, cote/h);
  if(decoupe){
    /* La marge ajoutée est peinte du fond : sinon le remplissage part d'un vide
       noir et n'atteint jamais la vraie couleur de fond. */
    ctx.fillStyle = "rgb(" + ref.r + "," + ref.g + "," + ref.b + ")";
    ctx.fillRect(0, 0, cote, cote);
  }
  ctx.drawImage(img, (cote - l*k)/2, (cote - h*k)/2, l*k, h*k);

  const etat = decoupe ? avatarDetoure(ctx, cote, ref)
                       : (deja ? "deja" : (ref && !uni ? "nonuni" : "non"));
  const blob = await new Promise(res => c.toBlob(res, "image/png"));
  if(!blob) throw new Error("conversion en PNG refusée");
  return { blob: blob, etat: etat };
}

async function avatarPackEnvoie(blob, nom){
  const fd = new FormData();
  fd.append("payload", JSON.stringify({name: nom}));
  fd.append("media", blob, "avatar.png");
  const r = await fetch(avecSalon("/api/avatarpack"), {method:"POST", body:fd, headers:enTetes()});
  if(r.status === 401){ demandeCle(); throw new Error("code d'animateur demandé"); }
  if(!r.ok) throw new Error("refus du serveur");
  const d = await r.json();
  if(!d || !d.ok) throw new Error((d && d.error) || "refus du serveur");
  return d;
}

    '<p class="hint">Ces images s\'ajoutent aux figures dessinées par l\'appli : chaque joueur choisit la sienne '+
    'depuis son téléphone. Celles que tu ajoutes ici <strong>disparaissent avec le salon</strong>. '+
    'Pour qu\'elles restent définitivement, et pour tous les animateurs, sers-toi de '+
    '« Préparer pour le dépôt » puis dépose les fichiers obtenus dans le dossier '+
    '<code>avatars/</code> de ton dépôt GitHub.</p>'+

      '<label class="btn btn-outline" style="cursor:pointer">Ajouter des images'+
        '<input type="file" accept="image/*" multiple id="avFiles" hidden></label>'+
      '<label class="btn btn-outline" style="cursor:pointer">Préparer pour le dépôt'+
        '<input type="file" accept="image/*" multiple id="avExport" hidden></label>'+
      '<span class="hint" id="avProg"></span>'+
    '</div>'+
    '<label class="switch" style="align-items:flex-start">'+
      '<input type="checkbox" id="avCut" checked><span class="track" style="margin-top:2px"></span>'+
      '<span class="txt"><strong>Détourer le fond uni</strong><br>'+
      '<span class="hint">Le fond d\'une seule couleur devient transparent et le sujet se découpe dans le rond. '+
      'Une photo au fond chargé est gardée telle quelle.</span></span></label>'+
    '<hr class="rule">'+
    '<div class="panel-hd"><h3>Le pack</h3><span class="pill" id="avCount">…</span></div>'+
    '<div id="avList"><p class="hint">Lecture du pack…</p></div>'+
  '</div><div class="foot"><button class="btn btn-gold" data-x="ok">Terminé</button></div>');

  m.root.querySelector('[data-x="ok"]').onclick = m.close;

  /* Prépare des fichiers à déposer dans le dépôt : même traitement que pour un
     envoi, mais le résultat est enregistré au lieu de partir au serveur. Une
     image posée dans avatars/ est là pour tout le monde, définitivement. */
  const champExport = m.root.querySelector("#avExport");
  if(champExport) champExport.onchange = async e => {
    const fichiers = [...(e.target.files || [])];
    e.target.value = "";
    if(!fichiers.length) return;
    const detourer = m.root.querySelector("#avCut").checked;
    let faits = 0;
    for(const f of fichiers){
      prog("Préparation " + (faits + 1) + " / " + fichiers.length + "…");
      try{
        const p2 = await avatarPrepare(f, detourer);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(p2.blob);
        a.download = (f.name.replace(/\.[^.]+$/, "") || "avatar").slice(0, 40) + ".png";
        a.click();
        setTimeout(()=> URL.revokeObjectURL(a.href), 20000);
        faits++;
      }catch(err){
        toast("« " + f.name + " » n'a pas pu être préparée.", "bad", 4000);
      }
    }
    prog("");
    if(faits) toast(faits + " image" + (faits > 1 ? "s" : "") + " enregistrée" +
      (faits > 1 ? "s" : "") + ". Dépose-les dans le dossier avatars/ de ton dépôt.", "good", 7000);
  };

  let pack = [];
  const prog = t => { const e = m.root.querySelector("#avProg"); if(e) e.textContent = t || ""; };

  async function montre(){
    const p = await avatarPackLit();
    if(!m.root.isConnected) return;   /* fermé pendant l'aller-retour */
    const liste = m.root.querySelector("#avList");
    const cpt   = m.root.querySelector("#avCount");
    if(p === null){
      cpt.textContent = "?";
      liste.innerHTML = '<p class="hint">Le serveur n\'a pas répondu : le pack ne peut pas être affiché pour l\'instant.</p>';
      return;
    }
    pack = p;
    const fixes = pack.filter(a => a.fixe).length;
    cpt.textContent = pack.length + " image" + (pack.length > 1 ? "s" : "") +
      (fixes ? " · " + fixes + " du dépôt" : "");
    liste.innerHTML = pack.length
      ? '<div class="av-pack">' + pack.map(a =>
          '<div class="av-item">'+
            '<div class="av-vig"><img src="'+esc(avatarImgURL(a.id))+'" alt="" loading="lazy"></div>'+
            (a.fixe
              ? '<span class="av-fixe" title="Livrée avec l\'application">\u25c6</span>'
              : '<button class="icon-btn danger" data-av="'+esc(a.id)+'" title="Retirer cette image">✕</button>')+
            '<span class="av-nom" title="'+esc(a.name || "")+'">'+esc(a.name || "sans nom")+'</span>'+
          '</div>').join("") + '</div>'
      : '<p class="hint">Aucune image pour l\'instant : les joueurs n\'ont que les figures dessinées.</p>';

    /* La confirmation prend la place de ce dialogue — il n'y a qu'un calque de
       modale. On le rouvre ensuite, sans quoi l'animateur se retrouve devant
       la page nue après avoir retiré une image. */
    liste.querySelectorAll("[data-av]").forEach(b => b.onclick = async ()=>{
      const a = pack.find(x => x.id === b.dataset.av);
      const oui = await confirmBox("Retirer cette image ?",
        "<strong>"+esc((a && a.name) || "Cette image")+"</strong> ne sera plus proposée. "+
        "Les joueurs qui l'avaient choisie retrouveront une figure dessinée.", "Retirer", true);
      if(oui){
        const r = await partiePost("/api/avatarpackdel", {id: b.dataset.av});
        if(r) toast("Image retirée.");
        else  toast("Le serveur n'a pas retiré l'image.", "bad", 4000);
      }
      avatarsDialog();
    });
  }

  /* Un par un : chaque image passe par un canevas, et une rafale de gros
     fichiers gèlerait la page si on ne rendait pas la main entre deux. */
  m.root.querySelector("#avFiles").onchange = async e => {
    const fichiers = [...e.target.files];
    e.target.value = "";   /* pour pouvoir reprendre le même fichier après un échec */
    if(!fichiers.length) return;
    const detourer = m.root.querySelector("#avCut").checked;
    let ajoutees = 0, ratees = 0;

    for(let i = 0; i < fichiers.length; i++){
      if(pack.length + ajoutees >= AVATARS_MAX){
        toast("Le pack est plein : " + AVATARS_MAX + " images au maximum.", "bad", 5000);
        break;
      }
      const f = fichiers[i];
      prog("Image " + (i+1) + " sur " + fichiers.length + " — " + f.name + "…");
      await new Promise(r => setTimeout(r, 0));   /* laisse l'affichage suivre */
      try{
        const p = await avatarPrepare(f, detourer);
        await avatarPackEnvoie(p.blob, f.name);
        ajoutees++;
        const dit = {
          nonuni: "son fond n'est pas d'une seule couleur : elle est ajoutée telle quelle.",
          vide:   "elle est presque entièrement de la couleur du fond : ajoutée telle quelle.",
          rien:   "aucun fond uni à retirer : ajoutée telle quelle."
        }[p.etat];
        if(dit) toast("« " + f.name + " » — " + dit, "bad", 5000);
      }catch(err){
        ratees++;   /* un échec ne doit pas emporter les fichiers suivants */
        toast("« " + f.name + " » refusée" + (err && err.message ? " : " + err.message : "") + ".", "bad", 5000);
      }
      if(!m.root.isConnected) return;   /* dialogue fermé en cours de route */
    }
    prog(ajoutees + " ajoutée" + (ajoutees > 1 ? "s" : "") + (ratees ? ", " + ratees + " en échec" : "") + ".");
    montre();
  };

  montre();
}

      '<button class="btn btn-gold btn-lg" data-p="host">Fiche animateur</button>'+
      '<button class="btn btn-outline btn-lg" data-p="sheet">Grille de réponses</button>'+
    '</div>'+
    '<p class="hint">La fiche animateur contient les réponses et les anecdotes. La grille ne contient que les numéros, '+
    'les propositions des QCM et des lignes vierges.</p>'+
  '</div><div class="foot"><button class="btn btn-ghost" data-x="no">Fermer</button></div>');
  m.root.querySelector('[data-x="no"]').onclick = m.close;
  m.root.querySelectorAll("[data-p]").forEach(b=> b.onclick = ()=>{ m.close(); doPrint(b.dataset.p); });
}
function doPrint(mode){
  const quiz = S.quiz;
  const host = mode === "host";
  let h = '<h1>'+esc(quiz.title)+'</h1>';
  h += '<div class="pmeta">'+(host ? "Fiche animateur" : "Grille de réponses")+
       (quiz.desc ? " — "+esc(quiz.desc) : "")+'</div>';
  if(!host) h += '<div class="pmeta" style="margin-top:4mm">Équipe : ______________________________</div>';

  let n = 0;
  quiz.rounds.forEach(r=>{
    h += '<h2>'+esc(r.title)+(nb(r.coef,1)!==1 ? " — coefficient ×"+r.coef : "")+'</h2>';
    r.questions.forEach(q=>{
      n++;
      const pts = qPoints(q, r, quiz), tim = qTimer(q, quiz);
      const mk = {image:"image", audio:"musique", video:"vidéo"}[q.media.kind];
      h += '<div class="pq"><b>'+n+'.</b> '+esc(q.text||"—")+
           ' <span class="pmeta">['+ptsTxt(pts)+(tim>0?" · "+tim+" s":"")+(mk?" · "+mk:"")+']</span>';
      if(q.type === "qcm"){
        const cs = q.choices.filter(c=>c.text.trim());
        h += '<div style="margin:1mm 0 0 9mm">'+ cs.map((c,i)=>
          '<span style="margin-right:6mm">'+LETTERS[i]+". "+esc(c.text)+
          (host && c.correct ? ' <span class="pa">✓</span>' : "")+'</span>').join("")+'</div>';
      }
      if(host){
        const ans = q.type === "qcm"
          ? q.choices.map((c,i)=>({c,i})).filter(x=>x.c.correct).map(x=>LETTERS[x.i]).join(", ")
          : q.answer;
        h += '<div class="pa">→ '+esc(ans || "(réponse non saisie)")+'</div>';
        if(q.note) h += '<div class="pn">'+esc(q.note)+'</div>';
      } else {
        h += '<div class="pline"></div>';
      }
      h += '</div>';
    });
  });
  if(host && quiz.teams.length){
    h += '<h2>Équipes</h2><div class="pq">'+quiz.teams.map(t=>esc(t.name)).join(" · ")+'</div>';
  }
  $("#printRoot").innerHTML = h;
  setTimeout(()=>{ try{ window.print(); }catch(e){ toast("L'impression est bloquée ici.","bad"); } }, 60);
}

const THEME_KEY = "regie-quiz:theme";
function applyTheme(t){
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
function cycleTheme(){
  const cur = localStorage.getItem(THEME_KEY);
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  if(next) localStorage.setItem(THEME_KEY, next); else localStorage.removeItem(THEME_KEY);
  applyTheme(next);
  toast(next === "dark" ? "Thème sombre — pour la salle." : next === "light" ? "Thème clair — pour écrire." : "Thème suivant le système.");
}

(async function start(){
  try{ applyTheme(localStorage.getItem(THEME_KEY)); }catch(e){}
  $("#themeBtn").onclick = cycleTheme;
  $("#brandBtn").onclick = ()=> setView("library");
  $("#tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab");
    if(b && !b.disabled) setView(b.dataset.v);
  });
  window.addEventListener("beforeunload", ()=>{ if(S.quiz) saveQuiz(S.quiz); });
  getDownloads();   /* résolu en arrière-plan : le dialogue d'export n'attend pas */

  await openDB();
  await refreshList();
  render();
})();

<script>
"use strict";

/* ============================================================
   19. LA PARTIE EN LIGNE

   Cette console pilote une partie hébergée par regie-serveur.py.
   Le quiz reste dans ce navigateur ; le serveur ne relaie que la
   partie en cours vers la page des joueurs.

   Sans serveur en face — fichier ouvert en direct, ou version
   publiée en ligne — tout ce bloc reste silencieux et l'appli
   fonctionne comme un pupitre hors ligne.
   ============================================================ */
const PARTIE = {
  branchee:false,       // un serveur répond
  code:"",              // code du salon, cinq lettres
  cle:"",               // code d'animateur, si le serveur en exige un
  joueurs:[], reponses:[], buzz:[], buzzMode:false, buzzGagnant:null,
  chat:[], questionCachee:false, preQ:null, prePret:null,
  v:-1, derniereQ:null, derniereReveal:null, signatureEquipes:"", echecs:0
};

const partieActive = ()=> PARTIE.branchee && !!PARTIE.code;

const SALON_CLE = "regie-quiz:salon";
const CLE_CLE = "regie-quiz:cle";
try{ PARTIE.cle = localStorage.getItem(CLE_CLE) || ""; }catch(e){ PARTIE.cle = ""; }
const enTetes = (base)=>{
  const h = Object.assign({}, base||{});
  if(PARTIE.cle) h["X-Regie-Cle"] = PARTIE.cle;
  return h;
};
const avecSalon = p => PARTIE.code
  ? p + (p.indexOf("?") >= 0 ? "&" : "?") + "room=" + encodeURIComponent(PARTIE.code)
  : p;
const lienJoueur = ()=> location.origin + "/jouer?c=" + encodeURIComponent(PARTIE.code);

/* ------------------------------------------------------------ échanges */
async function partiePost(chemin, corps){
  if(!PARTIE.branchee) return null;
  try{
    const r = await fetch(avecSalon(chemin), {
      method:"POST", headers:enTetes({"Content-Type":"application/json"}),
      body:JSON.stringify(corps||{})
    });
    if(r.status === 401){ demandeCle(); return null; }
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }
}

/* Le serveur peut exiger un code d'animateur. Il n'est demandé qu'une fois,
   puis gardé dans ce navigateur. Les joueurs, eux, n'en ont pas besoin. */
let cleDemandee = false;
function demandeCle(){
  if(cleDemandee) return;
  cleDemandee = true;
  const m = modal('<h2>Code d\'animateur</h2><div class="body">'+
    '<p class="hint">Ce site demande un code pour ouvrir une partie. '+
    'Tes joueurs n\'en ont pas besoin : il ne sert qu\'à empêcher un inconnu '+
    'd\'utiliser ton serveur.</p>'+
    '<div class="field"><label for="kCle">Code</label>'+
    '<input type="password" id="kCle" autocomplete="current-password"></div>'+
    '</div><div class="foot"><button class="btn btn-gold" data-x="ok">Valider</button></div>');
  const valider = ()=>{
    const v = (m.root.querySelector("#kCle").value || "").trim();
    if(!v) return;
    PARTIE.cle = v;
    try{ localStorage.setItem(CLE_CLE, v); }catch(e){}
    m.close(); cleDemandee = false;
    PARTIE.code = ""; PARTIE.v = -1;
    partieRafraichit();
  };
  m.root.querySelector('[data-x="ok"]').onclick = valider;
  m.root.querySelector("#kCle").onkeydown = e => { if(e.key==="Enter") valider(); };
}

/* Envoi d'une question ou d'une révélation, média compris. Le média est le
   seul moyen pour les joueurs de voir l'image ou d'entendre l'extrait sur
   leur propre écran, donc il part avec le message. */
const EXT_MEDIA = {image:".png", audio:".mp3", video:".mp4"};
const nomMedia = m => (m.name || "média") +
  (/\.[a-z0-9]{2,4}$/i.test(m.name||"") ? "" : (EXT_MEDIA[m.kind] || ".bin"));
const MAX_MEDIA = 48 * 1024 * 1024;

/* Le média de la question suivante part pendant que celle-ci se joue. Sur une
   connexion domestique, une vidéo met plusieurs secondes à monter : sans ça,
   l'animateur annonce sa question devant un écran encore vide. */
async function partiePreEnvoi(q){
  if(!partieActive() || !q || !q.media || q.media.kind === "none" || !q.media.assetId) return;
  if(PARTIE.preQ === q.id) return;
  if(S.quiz && S.quiz.settings.mediasJoueurs === false) return;
  PARTIE.preQ = q.id;
  try{
    const rec = await getAsset(q.media.assetId);
    if(!rec || !rec.blob || rec.blob.size > MAX_MEDIA) return;
    const fd = new FormData();
    fd.append("payload", JSON.stringify({qid: q.id, mediaKind: q.media.kind}));
    fd.append("media", rec.blob, nomMedia(q.media));
    const r = await fetch(avecSalon("/api/premedia"), {method:"POST", body:fd, headers:enTetes()});
    if(r.ok) PARTIE.prePret = q.id;
  }catch(e){
    PARTIE.preQ = null;   /* on retentera au prochain passage */
  }
}

async function partieEnvoi(chemin, charge, m){
  if(!PARTIE.branchee) return null;
  const joindre = !S.quiz || S.quiz.settings.mediasJoueurs !== false;
  /* Une question porte un média mais le réglage l'empêche de partir : sans
     avertissement, l'animateur croit simplement que le son est cassé. */
  if(!joindre && m && m.kind !== "none"){
    toast("Le média de cette question n'est pas envoyé aux joueurs. "+
          "Coche « Envoyer les médias aux joueurs » dans les Réglages.", "bad", 7000);
  }
  /* Déjà déposé pendant la question précédente : inutile de le renvoyer. */
  if(chemin === "/api/question" && m && m.assetId && PARTIE.prePret === charge.id){
    charge.mediaKind = m.kind;
    PARTIE.prePret = null;
    return partiePost(chemin, charge);
  }
  let blob = null;
  if(joindre && m && m.kind !== "none"){
    charge.mediaKind = m.kind;
    if(m.assetId){
      try{
        const rec = await getAsset(m.assetId);
        if(rec && rec.blob){
          if(rec.blob.size > MAX_MEDIA){
            toast("Média de "+Math.round(rec.blob.size/1048576)+" Mo : trop lourd pour être envoyé. "+
                  "La question part sans lui.","bad",6000);
          } else blob = rec.blob;
        }
      }catch(e){ toast("Média illisible : la question part sans lui.","bad",5000); }
    } else if(m.url){
      charge.mediaUrl = m.url;
    }
  }
  if(!blob) return partiePost(chemin, charge);

  try{
    const fd = new FormData();
    fd.append("payload", JSON.stringify(charge));
    fd.append("media", blob, nomMedia(m));
    const r = await fetch(avecSalon(chemin), {method:"POST", body:fd, headers:enTetes()});
    if(r.status === 401){ demandeCle(); return null; }
    if(r.ok) return await r.json();
    toast("Média refusé par le serveur : la question part sans lui.","bad",5000);
    return partiePost(chemin, charge);
  }catch(e){
    return partiePost(chemin, charge);   /* coupure : la question part quand même */
  }
}

/* ------------------------------------------------------------ le salon */
async function ouvrirSalon(){
  let voulu = "";
  try{ voulu = localStorage.getItem(SALON_CLE) || ""; }catch(e){}
  try{
    const r = await fetch("/api/room", {
      method:"POST", headers:enTetes({"Content-Type":"application/json"}),
      body: JSON.stringify({code: voulu})
    });
    if(r.status === 401){ demandeCle(); return false; }
    if(!r.ok) return false;
    const d = await r.json();
    if(d && d.ok){
      PARTIE.code = d.code;
      try{ localStorage.setItem(SALON_CLE, d.code); }catch(e){}
      return true;
    }
  }catch(e){}
  return false;
}

/* ------------------------------------------------ découverte au démarrage */
async function partieDetecte(){
  /* Un hébergeur gratuit s'endort et met parfois une minute à se réveiller.
     Tant que quelque chose répond en face, on insiste au lieu d'abandonner. */
  for(let essai = 0; essai < 25; essai++){
    let repond = false;
    try{
      const r = await fetch("/api/ping", {cache:"no-store"});
      repond = true;
      if(r.ok){
        const d = await r.json();
        if(!d || !d.web) return false;   /* un serveur, mais pas le nôtre */
        PARTIE.branchee = true;
        await ouvrirSalon();
        montePastille();
        partieBoucle();
        return true;
      }
    }catch(e){ repond = false; }
    if(!repond) return false;            /* rien en face : usage hors ligne */
    if(essai === 1){                     /* le réveil peut être long : on prévient */
      PARTIE.branchee = true;
      montePastille();
    }
    await new Promise(r=>setTimeout(r, 2500));
  }
  return false;
}

/* --------------------------------------------------------- boucle d'écoute */
async function partieBoucle(){
  while(PARTIE.branchee){
    try{
      /* Le salon a pu échouer au démarrage, ou disparaître si le serveur
         redémarre : on le redemande plutôt que de rester muet. */
      if(!PARTIE.code){
        if(!await ouvrirSalon()){ await new Promise(r=>setTimeout(r, 2500)); continue; }
        PARTIE.v = -1;
        partieRafraichit();
      }
      const demande = PARTIE.code;
      const r = await fetch(avecSalon("/api/state?v="+PARTIE.v),
                            {cache:"no-store", headers:enTetes()});
      if(r.status === 401){ demandeCle(); throw new Error("code requis"); }
      if(r.status === 404){ PARTIE.code = ""; throw new Error("salon disparu"); }
      if(!r.ok) throw new Error("état indisponible");
      /* Le salon a pu changer pendant que la requête était en vol : on jette
         cette réponse plutôt que de réafficher les joueurs de l'ancien. */
      if(PARTIE.code !== demande) continue;

      const s = await r.json();
      PARTIE.echecs = 0;
      PARTIE.v = s.v;
      PARTIE.joueurs = s.players || [];
      PARTIE.reponses = s.answers || [];
      PARTIE.buzz = s.buzz || [];
      PARTIE.buzzMode = !!s.buzzMode;
      PARTIE.buzzGagnant = s.buzzWinner || null;
      PARTIE.chat = s.chat || [];
      PARTIE.questionCachee = !!s.questionHidden;

      /* Après un rechargement de page, on adopte la question déjà publiée :
         sans cela on la renverrait en double. */
      if(PARTIE.derniereQ === null && s.question){
        PARTIE.derniereQ = s.question.id;
        if(!s.question.open) PARTIE.derniereReveal = s.question.id;
      }
      await adopteJoueurs();
      partieRafraichit();
    }catch(e){
      PARTIE.echecs++;
      if(PARTIE.echecs > 2) partieRafraichit();
      await new Promise(r=>setTimeout(r, 2500));
    }
  }
}

/* ------------------------------------- chaque joueur devient une équipe */
async function adopteJoueurs(){
  if(!S.quiz) return;
  const liens = [];
  let cree = false;
  PARTIE.joueurs.forEach(j=>{
    if(j.teamId && S.quiz.teams.some(t=>t.id===j.teamId)) return;
    let t = S.quiz.teams.find(x=>x.name.trim().toLowerCase() === j.name.trim().toLowerCase());
    if(!t){
      t = newTeam(S.quiz);
      t.name = j.name.slice(0,40);
      S.quiz.teams.push(t);
      cree = true;
    }
    liens.push({userId:j.userId, teamId:t.id});
  });
  if(cree) touch();

  /* Le score fait partie de la signature : dès que tu valides, la nouvelle
     valeur repart vers le serveur, qui l'affiche aux joueurs. */
  const equipes = S.quiz.teams.map(t=>({id:t.id, name:t.name, color:t.color,
                                        score:teamScore(S.quiz, t.id)}));
  const signature = JSON.stringify(equipes);
  if(liens.length || signature !== PARTIE.signatureEquipes){
    PARTIE.signatureEquipes = signature;
    await partiePost("/api/teams", {teams: equipes, assign: liens});
  }
  if(cree && (S.view==="teams" || S.view==="scores")) render();
}

/* ------------------------------------------- ce qu'une équipe a répondu */
function reponseDe(teamId){
  if(!PARTIE.branchee) return null;
  return PARTIE.reponses.find(a=>a.teamId === teamId) || null;
}

/* Ton écran peut être partagé : tant que la réponse n'est pas révélée, on
   montre seulement qui a répondu et dans quel ordre, jamais le contenu. */
function reponseHTML(teamId){
  if(!partieActive()) return "";
  const a = reponseDe(teamId);
  if(!a) return '<div class="tanswer none">en attente…</div>';
  if(!(S.play && S.play.phase === "revealed"))
    return '<div class="tanswer sent"><b>'+a.order+'</b>a répondu</div>';
  return '<div class="tanswer got" title="'+esc(a.value)+'">'+esc(a.value)+'</div>';
}

/* ------------------------------------------------ pastille dans la barre */
function montePastille(){
  if($("#dpill")) return;
  const hote = document.querySelector(".appbar-right");
  if(!hote) return;
  const b = document.createElement("button");
  b.id = "dpill"; b.className = "dpill"; b.type = "button";
  b.title = "Salon de la partie";
  b.onclick = salonDialog;
  hote.insertBefore(b, hote.firstChild);
  partieRafraichit();
}

function partieRafraichit(){
  const pastille = $("#dpill");
  if(pastille){
    const nb = PARTIE.joueurs.length;
    let cls = "dpill", txt;
    if(!PARTIE.code){ cls += " wait"; txt = "Réveil du serveur…"; }
    else { cls += nb ? " live" : " wait"; txt = PARTIE.code + " · " + plural(nb,"joueur"); }
    pastille.className = cls;
    pastille.innerHTML = '<i></i><span>'+esc(txt)+'</span>';
  }
  const cnt = $("#dCount");
  if(cnt){
    const total = PARTIE.joueurs.length;
    cnt.textContent = PARTIE.reponses.length + " / " + total + " ont répondu";
    cnt.hidden = !total;
  }
  if(S.view === "play" && S.play){
    buzzVersConsole();
    if($("#rail2")) renderRail2();
    if(typeof renderBuzzBanner === "function") renderBuzzBanner();
    if(typeof renderChat === "function") renderChat();
    const aBouton = !!$("#tPass");
    if(aBouton !== !!(PARTIE.buzzMode && PARTIE.buzzGagnant)) viewPlay();
  }
}

/* Les buzz alimentent l'ordre affiché sur les cartes. */
function buzzVersConsole(){
  if(!PARTIE.buzz.length || !S.play) return;
  const ids = [];
  PARTIE.buzz.forEach(b=>{
    const j = PARTIE.joueurs.find(x=>x.userId===b.userId);
    if(j && j.teamId && ids.indexOf(j.teamId)<0) ids.push(j.teamId);
  });
  if(ids.length) S.play.buzzes = ids;
}

/* --------------------------------------- ce que la console pousse vers eux */
/* Le flou visible chez l'animateur doit l'être chez les joueurs, même s'il a
   été réglé après l'envoi de la question. */
function partieFlouSuit(){
  const v = S.play ? (S.play.blur || 0) : 0;
  if(v !== flouEnvoye) partieFlou(v);
}

function partieSync(){
  if(!partieActive() || S.view!=="play" || !S.play) return;
  const it = curItem();
  if(!it) return;
  const q = it.q;

  if(S.play.phase === "question" && PARTIE.derniereQ !== q.id){
    PARTIE.derniereQ = q.id; PARTIE.derniereReveal = null;
    partieEnvoi("/api/question", {
      id:q.id, index:S.play.i+1, total:flat(S.quiz).length, round:it.round.title,
      text:q.text, type:q.type, multi:!!q.multi, buzzMode:!!q.buzzMode,
      mediaHold: !!(q.media && q.media.hidden),
      questionHidden: !!(q.hideText),
      points:qPoints(q, it.round, S.quiz), timer:qTimer(q, S.quiz),
      blur: (q.media && q.media.blur) ? (flouEnvoye = S.play.blur || 0) : (flouEnvoye = 0),
      choices:q.choices.map(c=>({text:c.text}))
    }, q.media).then(r=>{
      if(!r) toast("La question n'a pas pu être envoyée aux joueurs.","bad",6000);
      const suite = flat(S.quiz)[S.play.i + 1];
      if(suite) partiePreEnvoi(suite.q);
    }).catch(()=> toast("La question n'a pas pu être envoyée aux joueurs.","bad",6000));
  }

  partieFlouSuit();

  if(S.play.phase === "revealed" && PARTIE.derniereReveal !== q.id){
    PARTIE.derniereReveal = q.id;
    const ans = q.type==="qcm"
      ? q.choices.map((c,i)=>({c:c,i:i})).filter(x=>x.c.correct).map(x=>LETTERS[x.i]+". "+x.c.text).join("   ·   ")
      : q.answer;
    partieEnvoi("/api/reveal", {answer:ans, note:q.note}, q.reveal);
  }
}

/* Les scores changent côté console, sans que le serveur en sache rien : sa
   boucle d'écoute peut attendre vingt secondes avant de repasser. On pousse
   donc explicitement après chaque validation, pour que les joueurs voient
   leur score bouger tout de suite. */
const partiePousseEquipes = ()=>{ if(partieActive()) adopteJoueurs(); };

/* Le flou change souvent quand l'animateur fait glisser le curseur : on
   n'envoie qu'un état toutes les 150 ms, le dernier faisant foi. */
let flouEnAttente = null, flouMinuteur = null, flouEnvoye = null;
function partieFlou(v){
  flouEnAttente = v;
  flouEnvoye = v;
  if(flouMinuteur) return;
  flouMinuteur = setTimeout(()=>{
    flouMinuteur = null;
    partiePost("/api/blur", {value: flouEnAttente});
  }, 150);
}

/* Pause, reprise, rallonge : l'etat du chrono part aux joueurs, sinon leur
   decompte continue de filer alors que le temps est arrete chez toi. */
function partieChrono(){
  if(!partieActive() || !S.play) return;
  partiePost("/api/chrono", { left: Math.max(0, S.play.left||0),
                              running: !!S.play.running });
}

/* Rembobiner ou mettre en pause ne sert à rien si les joueurs continuent leur
   lecture dans leur coin : on leur donne la position, et ils s'y recalent.
   Comme pour le flou, faire glisser le curseur produit une rafale d'appels :
   un seul envoi toutes les 200 ms, le dernier état faisant foi. */
let mediaEnAttente = null, mediaMinuteur = null;
function partieMediaCmd(pos, joue){
  mediaEnAttente = {pos: pos, playing: !!joue};
  if(mediaMinuteur) return;
  mediaMinuteur = setTimeout(()=>{
    mediaMinuteur = null;
    partiePost("/api/mediacmd", mediaEnAttente);
  }, 200);
}

const partieKick           = playerId => partiePost("/api/kick", {playerId: playerId});
/* Remasquer la reponse : sans ca elle reste affichee chez les joueurs et le
   salon garde « reponses closes ». */
const partieMasqueReponse = ()=>{ PARTIE.derniereReveal = null;
                                  return partiePost("/api/unreveal", {}); };
const partieBuzzReset      = ()=> partiePost("/api/buzzreset", {});
const partieMontreQuestion = cachee => partiePost("/api/showquestion", {hidden: !!cachee});
const partieChatEnvoie     = texte => partiePost("/api/chat", {text: texte});

const partieFerme      = timeup => partiePost("/api/close", {timeup: !!timeup});
const partieLanceMedia = ()=> partiePost("/api/mediastart", {});
const partieRendLaMain = ()=>{ partiePost("/api/pass", {}); toast("La main passe.","good"); };
const partieArret      = ()=> partiePost("/api/stop", {});

/* ------------------------------------------------- fenêtre du salon */
function salonDialog(){
  if(!PARTIE.code){
    toast("Le serveur n'a pas encore ouvert de salon. Réessaie dans quelques secondes.","bad",5000);
    return;
  }
  const lien = lienJoueur();
  const liste = PARTIE.joueurs.length
    ? PARTIE.joueurs.map(j=>'<div class="ledger-row"><span class="who">'+esc(j.name)+'</span>'+
        '<span class="why"></span><span></span><span></span></div>').join("")
    : '<p class="hint">Personne pour l\'instant.</p>';

  const m = modal('<h2>Salon de la partie</h2><div class="body">'+
    '<p class="hint">Tes joueurs ouvrent ce lien, entrent un pseudo, et c\'est tout. '+
    'Aucune inscription, rien à installer.</p>'+
    '<div class="field"><label>Code de la partie</label>'+
      '<div class="code-salon">'+esc(PARTIE.code)+'</div></div>'+
    '<div class="field"><label for="wLien">Lien à partager</label>'+
      '<input type="text" id="wLien" readonly value="'+esc(lien)+'"></div>'+
    '<div class="btn-row">'+
      '<button class="btn btn-gold" id="wCopy">Copier le lien</button>'+
      '<button class="btn btn-outline" id="wNew">Nouveau salon</button>'+
    '</div>'+
    '<hr class="rule">'+
    '<div class="panel-hd"><h3>Joueurs</h3><span class="pill">'+plural(PARTIE.joueurs.length,"joueur")+'</span></div>'+
    '<div class="ledger">'+liste+'</div>'+
  '</div><div class="foot"><button class="btn btn-ghost" data-x="close">Fermer</button></div>');

  m.root.querySelector('[data-x="close"]').onclick = m.close;
  m.root.querySelector("#wCopy").onclick = ()=> copyText(lien, "Lien copié — envoie-le à tes joueurs.");
  m.root.querySelector("#wNew").onclick = async ()=>{
    if(!await confirmBox("Ouvrir un nouveau salon ?",
        "Les joueurs déjà connectés seront déconnectés et devront entrer le nouveau code.",
        "Nouveau salon", true)) return;
    try{ localStorage.removeItem(SALON_CLE); }catch(e){}
    PARTIE.code = ""; PARTIE.v = -1;
    PARTIE.joueurs = []; PARTIE.reponses = []; PARTIE.buzz = [];
    PARTIE.derniereQ = null; PARTIE.derniereReveal = null; PARTIE.signatureEquipes = "";
    await ouvrirSalon();
    m.close(); partieRafraichit();
    toast("Nouveau salon : "+PARTIE.code, "good", 5000);
  };
}

partieDetecte();
