<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Régie Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   RÉGIE QUIZ — feuille de style
   Palette : indigo minuit + or de marquise + rose live + menthe
   ============================================================ */

/* --- Jetons : le monde sombre est le monde par défaut (la scène) --- */
:root{
  --bg:#0D0F22;
  --bg-2:#12152C;
  --surface:#1A1E3C;
  --surface-2:#232848;
  --surface-3:#2C3255;
  --line:#2F3560;
  --line-soft:#242949;
  --text:#F2EFE6;
  --text-2:#C2C6E2;
  --text-3:#858BB2;
  --gold:#F5B841;
  --gold-ink:#241A03;
  --gold-text:#F5B841;
  --gold-dim:rgba(245,184,65,.16);
  --rose:#FF5470;
  --rose-dim:rgba(255,84,112,.16);
  --mint:#35D6A0;
  --mint-ink:#03231A;
  --mint-dim:rgba(53,214,160,.16);
  --sky:#6FC3FF;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 10px 30px -12px rgba(0,0,0,.7);
  --shadow-3:0 24px 60px -20px rgba(0,0,0,.8);
  --ring:0 0 0 3px rgba(245,184,65,.35);
  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:26px;
  --f-display:"Antonio","Arial Narrow","Helvetica Neue Condensed",sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F2FA; --bg-2:#EAE8F5; --surface:#FFFFFF; --surface-2:#F6F5FC; --surface-3:#EDEBF7;
    --line:#D8D5EA; --line-soft:#E8E6F3;
    --text:#16183A; --text-2:#474B77; --text-3:#5F6288;
    --gold:#E9A013; --gold-ink:#2A1E05; --gold-text:#8E5D06; --gold-dim:rgba(233,160,19,.14);
    --rose:#E11D48; --rose-dim:rgba(225,29,72,.11);
    --mint:#0E9F6E; --mint-ink:#F0FFF9; --mint-dim:rgba(14,159,110,.13);
    --sky:#1D74C4;
    --shadow-1:0 1px 2px rgba(22,24,58,.08);
    --shadow-2:0 10px 30px -14px rgba(22,24,58,.28);
    --shadow-3:0 24px 60px -24px rgba(22,24,58,.34);
    --ring:0 0 0 3px rgba(233,160,19,.4);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F2FA; --bg-2:#EAE8F5; --surface:#FFFFFF; --surface-2:#F6F5FC; --surface-3:#EDEBF7;
  --line:#D8D5EA; --line-soft:#E8E6F3;
  --text:#16183A; --text-2:#474B77; --text-3:#5F6288;
  --gold:#E9A013; --gold-ink:#2A1E05; --gold-text:#8E5D06; --gold-dim:rgba(233,160,19,.14);
  --rose:#E11D48; --rose-dim:rgba(225,29,72,.11);
  --mint:#0E9F6E; --mint-ink:#F0FFF9; --mint-dim:rgba(14,159,110,.13);
  --sky:#1D74C4;
  --shadow-1:0 1px 2px rgba(22,24,58,.08);
  --shadow-2:0 10px 30px -14px rgba(22,24,58,.28);
  --shadow-3:0 24px 60px -24px rgba(22,24,58,.34);
  --ring:0 0 0 3px rgba(233,160,19,.4);
  color-scheme:light;
}

/* --- Base --- */
*{box-sizing:border-box}
/* L'attribut hidden vient de la feuille du navigateur : n'importe quelle
   regle d'auteur qui pose un display le bat. On le reaffirme ici, sinon
   un calque masque (la modale) reste au-dessus de la page et avale les clics. */
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--f-body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; line-height:1.12}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px}
::selection{background:var(--gold); color:var(--gold-ink)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

.eyebrow{
  font-family:var(--f-display); font-weight:600; font-size:.82rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--text-3);
}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display); font-weight:600; letter-spacing:.02em}

/* --- Coque --- */
.app{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
.appbar{
  display:flex; align-items:center; gap:14px; padding:10px 18px;
  background:var(--bg-2); border-bottom:1px solid var(--line-soft);
  position:sticky; top:0; z-index:40;
}
.brand{
  display:flex; align-items:center; gap:9px; background:none; border:0; padding:4px 6px;
  cursor:pointer; border-radius:var(--r-s);
}
.brand-mark{
  width:15px; height:15px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 32% 30%, #FFF0C6 0 18%, var(--gold) 42%, #B67C10 100%);
  box-shadow:0 0 0 3px var(--gold-dim), 0 0 14px rgba(245,184,65,.5);
}
.brand-name{font-family:var(--f-display); font-size:1.32rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase}
.brand-name em{font-style:normal; color:var(--gold-text)}
.tabs{display:flex; gap:2px; flex:1; overflow-x:auto; scrollbar-width:thin}
.tab{
  background:none; border:0; border-radius:var(--r-s); cursor:pointer; white-space:nowrap;
  padding:7px 13px; color:var(--text-3); font-family:var(--f-display);
  font-size:1rem; font-weight:500; letter-spacing:.09em; text-transform:uppercase;
  transition:color .15s, background .15s;
}
.tab:hover{color:var(--text-2); background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--text); background:var(--surface)}
.tab[aria-selected="true"] .dot{background:var(--gold)}
.tab .dot{
  display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:7px;
  background:var(--line); vertical-align:middle;
}
.tab:disabled{opacity:.35; cursor:not-allowed}
.appbar-right{display:flex; align-items:center; gap:8px}
.save-state{
  font-family:var(--f-mono); font-size:.72rem; color:var(--text-3);
  letter-spacing:.03em; white-space:nowrap; transition:color .3s;
}
.save-state.on{color:var(--mint)}

/* --- Frise d'ampoules de marquise --- */
.marquee{
  height:9px; flex:none; background-color:var(--bg-2);
  background-image:radial-gradient(circle at 7px 4.5px, var(--gold) 0 2.2px, transparent 2.5px);
  background-size:16px 9px; background-repeat:repeat-x;
  opacity:.3; border-bottom:1px solid var(--line-soft);
  transition:opacity .3s;
}
.marquee.live{opacity:.9; animation:chase 1.1s linear infinite; filter:drop-shadow(0 0 5px rgba(245,184,65,.55))}
@keyframes chase{from{background-position:0 0} to{background-position:48px 0}}

main{flex:1; min-height:0; display:flex; flex-direction:column}
.wrap{width:100%; max-width:1180px; margin:0 auto; padding:28px 20px 72px}
.wrap.narrow{max-width:860px}

/* --- Boutons --- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:9px 16px; border-radius:var(--r-m); cursor:pointer;
  border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  font-weight:600; font-size:.92rem; line-height:1.2; white-space:nowrap;
  transition:transform .1s ease, background .15s, border-color .15s, filter .15s;
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none}
.btn-gold{background:var(--gold); color:var(--gold-ink); border-color:transparent; box-shadow:0 6px 18px -9px rgba(245,184,65,.8)}
.btn-gold:hover{background:var(--gold); filter:brightness(1.08)}
.btn-mint{background:var(--mint); color:var(--mint-ink); border-color:transparent}
.btn-mint:hover{background:var(--mint); filter:brightness(1.08)}
.btn-rose{background:var(--rose); color:#FFF6F8; border-color:transparent}
.btn-rose:hover{background:var(--rose); filter:brightness(1.08)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2); color:var(--text)}
.btn-outline{background:transparent}
.btn-outline:hover{background:var(--surface-2)}
.btn-danger{color:var(--rose); border-color:var(--line); background:transparent}
.btn-danger:hover{background:var(--rose-dim); border-color:var(--rose)}
.btn-lg{padding:13px 24px; font-size:1.02rem; border-radius:var(--r-l)}
.btn-sm{padding:5px 10px; font-size:.82rem; border-radius:var(--r-s)}
.icon-btn{
  width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-s); border:1px solid transparent; background:transparent;
  color:var(--text-3); cursor:pointer; font-size:1rem; flex:none;
  transition:background .15s, color .15s;
}
.icon-btn:hover{background:var(--surface-2); color:var(--text)}
.icon-btn.danger:hover{background:var(--rose-dim); color:var(--rose)}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

/* --- Formulaires --- */
.field{display:flex; flex-direction:column; gap:6px}
.field > label, .lbl{
  font-family:var(--f-display); font-size:.82rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; color:var(--text-3);
}
input[type=text],input[type=number],input[type=url],input[type=search],textarea,select{
  width:100%; padding:10px 12px; border-radius:var(--r-m);
  border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  transition:border-color .15s, box-shadow .15s;
}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--gold); box-shadow:var(--ring)}
input::placeholder,textarea::placeholder{color:var(--text-3); opacity:.75}
textarea{resize:vertical; min-height:78px; line-height:1.5}
select{appearance:none; cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px}
input[type=range]{width:100%; accent-color:var(--gold)}
input[type=color]{width:40px; height:36px; padding:2px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--surface-2); cursor:pointer}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
@media (max-width:700px){.grid-2,.grid-3{grid-template-columns:1fr}}

.switch{display:inline-flex; align-items:center; gap:10px; cursor:pointer; user-select:none}
.switch input{position:absolute; opacity:0; width:0; height:0}
.switch .track{
  width:38px; height:22px; border-radius:11px; background:var(--surface-3);
  border:1px solid var(--line); position:relative; transition:background .18s, border-color .18s; flex:none;
}
.switch .track::after{
  content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
  background:var(--text-3); transition:transform .18s, background .18s;
}
.switch input:checked + .track{background:var(--gold-dim); border-color:var(--gold)}
.switch input:checked + .track::after{transform:translateX(16px); background:var(--gold)}
.switch input:focus-visible + .track{box-shadow:var(--ring)}
.switch .txt{font-size:.9rem; color:var(--text-2)}

/* --- Blocs --- */
.card{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-l); box-shadow:var(--shadow-1)}
.panel{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-l); padding:20px}
.panel + .panel{margin-top:16px}
.panel-hd{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
.panel-hd h3{font-family:var(--f-display); font-size:1.16rem; letter-spacing:.06em; text-transform:uppercase; font-weight:600}
.hint{font-size:.84rem; color:var(--text-3); line-height:1.45}
.rule{height:1px; background:var(--line-soft); border:0; margin:16px 0}
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
  font-family:var(--f-display); font-size:.78rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  background:var(--surface-2); color:var(--text-3); border:1px solid var(--line-soft);
}
.pill.gold{background:var(--gold-dim); color:var(--gold-text); border-color:transparent}
.pill.mint{background:var(--mint-dim); color:var(--mint); border-color:transparent}
.pill.rose{background:var(--rose-dim); color:var(--rose); border-color:transparent}
.empty{
  text-align:center; padding:56px 24px; color:var(--text-3);
  border:1px dashed var(--line); border-radius:var(--r-l); background:var(--surface);
}
.empty h3{font-family:var(--f-display); font-size:1.5rem; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2); margin-bottom:8px}
.empty p{max-width:46ch; margin:0 auto 18px}
</style>
<style>
/* ============================================================
   BIBLIOTHÈQUE
   ============================================================ */
.page-hd{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:24px}
.page-hd h1{font-family:var(--f-display); font-size:clamp(2rem,5vw,3rem); font-weight:700; letter-spacing:.02em; text-transform:uppercase}
.page-hd .sub{color:var(--text-3); margin-top:6px; max-width:56ch}

.quiz-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:16px}
.quiz-card{
  display:flex; flex-direction:column; gap:12px; padding:18px; text-align:left;
  background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-l);
  cursor:pointer; transition:transform .14s ease, border-color .14s, box-shadow .14s;
  position:relative; overflow:hidden;
}
.quiz-card::before{
  content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--gold);
  opacity:0; transition:opacity .14s;
}
.quiz-card:hover{transform:translateY(-2px); border-color:var(--line); box-shadow:var(--shadow-2)}
.quiz-card:hover::before{opacity:1}
.quiz-card h3{font-size:1.16rem; font-weight:700; line-height:1.25}
.quiz-card .meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto}
.quiz-card .row-actions{display:flex; gap:2px; position:absolute; top:12px; right:10px; opacity:0; transition:opacity .14s}
.quiz-card:hover .row-actions,.quiz-card:focus-within .row-actions{opacity:1}
.quiz-card .desc{color:var(--text-3); font-size:.88rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

/* ============================================================
   ÉDITEUR
   ============================================================ */
.editor{display:grid; grid-template-columns:330px minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:960px){.editor{grid-template-columns:1fr}}

.rail{
  background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-l);
  padding:12px; position:sticky; top:76px; max-height:calc(100vh - 100px); overflow:auto;
  display:flex; flex-direction:column; gap:10px;
}
/* Sans ça, les manches sont comprimées pour tenir dans la hauteur du rail :
   les questions du bas sont rognées, et plus rien n'est cliquable au-delà. */
.rail > .round, .rail > .rail-foot{flex:none}
@media (max-width:960px){.rail{position:static; max-height:none}}
.round{border:1px solid var(--line-soft); border-radius:var(--r-m); background:var(--surface-2); overflow:hidden}
.round-hd{display:flex; align-items:center; gap:6px; padding:8px 8px 8px 12px; background:var(--surface-3)}
.round-hd input{
  flex:1; background:transparent; border:1px solid transparent; padding:3px 6px; border-radius:6px;
  font-family:var(--f-display); font-size:1rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
}
.round-hd input:hover{border-color:var(--line)}
.round-hd input:focus{background:var(--surface); border-color:var(--gold)}
.round-coef{
  width:56px !important; flex:none !important; font-family:var(--f-mono) !important; font-size:.78rem !important;
  text-transform:none !important; letter-spacing:0 !important; text-align:center;
}
.qlist{list-style:none; margin:0; padding:6px; display:flex; flex-direction:column; gap:4px; min-height:12px}
.qrow{
  display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:var(--r-s);
  background:var(--surface); border:1px solid transparent; cursor:pointer; text-align:left; width:100%;
  transition:background .13s, border-color .13s;
}
.qrow:hover{border-color:var(--line)}
.qrow.sel{border-color:var(--gold); background:var(--gold-dim)}
.qrow.drag-over{border-color:var(--sky); border-style:dashed}
.qrow.dragging{opacity:.4}
.qrow .idx{
  font-family:var(--f-display); font-size:.95rem; font-weight:600; color:var(--text-3);
  min-width:20px; text-align:right; flex:none; font-variant-numeric:tabular-nums;
}
.qrow.sel .idx{color:var(--gold-text)}
.qrow .ttl{flex:1; min-width:0; font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.qrow .ttl.none{color:var(--text-3); font-style:italic}
.qrow .kind{font-size:.95rem; flex:none; opacity:.85}
.qrow .pts{font-family:var(--f-mono); font-size:.74rem; color:var(--text-3); flex:none}
.qrow.sel .pts{color:var(--gold-text)}
.rail-foot{display:flex; gap:8px; padding-top:2px}
.rail-foot .btn{flex:1}

.qeditor{display:flex; flex-direction:column; gap:16px; min-width:0}
.qeditor-hd{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.qeditor-hd .eyebrow{font-size:.9rem}
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-m); padding:3px; gap:3px}
.seg button{
  border:0; background:transparent; color:var(--text-3); cursor:pointer; border-radius:9px;
  padding:6px 13px; font-size:.86rem; font-weight:600; transition:background .14s, color .14s;
}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--gold); color:var(--gold-ink)}
.seg.subtle button[aria-pressed="true"]{background:var(--surface-3); color:var(--text)}

.choice{display:flex; align-items:center; gap:10px}
.choice-letter{
  width:32px; height:32px; flex:none; display:grid; place-items:center; border-radius:var(--r-s);
  background:var(--surface-2); border:1px solid var(--line); font-family:var(--f-display);
  font-weight:700; font-size:1rem; color:var(--text-3);
}
.choice.ok .choice-letter{background:var(--mint); color:var(--mint-ink); border-color:transparent}
.choice-mark{
  width:34px; height:34px; flex:none; border-radius:var(--r-s); cursor:pointer; font-size:.95rem;
  border:1px solid var(--line); background:var(--surface-2); color:var(--text-3);
  display:grid; place-items:center; transition:background .14s, color .14s;
}
.choice-mark[aria-pressed="true"]{background:var(--mint-dim); color:var(--mint); border-color:var(--mint)}
.choices-edit{display:flex; flex-direction:column; gap:8px}

/* Média */
.media-box{
  border:1px dashed var(--line); border-radius:var(--r-m); padding:14px;
  background:var(--surface-2); display:flex; flex-direction:column; gap:12px;
}
.media-box.filled{border-style:solid; background:var(--surface-2)}
.media-drop{
  border-radius:var(--r-s); padding:22px 14px; text-align:center; color:var(--text-3);
  font-size:.88rem; cursor:pointer; transition:background .14s, color .14s;
}
.media-drop:hover{background:var(--surface-3); color:var(--text-2)}
.media-drop.over{background:var(--gold-dim); color:var(--gold-text)}
.media-prev{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.media-prev img,.media-prev video{max-height:110px; max-width:190px; border-radius:var(--r-s); background:#000}
.media-name{font-size:.85rem; color:var(--text-2); word-break:break-all; flex:1; min-width:140px}
.media-name small{display:block; color:var(--text-3); font-family:var(--f-mono); font-size:.72rem}
.kind-tabs{display:flex; gap:6px; flex-wrap:wrap}
.kind-tab{
  padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
  color:var(--text-3); cursor:pointer; font-size:.84rem; font-weight:600; transition:all .14s;
}
.kind-tab[aria-pressed="true"]{background:var(--gold-dim); color:var(--gold-text); border-color:var(--gold)}

/* ============================================================
   ÉQUIPES
   ============================================================ */
.team-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.team-edit{

<script>
"use strict";

/* ============================================================
   1. OUTILS
   ============================================================ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.prototype.slice.call((r||document).querySelectorAll(s));
const uid = p => (p||"id")+"_"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (n,a,b)=> Math.min(b,Math.max(a,n));
const LETTERS = "ABCDEFGHIJ";
const fmtClock = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const fmtSize  = b => b>=1048576 ? (b/1048576).toFixed(1)+" Mo" : Math.max(1,Math.round(b/1024))+" Ko";
const fmtDate  = t => new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});
const plural   = (n,s,p)=> n+" "+(n>1?(p||s+"s"):s);
const nb = (v,d)=> (v===null||v===undefined||v==="") ? d : Number(v);

/* ============================================================
   2. STOCKAGE — IndexedDB, avec repli localStorage
   ============================================================ */
const DB = { name:"regie-quiz", ver:1, db:null, assetsOK:true };
const LS_KEY = "regie-quiz:quizzes";
const memAssets = new Map();
const urlCache  = new Map();

function req2p(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function store(name,mode){ return DB.db.transaction(name,mode).objectStore(name); }

function openDB(){
  return new Promise(res=>{
    let r;
    try{ r = indexedDB.open(DB.name, DB.ver); }
    catch(e){ DB.assetsOK=false; return res(null); }
    const bail = ()=>{ DB.db=null; DB.assetsOK=false; res(null); };
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains("quizzes")) d.createObjectStore("quizzes",{keyPath:"id"});
      if(!d.objectStoreNames.contains("assets"))  d.createObjectStore("assets",{keyPath:"id"});
    };
    r.onsuccess = e => { DB.db = e.target.result; res(DB.db); };
    r.onerror = bail; r.onblocked = bail;
    setTimeout(()=>{ if(!DB.db) bail(); }, 2500);
  });
}

async function allQuizzes(){
  if(DB.db){ try{ return await req2p(store("quizzes","readonly").getAll()); }catch(e){} }
  try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch(e){ return []; }
}
async function saveQuiz(q){
  q.updatedAt = Date.now();
  if(DB.db){ try{ await req2p(store("quizzes","readwrite").put(JSON.parse(JSON.stringify(q)))); return; }catch(e){} }
  const all = await allQuizzes();
  const i = all.findIndex(x=>x.id===q.id);
  if(i<0) all.push(q); else all[i]=q;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(all)); }
  catch(e){ toast("Mémoire du navigateur pleine — exporte ton quiz pour ne rien perdre.","bad",6000); }
}
async function dropQuiz(id){
  if(DB.db){ try{ await req2p(store("quizzes","readwrite").delete(id)); }catch(e){} }
  const all = (await allQuizzes()).filter(x=>x.id!==id);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(all)); }catch(e){}
}
async function putAsset(file){
  const rec = { id:uid("as"), name:file.name||"média", type:file.type||"", size:file.size||0, blob:file };
  if(DB.db){ try{ await req2p(store("assets","readwrite").put(rec)); return rec; }catch(e){} }
  DB.assetsOK = false; memAssets.set(rec.id, rec);
  return rec;
}
async function getAsset(id){
  if(memAssets.has(id)) return memAssets.get(id);
  if(DB.db){ try{ return await req2p(store("assets","readonly").get(id)); }catch(e){} }
  return null;
}
async function assetURL(id){
  if(!id) return null;
  if(urlCache.has(id)) return urlCache.get(id);
  const a = await getAsset(id);
  if(!a || !a.blob) return null;
  const u = URL.createObjectURL(a.blob);
  urlCache.set(id,u);
  return u;
}

/* ============================================================
   3. MODÈLE
   ============================================================ */
const PALETTE = ["#F5B841","#FF5470","#35D6A0","#6FC3FF","#B98CFF","#FF9F45","#7DD3FC","#F472B6","#A3E635","#FCA5A5"];

const newChoice   = t => ({ id:uid("c"), text:t||"", correct:false });
const newMedia    = () => ({ kind:"none", assetId:null, url:"", name:"", size:0, start:0, stop:0, blur:0, hidden:false });
function newQuestion(o){
  return Object.assign({
    id:uid("q"), type:"free", text:"", answer:"", note:"",
    points:null, timer:null, multi:false, buzzMode:false,
    choices:[newChoice(),newChoice(),newChoice(),newChoice()],
    media:newMedia(), reveal:newMedia()
  }, o||{});
}
const newRound = t => ({ id:uid("r"), title:t||"Manche 1", coef:1, questions:[newQuestion()] });
function newQuiz(){
  return {
    id:uid("qz"), title:"Nouveau quiz", desc:"", createdAt:Date.now(), updatedAt:Date.now(),
    settings:{ defaultPoints:1, defaultTimer:30, autoStart:true, beep:true, buzzer:true, peek:true, mediasJoueurs:true, speedBonus:0 },
    rounds:[newRound()], teams:[], log:[], version:1
  };
}
function newTeam(quiz){
  const n = quiz.teams.length;
  return { id:uid("t"), name:"Équipe "+(n+1), color:PALETTE[n%PALETTE.length] };
}

/* Migration douce : tout quiz importé ou ancien reçoit les champs manquants. */
function normalize(q){
  q.settings = Object.assign({defaultPoints:1,defaultTimer:30,autoStart:true,beep:true,buzzer:true,peek:true,mediasJoueurs:true,speedBonus:0}, q.settings||{});
  /* Ancien nom du réglage, du temps où les médias partaient dans Discord. */
  if(q.settings.discordMedia !== undefined && q.settings.mediasJoueurs === undefined)
    q.settings.mediasJoueurs = q.settings.discordMedia;
  delete q.settings.discordMedia;
  q.teams = q.teams||[]; q.log = q.log||[]; q.rounds = q.rounds && q.rounds.length ? q.rounds : [newRound()];
  q.rounds.forEach(r=>{
    r.id=r.id||uid("r"); r.coef=nb(r.coef,1); r.questions=r.questions||[];
    r.questions.forEach(qq=>{
      qq.id=qq.id||uid("q");
      qq.media = Object.assign(newMedia(), qq.media||{});
      qq.reveal = Object.assign(newMedia(), qq.reveal||{});
      qq.choices = (qq.choices||[]).map(c=>Object.assign(newChoice(),c));
      if(!qq.choices.length) qq.choices=[newChoice(),newChoice()];
      if(qq.points==="") qq.points=null;
      if(qq.timer==="") qq.timer=null;
      qq.buzzMode = !!qq.buzzMode;
    });
  });
  q.teams.forEach((t,i)=>{ t.id=t.id||uid("t"); t.color=t.color||PALETTE[i%PALETTE.length]; });
  return q;
}

const flat = q => { const o=[]; q.rounds.forEach((r,ri)=>r.questions.forEach((qq,qi)=>o.push({round:r,ri:ri,q:qq,qi:qi}))); return o; };
const qPoints = (qq,round,quiz)=> nb(qq.points, quiz.settings.defaultPoints) * nb(round&&round.coef,1);
const qTimer  = (qq,quiz)=> nb(qq.timer, quiz.settings.defaultTimer);
const teamScore = (quiz,tid)=> quiz.log.reduce((s,e)=> e.teamId===tid ? s+e.delta : s, 0);
const shortLabel = qq => (qq.text||"").trim().replace(/\s+/g," ").slice(0,60);

/* ============================================================
   4. ÉTAT + COQUE
   ============================================================ */
const S = { view:"library", list:[], quiz:null, selQ:null, play:null };
/* Remplace a la construction. Sert a verifier d'un coup d'oeil qu'un onglet
   ouvert de longue date n'est pas reste sur une ancienne version. */
const VERSION = "03/09/2026 à 00:07";
const MAIN = $("#main"), MARQ = $("#marquee");

const VIEWS = [
  {id:"library", label:"Bibliothèque"},
  {id:"editor",  label:"Questions", need:1},
  {id:"teams",   label:"Équipes",   need:1},
  {id:"play",    label:"Animer",    need:1},
  {id:"scores",  label:"Scores",    need:1}
];

function renderTabs(){
  $("#tabs").innerHTML = VIEWS.map(v=>
    '<button class="tab" role="tab" data-v="'+v.id+'" aria-selected="'+(S.view===v.id)+'"'+
    (v.need && !S.quiz ? " disabled" : "")+'><span class="dot"></span>'+v.label+'</button>'
  ).join("");
}
function setView(v){
  if(S.view==="play" && v!=="play") stopTimer(true);
  S.view = v;
  if(v === "library") refreshList().then(render);
  else render();
}
function render(){
  renderTabs();
  stopMedia();
  if(S.view==="library") viewLibrary();
  else if(!S.quiz) { S.view="library"; renderTabs(); viewLibrary(); }
  else if(S.view==="editor") viewEditor();
  else if(S.view==="teams")  viewTeams();
  else if(S.view==="play")   viewPlay();
  else if(S.view==="scores") viewScores();
  MARQ.classList.toggle("live", S.view==="play" && !!(S.play && S.play.running));
}

/* Sauvegarde différée */
let saveT=null;
function touch(){
  if(!S.quiz) return;
  const st = $("#saveState");
  st.textContent = "…"; st.classList.remove("on");
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    await saveQuiz(S.quiz);
    st.textContent = "Enregistré"; st.classList.add("on");
    setTimeout(()=>{ if(st.textContent==="Enregistré"){ st.textContent=""; st.classList.remove("on"); } }, 2200);
  }, 350);
}

/* Toasts */
function toast(msg, kind, ms){
  const d = document.createElement("div");
  d.className = "toast"+(kind?" "+kind:"");
  d.textContent = msg;
  $("#toasts").appendChild(d);
  setTimeout(()=>{ d.style.opacity="0"; d.style.transition="opacity .3s"; setTimeout(()=>d.remove(),320); }, ms||2600);
}

/* Modale générique */
function modal(html, opts){
  opts = opts||{};
  const layer = $("#modalLayer");
  layer.hidden = false;
  layer.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  const close = ()=>{ layer.hidden=true; layer.innerHTML=""; document.removeEventListener("keydown",onKey); };
  function onKey(e){ if(e.key==="Escape"){ e.stopPropagation(); close(); if(opts.onCancel) opts.onCancel(); } }
  document.addEventListener("keydown", onKey);
  layer.onclick = e => { if(e.target===layer){ close(); if(opts.onCancel) opts.onCancel(); } };
  const f = layer.querySelector("input,textarea,button");
  if(f && opts.focus!==false) setTimeout(()=>f.focus(),30);
  return { root: layer.firstElementChild, close: close };
}
function confirmBox(title, msg, okLabel, danger){
  return new Promise(res=>{
    const m = modal('<h2>'+esc(title)+'</h2><div class="body"><p>'+msg+'</p></div>'+
      '<div class="foot"><button class="btn btn-ghost" data-x="no">Annuler</button>'+
      '<button class="btn '+(danger?"btn-rose":"btn-gold")+'" data-x="yes">'+esc(okLabel||"Confirmer")+'</button></div>',
      {onCancel:()=>res(false), focus:false});
    m.root.querySelector('[data-x="no"]').onclick = ()=>{ m.close(); res(false); };
    m.root.querySelector('[data-x="yes"]').onclick = ()=>{ m.close(); res(true); };
    setTimeout(()=>m.root.querySelector('[data-x="yes"]').focus(),30);
  });
}

/* ============================================================
   5. BIBLIOTHÈQUE
   ============================================================ */
async function refreshList(){
  S.list = (await allQuizzes()).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
}
function viewLibrary(){
  const cards = S.list.map(q=>{
    const n = (q.rounds||[]).reduce((s,r)=>s+(r.questions||[]).length,0);
    return '<div class="quiz-card" tabindex="0" role="button" data-open="'+q.id+'">'+
      '<div class="row-actions">'+
        '<button class="icon-btn" data-dup="'+q.id+'" title="Dupliquer">⧉</button>'+
        '<button class="icon-btn danger" data-del="'+q.id+'" title="Supprimer">✕</button>'+
      '</div>'+
      '<h3>'+esc(q.title||"Sans titre")+'</h3>'+
      (q.desc ? '<p class="desc">'+esc(q.desc)+'</p>' : '')+
      '<div class="meta">'+
        '<span class="pill gold">'+plural(n,"question")+'</span>'+
        '<span class="pill">'+plural((q.rounds||[]).length,"manche")+'</span>'+
        '<span class="pill">'+plural((q.teams||[]).length,"équipe")+'</span>'+
      '</div>'+
      '<div class="hint">Modifié le '+fmtDate(q.updatedAt||q.createdAt||Date.now())+'</div>'+
    '</div>';
  }).join("");

  const rep = (typeof litReprise === "function") ? litReprise() : null;

  MAIN.innerHTML =
  '<div class="wrap">'+
    (rep
      ? '<div class="panel reprise" style="margin-bottom:18px;border-color:var(--gold)">'+
          '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'+
            '<div style="flex:1;min-width:200px">'+
              '<div class="eyebrow" style="color:var(--gold)">Partie interrompue</div>'+
              '<strong>'+esc(rep.titre||"Quiz")+'</strong>'+
              '<span class="hint"> — tu en étais à la question '+((rep.i||0)+1)+'.</span>'+
            '</div>'+
            '<div class="btn-row">'+
              '<button class="btn btn-gold" id="btnReprise">Reprendre</button>'+
              '<button class="btn btn-ghost" id="btnOublie">Ignorer</button>'+
            '</div>'+
          '</div>'+
        '</div>'
      : "")+
    '<div class="page-hd">'+
      '<div><div class="eyebrow">Régie</div><h1>Bibliothèque</h1>'+
      '<p class="sub">Chaque quiz garde ses questions, ses médias, ses équipes et tout l\'historique des points.</p></div>'+
      '<div class="btn-row">'+
        '<button class="btn btn-outline" id="btnImport">Importer</button>'+
        '<button class="btn btn-outline" id="btnDemo">Quiz de démo</button>'+
        '<button class="btn btn-gold" id="btnNew">Nouveau quiz</button>'+
      '</div>'+
    '</div>'+
    (S.list.length
      ? '<div class="quiz-grid">'+cards+'</div>'
      : '<div class="empty"><h3>La salle est vide</h3><p>Crée ton premier quiz, ou charge le quiz de démo pour voir tout de suite à quoi ressemble une soirée.</p>'+
        '<div class="btn-row" style="justify-content:center"><button class="btn btn-gold btn-lg" id="btnNew2">Créer un quiz</button>'+
        '<button class="btn btn-outline btn-lg" id="btnDemo2">Charger la démo</button></div></div>')+
    (DB.assetsOK ? "" :
      '<div class="panel" style="margin-top:22px;border-color:var(--rose)"><div class="hint">'+
      '<strong style="color:var(--rose)">Stockage des médias limité.</strong> Ce navigateur bloque la base locale '+
      '(fréquent quand la page est ouverte en <code>file://</code>). Les musiques, images et vidéos que tu ajoutes '+
      'ne survivront pas à un rechargement. Ouvre la version en ligne, ou sers le fichier via un petit serveur local.'+
      '</div></div>')+
  '</div>';

  const nw = ()=> createQuiz();
  if($("#btnNew"))  $("#btnNew").onclick  = nw;
  if($("#btnNew2")) $("#btnNew2").onclick = nw;
  if($("#btnDemo")) $("#btnDemo").onclick = loadDemo;
  if($("#btnDemo2"))$("#btnDemo2").onclick= loadDemo;
  $("#btnImport") && ($("#btnImport").onclick = importDialog);
  if($("#btnReprise")) $("#btnReprise").onclick = reprendrePartie;
  if($("#btnOublie"))  $("#btnOublie").onclick  = ()=>{ oublieReprise(); render(); };

  $$(".quiz-card").forEach(c=>{
    c.onclick = e => { if(e.target.closest("[data-dup],[data-del]")) return; openQuiz(c.dataset.open); };
    c.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openQuiz(c.dataset.open); } };
  });
  $$("[data-dup]").forEach(b=> b.onclick = async ()=>{
    const src = S.list.find(x=>x.id===b.dataset.dup);
    const copy = normalize(JSON.parse(JSON.stringify(src)));
    copy.id = uid("qz"); copy.title = src.title+" (copie)"; copy.log = []; copy.createdAt = Date.now();
    copy.rounds.forEach(r=>{ r.id=uid("r"); r.questions.forEach(q=>{ q.id=uid("q"); q.choices.forEach(c=>c.id=uid("c")); }); });
    copy.teams.forEach(t=>t.id=uid("t"));
    await saveQuiz(copy); await refreshList(); render(); toast("Quiz dupliqué.","good");
  });
  $$("[data-del]").forEach(b=> b.onclick = async ()=>{
    const src = S.list.find(x=>x.id===b.dataset.del);
    if(!await confirmBox("Supprimer ce quiz ?", "<strong>"+esc(src.title)+"</strong> et son historique de points seront effacés. Cette action est définitive.","Supprimer",true)) return;
    await dropQuiz(b.dataset.del); await refreshList(); render(); toast("Quiz supprimé.");
  });
}
async function createQuiz(){
  const q = newQuiz();
  await saveQuiz(q); await refreshList();
  S.quiz = q; S.selQ = q.rounds[0].questions[0].id; setView("editor");
}
async function openQuiz(id){
  /* Si le quiz est déjà ouvert, on garde l'objet en mémoire : il est plus frais que la copie stockée. */
  if(S.quiz && S.quiz.id === id) return setView("editor");
  const q = S.list.find(x=>x.id===id);
  if(!q) return;
  S.quiz = normalize(q);
  const f = flat(S.quiz);
  S.selQ = f.length ? f[0].q.id : null;
  S.play = null;
  setView("editor");
}

/* ============================================================
   6. ÉDITEUR — rail des manches + fiche question
   ============================================================ */
function viewEditor(){
  const quiz = S.quiz;
  MAIN.innerHTML =
  '<div class="wrap">'+
    '<div class="page-hd">'+
      '<div style="flex:1;min-width:260px">'+
        '<div class="eyebrow">Quiz</div>'+
        '<input type="text" id="qzTitle" value="'+esc(quiz.title)+'" '+
          'style="font-family:var(--f-display);font-size:2rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;'+
          'background:transparent;border-color:transparent;padding:2px 6px;margin-left:-6px">'+
        '<input type="text" id="qzDesc" value="'+esc(quiz.desc||"")+'" placeholder="Sous-titre ou note interne (facultatif)" '+
          'style="background:transparent;border-color:transparent;padding:2px 6px;margin-left:-6px;color:var(--text-3)">'+
      '</div>'+
      '<div class="btn-row">'+
        '<button class="btn btn-ghost" id="btnSettings">Réglages</button>'+
        '<button class="btn btn-ghost" id="btnPrint">Imprimer</button>'+
        '<button class="btn btn-outline" id="btnExport">Exporter</button>'+
        '<button class="btn btn-gold" id="btnGoPlay">Animer →</button>'+
      '</div>'+
    '</div>'+
    '<div class="editor"><div class="rail" id="rail"></div><div class="qeditor" id="qform"></div></div>'+
  '</div>';

  $("#qzTitle").oninput = e => { quiz.title = e.target.value; touch(); };
  $("#qzDesc").oninput  = e => { quiz.desc  = e.target.value; touch(); };
  $("#btnSettings").onclick = settingsDialog;
  $("#btnPrint").onclick    = printDialog;
  $("#btnExport").onclick   = exportDialog;
  $("#btnGoPlay").onclick   = ()=> setView("play");

  renderRail(); renderQForm();
}

function renderRail(){
  const quiz = S.quiz;
  let n = 0;
  const html = quiz.rounds.map((r,ri)=>{
    const rows = r.questions.map(qq=>{
      n++;
      const icons = {none:"·", image:"🖼", audio:"♪", video:"▶"};
      const pts = qPoints(qq,r,quiz);
      return '<li><button class="qrow'+(S.selQ===qq.id?" sel":"")+'" data-q="'+qq.id+'" draggable="true">'+
        '<span class="idx">'+n+'</span>'+
        '<span class="kind" title="'+(qq.type==="qcm"?"QCM":"Réponse libre")+'">'+(icons[qq.media.kind]||"·")+'</span>'+
        '<span class="ttl'+(shortLabel(qq)?"":" none")+'" data-ttl="'+qq.id+'">'+esc(shortLabel(qq)||"Question vide")+'</span>'+
        '<span class="pts">'+pts+" pt"+(pts>1?"s":"")+'</span>'+
      '</button></li>';
    }).join("");
    return '<div class="round" data-r="'+r.id+'">'+
      '<div class="round-hd">'+
        '<input type="text" value="'+esc(r.title)+'" data-rt="'+r.id+'" aria-label="Nom de la manche">'+
        '<input type="number" class="round-coef" value="'+r.coef+'" min="0" max="10" step="0.5" data-rc="'+r.id+'" title="Coefficient : multiplie les points de la manche" aria-label="Coefficient">'+
        (quiz.rounds.length>1 ? '<button class="icon-btn danger" data-rd="'+r.id+'" title="Supprimer la manche">✕</button>' : "")+
      '</div>'+
      '<ul class="qlist" data-list="'+r.id+'">'+rows+'</ul>'+
      '<div style="padding:0 8px 8px"><button class="btn btn-sm btn-ghost" data-add="'+r.id+'" style="width:100%">+ Question</button></div>'+
    '</div>';
  }).join("");

  $("#rail").innerHTML = html +
    '<div class="rail-foot"><button class="btn btn-sm btn-outline" id="addRound">+ Manche</button></div>';

  $$("[data-q]").forEach(b=>{
    b.onclick = ()=>{ S.selQ = b.dataset.q; renderRail(); renderQForm(); };
    b.ondragstart = e => { e.dataTransfer.setData("text/plain", b.dataset.q); e.dataTransfer.effectAllowed="move"; b.classList.add("dragging"); };
    b.ondragend   = ()=> b.classList.remove("dragging");
    b.ondragover  = e => { e.preventDefault(); b.classList.add("drag-over"); };
    b.ondragleave = ()=> b.classList.remove("drag-over");
    b.ondrop = e => { e.preventDefault(); b.classList.remove("drag-over"); moveQuestion(e.dataTransfer.getData("text/plain"), b.dataset.q); };
  });
  $$("[data-list]").forEach(ul=>{
    ul.ondragover = e => e.preventDefault();
    ul.ondrop = e => {
      if(e.target.closest(".qrow")) return;
      e.preventDefault();
      moveQuestionToRound(e.dataTransfer.getData("text/plain"), ul.dataset.list);
    };
  });
  $$("[data-rt]").forEach(i=> i.oninput = e => { findRound(i.dataset.rt).title = e.target.value; touch(); });
  $$("[data-rc]").forEach(i=> i.onchange = e => { findRound(i.dataset.rc).coef = clamp(nb(e.target.value,1),0,10); touch(); renderRail(); renderQForm(); });
  $$("[data-add]").forEach(b=> b.onclick = ()=>{
    const r = findRound(b.dataset.add), q = newQuestion();
    r.questions.push(q); S.selQ = q.id; touch(); renderRail(); renderQForm();
    const f = $("#fText"); if(f) f.focus();
  });
  $$("[data-rd]").forEach(b=> b.onclick = async ()=>{
    const r = findRound(b.dataset.rd);
    if(r.questions.length && !await confirmBox("Supprimer la manche ?", "<strong>"+esc(r.title)+"</strong> et ses "+plural(r.questions.length,"question")+" seront supprimées.","Supprimer",true)) return;
    S.quiz.rounds = S.quiz.rounds.filter(x=>x.id!==r.id);
    if(!S.quiz.rounds.length) S.quiz.rounds=[newRound()];
    const f = flat(S.quiz); S.selQ = f.length?f[0].q.id:null;
    touch(); renderRail(); renderQForm();
  });
  $("#addRound").onclick = ()=>{
    const r = newRound("Manche "+(S.quiz.rounds.length+1));
    S.quiz.rounds.push(r); S.selQ = r.questions[0].id; touch(); renderRail(); renderQForm();
  };
}
const findRound = id => S.quiz.rounds.find(r=>r.id===id);
function findQ(id){
  for(const r of S.quiz.rounds){ const i=r.questions.findIndex(q=>q.id===id); if(i>=0) return {round:r,q:r.questions[i],i:i}; }
  return null;
}
function moveQuestion(srcId, dstId){
  if(!srcId||srcId===dstId) return;
  const a = findQ(srcId), b = findQ(dstId);
  if(!a||!b) return;
  a.round.questions.splice(a.i,1);
  const bi = b.round.questions.findIndex(q=>q.id===dstId);
  b.round.questions.splice(bi,0,a.q);
  touch(); renderRail();
}
function moveQuestionToRound(srcId, roundId){
  const a = findQ(srcId), r = findRound(roundId);
  if(!a||!r||a.round===r) return;
  a.round.questions.splice(a.i,1); r.questions.push(a.q);
  touch(); renderRail();
}
function nudge(dir){
  const a = findQ(S.selQ); if(!a) return;
  const list = a.round.questions, i = a.i, j = i+dir;
  if(j<0||j>=list.length){
    const ri = S.quiz.rounds.indexOf(a.round), rj = ri+dir;
    if(rj<0||rj>=S.quiz.rounds.length) return;
    list.splice(i,1);
    const t = S.quiz.rounds[rj];
    if(dir<0) t.questions.push(a.q); else t.questions.unshift(a.q);
  } else { list.splice(i,1); list.splice(j,0,a.q); }
  touch(); renderRail(); renderQForm();
}
</script>
<script>
"use strict";

/* ============================================================
   7. FICHE QUESTION
   ============================================================ */
const ptsTxt = n => n + " pt" + (Math.abs(n)>1 ? "s" : "");

function renderQForm(){
  const host = $("#qform");
  const a = findQ(S.selQ);
  if(!a){
    host.innerHTML = '<div class="empty"><h3>Aucune question</h3><p>Ajoute une question dans le rail de gauche pour commencer.</p></div>';
    return;
  }
  const quiz = S.quiz, q = a.q, round = a.round;
  const no = flat(quiz).findIndex(x=>x.q.id===q.id) + 1;
  const pts = qPoints(q, round, quiz);
  const tim = qTimer(q, quiz);

  host.innerHTML =
  '<div class="qeditor-hd">'+
    '<div class="eyebrow">Question '+no+' <span style="opacity:.5">·</span> '+esc(round.title)+'</div>'+
    '<div class="btn-row">'+
      '<button class="icon-btn" data-nudge="-1" title="Monter">▲</button>'+
      '<button class="icon-btn" data-nudge="1" title="Descendre">▼</button>'+
      '<button class="btn btn-sm btn-ghost" id="dupQ">Dupliquer</button>'+
      '<button class="btn btn-sm btn-danger" id="delQ">Supprimer</button>'+
    '</div>'+
  '</div>'+

  '<div class="panel">'+
    '<div class="panel-hd"><h3>Énoncé</h3>'+
      '<div class="seg" id="typeSeg">'+
        '<button data-t="free" aria-pressed="'+(q.type==="free")+'">Réponse libre</button>'+
        '<button data-t="qcm" aria-pressed="'+(q.type==="qcm")+'">QCM</button>'+
      '</div>'+
    '</div>'+
    '<div class="field"><textarea id="fText" placeholder="Écris ta question ici…">'+esc(q.text)+'</textarea></div>'+
    '<div id="ansZone" style="margin-top:14px"></div>'+
    '<div class="field" style="margin-top:14px">'+
      '<label for="fNote">Anecdote ou justification</label>'+
      '<textarea id="fNote" style="min-height:60px" placeholder="Affichée sous la réponse au moment de la révélation.">'+esc(q.note)+'</textarea>'+
    '</div>'+
  '</div>'+

  '<div class="panel">'+
    '<div class="panel-hd"><h3>Barème et chrono</h3>'+
      '<span class="pill gold">'+ptsTxt(pts)+(tim>0?" · "+tim+" s":" · sans chrono")+'</span>'+
    '</div>'+
    '<div class="grid-2">'+
      '<div class="field"><label for="fPts">Points de la question</label>'+
        '<input type="number" id="fPts" min="0" step="0.5" value="'+(q.points==null?"":q.points)+'" placeholder="Par défaut : '+quiz.settings.defaultPoints+'"></div>'+
      '<div class="field"><label for="fTim">Chrono en secondes</label>'+
        '<input type="number" id="fTim" min="0" step="5" value="'+(q.timer==null?"":q.timer)+'" placeholder="Par défaut : '+quiz.settings.defaultTimer+' — 0 = sans chrono"></div>'+
    '</div>'+
    (nb(round.coef,1)!==1
      ? '<p class="hint" style="margin-top:10px">Coefficient de la manche ×'+round.coef+' déjà compris dans le total ci-dessus.</p>'
      : '<p class="hint" style="margin-top:10px">Laisse vide pour suivre les réglages du quiz.</p>')+
    '<hr class="rule">'+
    '<label class="switch" style="align-items:flex-start"><input type="checkbox" id="fBuzz"'+(q.buzzMode?" checked":"")+'>'+
    '<span class="track" style="margin-top:2px"></span><span class="txt"><strong>Question au buzzer</strong>'+
    '<br><span class="hint">Les joueurs ne voient qu\'un bouton BUZZ. Le premier qui clique est le seul à pouvoir répondre — '+
    'les autres sont bloqués jusqu\'à ce que tu rendes la main.</span></span></label>'+
    '<hr class="rule">'+
    '<label class="switch" style="align-items:flex-start"><input type="checkbox" id="fHide"'+(q.hideText?" checked":"")+'>'+
    '<span class="track" style="margin-top:2px"></span><span class="txt"><strong>Ne pas afficher l\'énoncé tout de suite</strong>'+
    '<br><span class="hint">Pour laisser d\'abord regarder une image ou une vidéo, ou pour poser la question à l\'oral '+
    'sur un buzzer. Tu affiches l\'énoncé quand tu le décides, depuis l\'onglet Animer.</span></span></label>'+
  '</div>'+

  '<div class="panel">'+
    '<div class="panel-hd"><h3>Média de la question</h3>'+
      '<span class="hint">Musique, image ou vidéo projetée avec la question</span></div>'+
    '<div id="mediaBox"></div>'+
  '</div>'+

  '<div class="panel">'+
    '<div class="panel-hd"><h3>Média de la réponse</h3>'+
      '<span class="hint">Montré seulement après la révélation</span></div>'+
    '<div id="revealBox"></div>'+
  '</div>';

  /* — liaisons — */
  const txt = $("#fText");
  txt.oninput = e => {
    q.text = e.target.value;
    const lbl = $('[data-ttl="'+q.id+'"]');
    if(lbl){ lbl.textContent = shortLabel(q) || "Question vide"; lbl.classList.toggle("none", !shortLabel(q)); }
    touch();
  };
  $("#fNote").oninput = e => { q.note = e.target.value; touch(); };
  $("#fBuzz").onchange = e => { q.buzzMode = e.target.checked; touch(); renderRail(); };
  $("#fHide").onchange = e => { q.hideText = e.target.checked; touch(); };
  $("#fPts").oninput = e => { q.points = e.target.value===""?null:clamp(Number(e.target.value),0,999); touch(); refreshBadges(); };
  $("#fTim").oninput = e => { q.timer  = e.target.value===""?null:clamp(Number(e.target.value),0,3600); touch(); refreshBadges(); };
  $$("#typeSeg button").forEach(b=> b.onclick = ()=>{ q.type = b.dataset.t; touch(); renderRail(); renderQForm(); });
  $$("[data-nudge]").forEach(b=> b.onclick = ()=> nudge(Number(b.dataset.nudge)));
  $("#dupQ").onclick = ()=>{
    const copy = JSON.parse(JSON.stringify(q));
    copy.id = uid("q"); copy.choices.forEach(c=>c.id=uid("c"));
    round.questions.splice(a.i+1, 0, copy);
    S.selQ = copy.id; touch(); renderRail(); renderQForm();
  };
  $("#delQ").onclick = async ()=>{
    if(shortLabel(q) && !await confirmBox("Supprimer la question ?", "« "+esc(shortLabel(q))+" » sera retirée du quiz.","Supprimer",true)) return;
    round.questions.splice(a.i,1);
    const f = flat(quiz);
    S.selQ = f.length ? f[Math.min(a.i, f.length-1)].q.id : null;
    if(!f.length) round.questions.push(newQuestion()), S.selQ = round.questions[0].id;
    touch(); renderRail(); renderQForm();
  };

  renderAnswerZone(q);
  mediaEditor($("#mediaBox"), q.media, {timing:true, blur:true, hide:true});
  mediaEditor($("#revealBox"), q.reveal, {timing:true});

  function refreshBadges(){
    const p = qPoints(q, round, quiz), t = qTimer(q, quiz);
    const pill = host.querySelector(".pill.gold");
    if(pill) pill.textContent = ptsTxt(p)+(t>0?" · "+t+" s":" · sans chrono");
    const row = $('[data-q="'+q.id+'"] .pts');
    if(row) row.textContent = ptsTxt(p);
  }
}

function renderAnswerZone(q){
  const z = $("#ansZone");
  if(q.type === "free"){
    z.innerHTML =
      '<div class="field"><label for="fAns">Réponse attendue</label>'+
      '<input type="text" id="fAns" value="'+esc(q.answer)+'" placeholder="Ce que tu affiches à la révélation"></div>'+
      '<p class="hint" style="margin-top:8px">Rien n\'est corrigé automatiquement : c\'est toi qui valides chaque équipe, une par une.</p>';
    $("#fAns").oninput = e => { q.answer = e.target.value; touch(); };
    return;
  }
  const rows = q.choices.map((c,i)=>
    '<div class="choice'+(c.correct?" ok":"")+'" data-c="'+c.id+'">'+
      '<span class="choice-letter">'+LETTERS[i]+'</span>'+
      '<input type="text" value="'+esc(c.text)+'" data-ct="'+c.id+'" placeholder="Proposition '+LETTERS[i]+'">'+
      '<button class="choice-mark" data-ck="'+c.id+'" aria-pressed="'+!!c.correct+'" title="Marquer comme bonne réponse">✓</button>'+
      (q.choices.length>2 ? '<button class="icon-btn danger" data-cd="'+c.id+'" title="Retirer">✕</button>' : '<span style="width:34px"></span>')+
    '</div>').join("");

  z.innerHTML =
    '<div class="choices-edit">'+rows+'</div>'+
    '<div class="btn-row" style="margin-top:12px;justify-content:space-between">'+
      '<button class="btn btn-sm btn-outline" id="addChoice"'+(q.choices.length>=LETTERS.length?" disabled":"")+'>+ Proposition</button>'+
      '<label class="switch"><input type="checkbox" id="fMulti"'+(q.multi?" checked":"")+'><span class="track"></span>'+
      '<span class="txt">Plusieurs bonnes réponses</span></label>'+
    '</div>';

  $$("[data-ct]").forEach(i=> i.oninput = e => {
    q.choices.find(c=>c.id===i.dataset.ct).text = e.target.value; touch();
  });
  $$("[data-ck]").forEach(b=> b.onclick = ()=>{
    const c = q.choices.find(x=>x.id===b.dataset.ck);
    if(q.multi){ c.correct = !c.correct; }
    else { const was = c.correct; q.choices.forEach(x=>x.correct=false); c.correct = !was; }
    touch(); renderAnswerZone(q);
  });
  $$("[data-cd]").forEach(b=> b.onclick = ()=>{
    q.choices = q.choices.filter(c=>c.id!==b.dataset.cd); touch(); renderAnswerZone(q);
  });
  $("#addChoice").onclick = ()=>{ q.choices.push(newChoice()); touch(); renderAnswerZone(q); };
  $("#fMulti").onchange = e => {
    q.multi = e.target.checked;
    if(!q.multi){ let seen=false; q.choices.forEach(c=>{ if(c.correct && seen) c.correct=false; if(c.correct) seen=true; }); }
    touch(); renderAnswerZone(q);
  };
}

/* ============================================================
   8. ÉDITEUR DE MÉDIA (question et réponse)
   ============================================================ */
const ACCEPT = { image:"image/*", audio:"audio/*", video:"video/*" };
const KINDS  = [["none","Aucun"],["image","Image"],["audio","Audio"],["video","Vidéo"]];

function mediaEditor(host, m, opts){
  opts = opts||{};
  const has = !!(m.assetId || m.url);
  let h = '<div class="kind-tabs">'+ KINDS.map(k=>
      '<button class="kind-tab" data-k="'+k[0]+'" aria-pressed="'+(m.kind===k[0])+'">'+k[1]+'</button>').join("")+'</div>';

  if(m.kind !== "none"){
    h += '<div class="media-box'+(has?" filled":"")+'" style="margin-top:12px">';
    if(!has){
      h += '<label class="media-drop" id="drop">'+
             '<input type="file" accept="'+ACCEPT[m.kind]+'" hidden>'+
             '<strong>Choisir un fichier</strong> ou le déposer ici'+
             '<div class="hint" style="margin-top:4px">Le fichier reste sur ton ordinateur, dans la mémoire du navigateur.</div>'+
           '</label>'+
           '<div class="field"><label>Ou coller un lien</label>'+
           '<input type="url" data-url placeholder="https://… (mp3, mp4, image, ou lien YouTube)"></div>';
    } else {
      h += '<div class="media-prev"><div data-prev style="min-width:60px"></div>'+
           '<div class="media-name">'+esc(m.name||m.url)+
           (m.size?'<small>'+fmtSize(m.size)+'</small>':(m.url?'<small>lien externe</small>':''))+'</div>'+
           '<button class="btn btn-sm btn-danger" data-clear>Retirer</button></div>';
    }
    if(has && opts.timing && (m.kind==="audio"||m.kind==="video")){
      h += '<div class="grid-2">'+
        '<div class="field"><label>Démarrer à (s)</label><input type="number" min="0" step="1" data-start value="'+(m.start||0)+'"></div>'+
        '<div class="field"><label>Arrêter à (s)</label><input type="number" min="0" step="1" data-stop value="'+(m.stop||0)+'" placeholder="0 = jusqu\'à la fin"></div>'+
      '</div>';
    }
    if(has && opts.blur && (m.kind==="image" || m.kind==="video")){
      h += '<div class="field"><label>Flou de départ — '+(m.blur||0)+'</label>'+
           '<input type="range" min="0" max="40" step="1" data-blur value="'+(m.blur||0)+'">'+
           '<span class="hint">Tu réduis le flou en direct pendant la question, et l\'écran des joueurs suit.</span></div>';
    }
    if(has && opts.hide){
      h += '<label class="switch"><input type="checkbox" data-hidden'+(m.hidden?" checked":"")+'><span class="track"></span>'+
           '<span class="txt">Garder caché jusqu\'à ce que je lance le média</span></label>';
    }
    h += '</div>';
  }
  host.innerHTML = h;

  $$(".kind-tab", host).forEach(b=> b.onclick = ()=>{
    if(m.kind !== b.dataset.k){ m.kind = b.dataset.k; if(m.kind==="none"){ m.assetId=null; m.url=""; m.name=""; } }
    touch(); mediaEditor(host, m, opts); renderRail();
  });

  const fi = host.querySelector('#drop input[type=file]');
  if(fi){
    const drop = host.querySelector("#drop");
    fi.onchange = async ()=>{ if(fi.files[0]) await attach(fi.files[0]); };
    drop.ondragover  = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = ()=> drop.classList.remove("over");
    drop.ondrop = async e => {
      e.preventDefault(); drop.classList.remove("over");
      const f = e.dataTransfer.files[0]; if(f) await attach(f);
    };
  }
  const urlIn = host.querySelector("[data-url]");
  if(urlIn) urlIn.onchange = ()=>{
    const v = urlIn.value.trim();
    if(!v) return;
    m.url = v; m.name = v.split("/").pop().slice(0,50) || v; m.size = 0;
    touch(); mediaEditor(host, m, opts); renderRail();
  };
  const clear = host.querySelector("[data-clear]");
  if(clear) clear.onclick = ()=>{
    m.assetId=null; m.url=""; m.name=""; m.size=0; m.start=0; m.stop=0;
    touch(); mediaEditor(host, m, opts); renderRail();
  };
  const bind = (sel, fn) => { const n = host.querySelector(sel); if(n) n[n.type==="checkbox"||n.type==="range"?"oninput":"onchange"] = e => { fn(e.target); touch(); }; };
  bind("[data-start]", t => m.start = Math.max(0, Number(t.value)||0));
  bind("[data-stop]",  t => m.stop  = Math.max(0, Number(t.value)||0));
  bind("[data-hidden]",t => m.hidden = t.checked);
  const bl = host.querySelector("[data-blur]");
  if(bl) bl.oninput = e => {
    m.blur = Number(e.target.value);
    const lab = bl.parentNode.querySelector("label");
    if(lab) lab.textContent = "Flou de départ — "+m.blur;
    touch();
  };

  const prev = host.querySelector("[data-prev]");
  if(prev) fillPreview(prev, m);

  async function attach(file){
    const kindOK = (m.kind==="image"&&/^image\//.test(file.type)) ||
                   (m.kind==="audio"&&/^audio\//.test(file.type)) ||
                   (m.kind==="video"&&/^video\//.test(file.type));
    if(!kindOK && file.type){
      toast("Ce fichier est un "+(file.type.split("/")[0]||"type inconnu")+", pas un "+m.kind+".","bad");
      return;
    }
    const rec = await putAsset(file);
    m.assetId = rec.id; m.url=""; m.name = rec.name; m.size = rec.size;
    if(!DB.assetsOK) toast("Média chargé, mais il ne survivra pas au rechargement sur ce navigateur.","bad",5000);
    touch(); mediaEditor(host, m, opts); renderRail();
  }
}

async function fillPreview(node, m){
  const src = m.assetId ? await assetURL(m.assetId) : m.url;
  if(!src){ node.innerHTML = '<span class="hint">Média introuvable</span>'; return; }
  if(m.kind==="image") node.innerHTML = '<img alt="" src="'+esc(src)+'">';
  else if(m.kind==="audio") node.innerHTML = '<span style="font-size:1.9rem">♪</span>';
  else if(m.kind==="video") node.innerHTML = '<span style="font-size:1.9rem">▶</span>';
}

/* ============================================================
   9. ÉQUIPES
   ============================================================ */
function viewTeams(){
  const quiz = S.quiz;
  const cards = quiz.teams.map(t=>
    '<div class="team-edit" style="--tc:'+esc(t.color)+'">'+
      '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px">'+
        '<input type="text" value="'+esc(t.name)+'" data-tn="'+t.id+'" aria-label="Nom de l\'équipe">'+
        '<div class="swatches">'+ PALETTE.map(c=>
          '<button class="swatch" style="background:'+c+'" data-tc="'+t.id+'" data-col="'+c+'" '+
          'aria-pressed="'+(t.color.toLowerCase()===c.toLowerCase())+'" aria-label="Couleur '+c+'"></button>').join("")+
        '</div>'+
      '</div>'+
      '<div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px">'+
        '<span class="disp" style="font-size:1.7rem;line-height:1">'+teamScore(quiz,t.id)+'</span>'+
        '<button class="icon-btn danger" data-td="'+t.id+'" title="Retirer l\'équipe">✕</button>'+
      '</div>'+
    '</div>').join("");

  MAIN.innerHTML =
  '<div class="wrap">'+
    '<div class="page-hd">'+
      '<div><div class="eyebrow">'+esc(quiz.title)+'</div><h1>Équipes</h1>'+
      '<p class="sub">Des joueurs seuls ? Une équipe par personne. Les couleurs servent de repère sur la console pendant le quiz.</p></div>'+
      '<div class="btn-row">'+
        '<button class="btn btn-outline" id="bulkTeams">Coller une liste</button>'+
        '<button class="btn btn-gold" id="addTeam">+ Équipe</button>'+
      '</div>'+
    '</div>'+
    (quiz.teams.length
      ? '<div class="team-grid">'+cards+'</div>'
      : '<div class="empty"><h3>Personne en lice</h3><p>Ajoute au moins une équipe pour pouvoir attribuer des points pendant le quiz.</p>'+
        '<div class="btn-row" style="justify-content:center"><button class="btn btn-gold btn-lg" id="addTeam2">Ajouter une équipe</button></div></div>')+
  '</div>';

  const add = ()=>{ quiz.teams.push(newTeam(quiz)); touch(); render(); };
  if($("#addTeam"))  $("#addTeam").onclick  = add;
  if($("#addTeam2")) $("#addTeam2").onclick = add;
  if($("#bulkTeams")) $("#bulkTeams").onclick = bulkTeamsDialog;

  $$("[data-tn]").forEach(i=> i.oninput = e => {
    quiz.teams.find(t=>t.id===i.dataset.tn).name = e.target.value; touch();
  });
  $$("[data-tc]").forEach(b=> b.onclick = ()=>{
    quiz.teams.find(t=>t.id===b.dataset.tc).color = b.dataset.col; touch(); render();
  });

/* ============================================================
   10. SCORES — classement, ajustements, journal
   ============================================================ */
function ranking(quiz){
  return quiz.teams.map(t=>({team:t, score:teamScore(quiz,t.id)}))
    .sort((a,b)=> b.score-a.score || a.team.name.localeCompare(b.team.name));
}
function viewScores(){
  const quiz = S.quiz, rk = ranking(quiz);
  const max = Math.max(1, ...rk.map(r=>r.score));
  const order = [1,0,2];
  const podium = rk.length>=2
    ? '<div class="podium">'+ order.filter(i=>rk[i]).map(i=>{
        const r = rk[i], h = 60 + Math.round(120 * Math.max(0,r.score)/max) - i*8;
        return '<div class="plinth"><div class="pts num">'+r.score+'</div><div class="who">'+esc(r.team.name)+'</div>'+
          '<div class="block" style="height:'+Math.max(46,h)+'px;--tc:'+esc(r.team.color)+'">'+(i+1)+'</div></div>';
      }).join("")+'</div>' : "";

  const rows = rk.map((r,i)=>
    '<tr>'+
      '<td class="num" style="width:38px;color:var(--text-3)">'+(i+1)+'</td>'+
      '<td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+esc(r.team.color)+';margin-right:9px"></span>'+esc(r.team.name)+'</td>'+
      '<td class="n disp" style="font-size:1.25rem;width:70px">'+r.score+'</td>'+
      '<td style="width:190px"><div class="btn-row" style="gap:4px;justify-content:flex-end">'+
        '<button class="btn btn-sm" data-adj="'+r.team.id+'" data-d="-1">−1</button>'+
        '<button class="btn btn-sm" data-adj="'+r.team.id+'" data-d="1">+1</button>'+
        '<button class="btn btn-sm btn-outline" data-custom="'+r.team.id+'">Autre…</button>'+
      '</div></td>'+
    '</tr>').join("");

  const log = quiz.log.slice().reverse();
  const ledger = log.length ? log.map(e=>{
    const t = quiz.teams.find(x=>x.id===e.teamId);
    return '<div class="ledger-row">'+
      '<span class="who" style="color:'+esc(t?t.color:"var(--text-3)")+'">'+esc(t?t.name:"—")+'</span>'+
      '<span class="why">'+esc(e.reason||"")+'</span>'+
      '<span class="delta '+(e.delta>=0?"pos":"neg")+'">'+(e.delta>0?"+":"")+e.delta+'</span>'+
      '<button class="icon-btn danger" data-lx="'+e.id+'" title="Annuler cette ligne">✕</button>'+
    '</div>';
  }).join("") : '<p class="hint">Aucun point attribué pour l\'instant.</p>';

  MAIN.innerHTML =
  '<div class="wrap narrow">'+
    '<div class="page-hd">'+
      '<div><div class="eyebrow">'+esc(quiz.title)+'</div><h1>Scores</h1>'+
      '<p class="sub">Tu peux corriger n\'importe quel point à tout moment, même après coup. Chaque geste est tracé dans le journal.</p></div>'+
      '<div class="btn-row">'+
        '<button class="btn btn-ghost" id="copyRank">Copier le classement</button>'+
        '<button class="btn btn-danger" id="resetScores">Remettre à zéro</button>'+
      '</div>'+
    '</div>'+
    (rk.length ? podium+
      '<div class="panel"><div class="panel-hd"><h3>Classement</h3><span class="hint">Bonus et malus se règlent ici</span></div>'+
      '<div class="table-scroll"><table class="rank-table"><tbody>'+rows+'</tbody></table></div></div>'+
      '<div class="panel"><div class="panel-hd"><h3>Journal des points</h3><span class="pill">'+plural(quiz.log.length,"ligne")+'</span></div>'+
      '<div class="ledger">'+ledger+'</div></div>'
      : '<div class="empty"><h3>Pas encore d\'équipes</h3><p>Crée tes équipes pour voir le classement se remplir.</p>'+
        '<div class="btn-row" style="justify-content:center"><button class="btn btn-gold btn-lg" id="goTeams">Créer les équipes</button></div></div>')+

    render();
  });
  $$("[data-custom]").forEach(b=> b.onclick = ()=> customAdjustDialog(b.dataset.custom, ()=>render()));
  $$("[data-lx]").forEach(b=> b.onclick = ()=>{
    quiz.log = quiz.log.filter(e=>e.id!==b.dataset.lx); touch(); render();

    if(!await confirmBox("Remettre les scores à zéro ?", "Les "+plural(quiz.log.length,"ligne")+" du journal seront effacées. Les questions et les équipes sont conservées.","Tout effacer",true)) return;
    quiz.log = []; touch(); render(); toast("Scores remis à zéro.","good");
  };
  if($("#copyRank")) $("#copyRank").onclick = ()=>{
    const txt = quiz.title+"\n"+rk.map((r,i)=>(i+1)+". "+r.team.name+" — "+ptsTxt(r.score)).join("\n");
    copyText(txt, "Classement copié.");

}

/* Attribution et ajustements — tout passe par le journal, donc tout est réversible. */
function adjust(teamId, delta, reason, qKey){
  if(!delta) return;
  S.quiz.log.push({ id:uid("l"), teamId:teamId, delta:delta, reason:reason||"Ajustement", qKey:qKey||null, kind:qKey?"award":"adjust", ts:Date.now() });
  touch();
  if(typeof partiePousseEquipes === "function") partiePousseEquipes();
}
function setAward(teamId, qKey, delta, reason, verdict, ordre){
  S.quiz.log = S.quiz.log.filter(e=> !(e.kind==="award" && e.qKey===qKey && e.teamId===teamId));
  if(delta !== null) S.quiz.log.push({ id:uid("l"), teamId:teamId, delta:delta, reason:reason,
    qKey:qKey, kind:"award", verdict:verdict, ordre:ordre||0, ts:Date.now() });
  touch();
  if(typeof partiePousseEquipes === "function") partiePousseEquipes();
}

/* Bonus de rapidité : il revient à la première équipe, dans l'ordre d'arrivée
   des réponses, que l'animateur a validée « juste ». Recalculé à chaque
   validation, donc il suit tes changements d'avis. Hors partie en ligne il n'y a
   pas d'ordre d'arrivée connu, donc pas de bonus. */
const fmtDec = n => String(n).replace(".", ",");
const speedBonusFor = (quiz, teamId, qKey)=>
  quiz.log.find(e=> e.kind==="speed" && e.qKey===qKey && e.teamId===teamId) || null;

function applySpeedBonus(qKey){
  const quiz = S.quiz;
  const val = nb(quiz.settings.speedBonus, 0);
  const avant = quiz.log.length;
  quiz.log = quiz.log.filter(e=> !(e.kind==="speed" && e.qKey===qKey));
  let change = quiz.log.length !== avant;
  if(val > 0){
    const justes = quiz.log
      .filter(e=> e.kind==="award" && e.qKey===qKey && e.verdict==="full" && e.ordre)
      .sort((a,b)=> a.ordre - b.ordre);
    if(justes.length){
      quiz.log.push({ id:uid("l"), teamId:justes[0].teamId, delta:val,
        reason:"Bonus rapidité", qKey:qKey, kind:"speed", ts:Date.now() });
      change = true;
    }
  }
  if(change){ touch(); if(typeof partiePousseEquipes === "function") partiePousseEquipes(); }
}
const awardOf = (quiz,teamId,qKey)=> quiz.log.find(e=> e.kind==="award" && e.qKey===qKey && e.teamId===teamId) || null;

function customAdjustDialog(teamId, after){
  const t = S.quiz.teams.find(x=>x.id===teamId);
  const m = modal('<h2>Points pour '+esc(t.name)+'</h2><div class="body">'+
    '<div class="grid-2">'+
      '<div class="field"><label for="cd">Points (négatif pour un malus)</label><input type="number" id="cd" step="0.5" value="1"></div>'+
      '<div class="field"><label for="cr">Motif</label><input type="text" id="cr" placeholder="Bonus rapidité"></div>'+
    '</div></div>'+
    '<div class="foot"><button class="btn btn-ghost" data-x="no">Annuler</button>'+
    '<button class="btn btn-gold" data-x="yes">Appliquer</button></div>');
  const go = ()=>{
    const d = Number(m.root.querySelector("#cd").value)||0;
    const r = m.root.querySelector("#cr").value.trim() || (d>=0?"Bonus":"Malus");
    m.close();
    if(d){ adjust(teamId, d, r); if(after) after(); }
  };
  m.root.querySelector('[data-x="no"]').onclick = m.close;
  m.root.querySelector('[data-x="yes"]').onclick = go;
  m.root.querySelector("#cd").onkeydown = e => { if(e.key==="Enter") go(); };
  m.root.querySelector("#cr").onkeydown = e => { if(e.key==="Enter") go(); };
}
</script>
<script>
"use strict";

/* ============================================================
   11. ANIMATION — état, scène, console
   ============================================================ */
let TICK = null;          /* intervalle du chrono */

/* Le volume est un reglage de l'animateur, pas de la question : il survit au
   passage d'un extrait au suivant, et meme au rechargement de la page. */
/* Voir la page joueur : cle separee, sinon les deux volumes se confondent. */
const VOL_KEY = "regie-quiz:volume-animateur";
let VOLUME = 1;
try{
  const v = parseFloat(localStorage.getItem(VOL_KEY));
  if(v >= 0 && v <= 1) VOLUME = v;
}catch(e){}
function setVolume(v){
  VOLUME = clamp(Number(v)||0, 0, 1);
  try{ localStorage.setItem(VOL_KEY, String(VOLUME)); }catch(e){}
}
let AUDIO_CTX = null, VIZ_RAF = null, VIZ_ANALYSER = null;

function initPlay(){
  const list = flat(S.quiz);
  return { i:0, phase:"question", left:0, running:false, endAt:0, buzzes:[], blur:null, shown:false, peek:false,
           questionCachee: !!(list.length && list[0].q.hideText) };
}
const curItem = ()=> {
  const list = flat(S.quiz);
  return list.length ? list[clamp(S.play.i, 0, list.length-1)] : null;
};

function viewPlay(){
  const quiz = S.quiz, list = flat(quiz);
  if(!list.length){
    MAIN.innerHTML = '<div class="wrap"><div class="empty"><h3>Rien à animer</h3>'+
      '<p>Ce quiz n\'a aucune question. Retourne dans l\'onglet Questions pour en écrire.</p>'+
      '<div class="btn-row" style="justify-content:center"><button class="btn btn-gold btn-lg" id="goEd">Écrire les questions</button></div></div></div>';
    $("#goEd").onclick = ()=> setView("editor");
    return;
  }
  if(!S.play) S.play = initPlay();
  const p = S.play;
  const it = curItem();
  const pts = qPoints(it.q, it.round, quiz);
  const tim = qTimer(it.q, quiz);
  /* On reprend le flou de départ quand il vient d'être modifié dans la fiche
     de la question — sans écraser ce que l'animateur règle au curseur. */
  const flouFiche = (it.q.media.blur || 0);
  if(p.blur === null || p.blurFiche !== flouFiche)
    p.blur = (it.q.media.kind==="image" || it.q.media.kind==="video") ? flouFiche : 0;
  p.blurFiche = flouFiche;
  if(!p.running && !p.endAt) p.left = tim;

  /* On remplace tout l'écran. Un lecteur laissé derrière continuerait de jouer
     sans que rien ne puisse plus l'atteindre — mais le couper à chaque redessin
     relancerait l'extrait dès qu'on affiche l'énoncé ou qu'un joueur buzze, et
     la question « regarde d'abord, réponds ensuite » deviendrait impossible.
     On le met donc de côté tant qu'il s'agit du même extrait. */
  const sceneAvant = signatureScene();

     && hoteAvant.querySelector("audio, video")){

  MAIN.innerHTML =

        (tim>0

    '<path d="M24 44q8 7 16 0" stroke-width="2.8" stroke-linecap="round" fill="none"/>' +
      '<path d="M22 42q5-4 10 0q5-4 10 0" stroke-width="3" stroke-linecap="round" fill="none"/>',
  ][bouche];
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect width="64" height="64" fill="' + fond + '"/>' +

    '<g stroke="#2b2118" fill="#2b2118">' + regard + sourire + '</g></svg>';
}
/* Une image du pack reste chez le serveur : la console l'affiche par son URL
   plutôt que de la recopier dans la page. */
function avatarHTML(id, taille){
  const t = Math.round(Number(taille) || 32);
  const dim = ' style="width:'+t+'px;height:'+t+'px"';
  const s = String(id == null ? "" : id);
  if(s.indexOf("c:") === 0){
    const salon = (typeof PARTIE !== "undefined" && PARTIE.code) ? PARTIE.code : "";
    const url = "/api/avatarimg?room=" + encodeURIComponent(salon) +
                "&id=" + encodeURIComponent(s.slice(2));
    /* Meme repli que la page joueur : entre le retrait d'une image et le tour de
     boucle suivant, l'animateur verrait une icone cassee sur ses cartes. */
  return '<span class="av"'+dim+'><img src="'+esc(url)+'" alt="" onerror="this.remove()"></span>';
  }
  return '<span class="av"'+dim+'>'+avatarSVG(s)+'</span>';
}

/* Qui a la main, affiché en grand pour la salle. */
function renderBuzzBanner(){
  const b = $("#buzzBanner");
  if(!b) return;
  const gagnant = (typeof PARTIE !== "undefined" && PARTIE.buzzMode) ? PARTIE.buzzGagnant : null;
  b.hidden = !gagnant;
  if(gagnant){
    /* Le buzz ne transporte que le nom : l'avatar se retrouve dans la liste des
       joueurs du salon. */
    const j = (typeof PARTIE !== "undefined" && PARTIE.joueurs)
      ? PARTIE.joueurs.find(x => x.userId === gagnant.userId) : null;
    b.innerHTML = '<span class="bz" aria-hidden="true">\uD83D\uDD14</span>'+
